<title>The Missing Honey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: a picture-book page. One painted plate on top, the words underneath set large in phrases, and a short row of reading controls. It is a single warm-paper look on purpose, because the book is the world. */
:root {
  color-scheme: light;
  --page: #efe5cf;
  --mat: #f9f6ee;
  --ink: #3a2c1e;
  --ink-soft: #7a6850;
  --rule: rgba(58,44,30,.18);
  --honey: #c98a1b;
  --honey-wash: rgba(232,176,64,.22);
  --berry: #5b2a48;
  --display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --read: "Andika", "Trebuchet MS", system-ui, sans-serif;
  --book-w: min(1080px, 100%, max(420px, calc((100svh - 430px) * 1.5)));
}
* { box-sizing: border-box; }
html, body { background: var(--page); }
body {
  color: var(--ink); font-family: var(--read);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 32px;
}
.book { width: var(--book-w); margin: 0 auto; display: grid; gap: 12px; }
.spread { display: grid; gap: 12px; min-width: 0; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.3rem, 3.4vw, 1.9rem); margin: 0; line-height: 1.1; text-wrap: balance; }
.top .meta { display: flex; align-items: center; gap: 14px; color: var(--ink-soft); font-size: .95rem; }
.top .shelf { text-decoration: none; font-size: 1.3rem; line-height: 1; }
.basket { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; color: var(--berry); font-weight: 700; }
.basket svg { width: 22px; height: 22px; }

.plate { background: var(--mat); padding: clamp(6px, 1.4vw, 14px); box-shadow: 0 1px 0 var(--rule), 0 10px 30px rgba(58,44,30,.13); border-radius: 3px; }
.stage { position: relative; width: 100%; aspect-ratio: 3 / 2; max-width: 100%; overflow: hidden; background: var(--mat); }
.stage canvas, .stage img.fallback { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-style: italic; color: var(--ink-soft); font-size: 1.2rem; background: var(--mat); }

.pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); color: var(--ink); white-space: nowrap;
  font-size: clamp(1.1rem, 3.6vw, 2.2rem); text-shadow: 0 0 6px var(--mat), 0 0 12px var(--mat), 0 0 2px var(--mat);
  animation: pop 1.6s cubic-bezier(.2,1.6,.4,1) forwards; }
.pop.big { font-size: clamp(1.4rem, 5vw, 3rem); letter-spacing: .02em; }
.pop.small { font-size: clamp(.95rem, 2.8vw, 1.6rem); font-style: italic; }
.pop.z { font-size: clamp(.9rem, 2.4vw, 1.4rem); font-style: italic; color: var(--ink-soft); animation: zfloat 2.6s ease-out forwards; }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-8deg); }
  18% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
  32% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
  75% { opacity: 1; transform: translate(-50%, -62%) scale(1) rotate(-2deg); }
  100% { opacity: 0; transform: translate(-50%, -80%) scale(.96) rotate(-2deg); }
}
@keyframes zfloat {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
  20% { opacity: .9; }
  100% { opacity: 0; transform: translate(-10%, -260%) scale(1.15) rotate(12deg); }
}

.cover { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
  background: radial-gradient(ellipse at center, rgba(249,246,238,.86) 0%, rgba(249,246,238,.72) 55%, rgba(249,246,238,.35) 100%); transition: opacity .5s; }
.cover.gone { opacity: 0; pointer-events: none; }
.cover .inner { display: grid; gap: 10px; justify-items: center; }
.cover .kicker { font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
.cover h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.8rem, 6vw, 3.4rem); line-height: 1.02; margin: 0; text-wrap: balance; }
.cover p.by { font-family: var(--display); font-style: italic; color: var(--ink-soft); margin: 0 0 6px; font-size: clamp(1rem, 2.4vw, 1.25rem); }

.btn { font: inherit; font-weight: 700; color: var(--mat); background: var(--ink); border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 1.05rem; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rule); }
.btn:focus-visible, .chip:focus-visible, .star:focus-visible, .w:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
.btn[disabled] { opacity: .35; cursor: default; }
.btn svg { width: 20px; height: 20px; flex: none; }

.words { background: var(--mat); border-radius: 3px; box-shadow: 0 1px 0 var(--rule); padding: clamp(14px, 2.4vw, 24px) clamp(16px, 3vw, 32px); min-width: 0; }
.text { font-size: clamp(1.25rem, 2.7vw, 1.75rem); line-height: 1.95; margin: 0; max-width: 46ch; word-spacing: .06em; }
.phrase { display: inline-block; white-space: nowrap; margin-right: .42em; border-radius: .35em; padding: 0 .08em; transition: background-color .2s; }
.phrase.reading { background: rgba(58,44,30,.07); }
.marks .phrase:not(:last-child)::after { content: "/"; color: var(--rule); margin-left: .32em; font-weight: 400; }
.w { cursor: pointer; border-radius: .25em; transition: background-color .12s, color .12s; }
.w:hover { background: rgba(58,44,30,.06); }
.w.now { background: var(--honey); color: var(--mat); box-shadow: 0 0 0 .08em var(--honey); }
.readit { background: linear-gradient(transparent 58%, var(--honey-wash) 58%); box-decoration-break: clone; -webkit-box-decoration-break: clone; border-radius: .2em; animation: glow 2.4s ease-in-out infinite; padding: 0 .1em; }
.readit .phrase { font-weight: 700; }
.readit.done { animation: none; background: linear-gradient(transparent 58%, rgba(201,138,27,.12) 58%); }
.readit.done .phrase { color: #6a4a12; }
@keyframes glow { 50% { background-color: rgba(232,176,64,.12); } }
.star { display: inline-grid; place-items: center; width: 1.55em; height: 1.55em; vertical-align: -.32em; margin-left: .1em; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
  background: var(--honey); color: var(--mat); box-shadow: 0 0 0 4px rgba(232,176,64,.28); animation: pulse 1.8s ease-in-out infinite; }
.star svg { width: .95em; height: .95em; }
.readit.done .star { animation: none; background: transparent; color: var(--honey); box-shadow: inset 0 0 0 2px var(--honey); }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(232,176,64,0); transform: scale(1.06); } }
.hint { margin: 10px 0 0; color: var(--ink-soft); font-size: .95rem; line-height: 1.5; max-width: 62ch; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.bar .mid { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.berries { display: inline-flex; gap: 4px; margin-left: 2px; }
.berries i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; opacity: .5; display: inline-block; }
.berries i.got { background: var(--berry); box-shadow: none; opacity: 1; }
.btn.ghost .berries { color: var(--berry); }
.chip { font: inherit; font-size: .9rem; color: var(--ink-soft); background: transparent; border: 1.5px solid var(--rule); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-soft); }
.pageno { font-family: var(--display); font-style: italic; color: var(--ink-soft); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.end { text-align: center; display: grid; gap: 6px; justify-items: center; padding: 6px 0; }
.end h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 4vw, 2rem); margin: 0; }
.end p { margin: 0; color: var(--ink-soft); }
/* landscape screens: the words sit beside the picture, like a facing page */
@media (min-width: 860px) and (min-aspect-ratio: 5/4) {
  .book { width: min(1320px, 100%, max(760px, calc((100svh - 150px) * 2.15))); }
  .spread { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: start; }
  .text { font-size: clamp(1.15rem, 1.6vw, 1.55rem); line-height: 1.8; }
  .hint { font-size: .88rem; }
}@media (max-width: 520px) {
  .bar { display: grid; grid-template-columns: 1fr 1fr; }
  .bar .mid { grid-column: 1 / -1; order: -1; }
  #prev { justify-self: start; } #next { justify-self: end; }
  .btn { padding: 9px 15px; font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
  .readit, .star { animation: none; }
}
</style>

<script src="rig/grandpa.rig.js"></script>
<script>
(() => {
  // ================= Story =================
  // Each phrase is a breath-sized chunk. `who` picks the voice for read-aloud. `readit` marks the gold line that makes the picture move.
  const PAGES = [
    { scene: 'larder', phrases: [
      'Wren Hollyhock', 'was a small mouse', 'with a big straw hat.',
      'Every Midsummer,', 'Wren brought the honey', 'to the feast.',
      'This morning', 'she went to the larder.', 'She looked on the table.',
      { t: 'The honey jar was gone!', readit: true },
      'On the floor', 'were small, sticky footprints.',
      'Sticky feet, sticky feet,', 'where did you go?' ] },
    { scene: 'larder', phrases: [
      'Grandpa Burdock', 'was asleep by the fire.', 'Wren tapped his paw.',
      { t: '"The honey is gone!"', who: 'wren' }, 'she said.',
      { t: '"Hmm,"', who: 'grandpa' }, 'said Grandpa.',
      { t: '"Last night', who: 'grandpa', readit: true }, { t: 'I heard a thump.', who: 'grandpa', readit: true },
      { t: 'Then a bump.', who: 'grandpa', readit: true }, { t: 'Then a little giggle."', who: 'grandpa', readit: true },
      'He pointed up.', { t: '"It came from the attic."', who: 'grandpa' } ] },
    { scene: 'attic', phrases: [
      'Wren climbed', 'up to the attic.', 'It was dark', 'and dusty.', 'Apples sat in rows.',
      'The little window', 'was open.',
      { t: 'On the sill', readit: true }, { t: 'was a drip of honey!', readit: true },
      'A long string', 'hung by the window.', 'Someone small', 'had climbed down', 'in the night.',
      'Sticky feet, sticky feet,', 'where did you go?' ] }
  ].map(p => ({ ...p, phrases: p.phrases.map(x => typeof x === 'string' ? { t: x } : x), berries: 0, done: false }));

  // ================= Art and rigs =================
  // Rig coordinates are percent of each painting, so they hold at any resolution.
  const G = (x, y) => [x / 100, y / 100];
  const GB = (x0, y0, x1, y1) => [x0 / 100, y0 / 100, x1 / 100, y1 / 100];
  const RIGS = {
    wren: { src: 'art/wren.png', baseH: .38, feet: G(52, 91.5),
      bones: {
        head:  { pivot: G(55, 32), boxes: [GB(27, 4, 82, 31)], feather: .03 },
        ear:   { pivot: G(64, 17), boxes: [GB(61, 9, 68, 17.5)], feather: .01 },
        body:  { pivot: G(52, 55), boxes: [GB(31, 32, 76, 53)], feather: .035 },
        skirt: { pivot: G(50, 50), boxes: [GB(19, 53, 87, 85.5)], feather: .03 },
        tail:  { pivot: G(24, 83), boxes: [GB(5, 83, 21, 93), GB(5, 88.5, 37, 93)], feather: .012 } },
      eye: { c: G(61.5, 23.4), r: [2.7 / 100, 2.1 / 100], lid: G(67, 25) } },
    grandpa: { src: 'art/grandpa.png', baseH: .47, feet: G(50, 92.5),
      bones: {
        head: { pivot: G(57, 30), boxes: [GB(36, 4, 92, 30.5)], feather: .03 },
        ear:  { pivot: G(47, 19), boxes: [GB(37, 6, 50, 19)], feather: .012 },
        body: { pivot: G(50, 60), boxes: [GB(26, 30.5, 82, 58)], feather: .035 },
        tail: { pivot: G(31, 71), boxes: [GB(4, 71, 31, 96)], feather: .015 } },
      eye: { c: G(62.8, 21.1), r: [2.1 / 100, 1.05 / 100], lid: G(62.5, 18.3) } }
  };
  // light: where the warm glow sits (backdrop uv), its colour, spread and flicker
  const SCENES = {
    larder: { src: 'art/larder.jpg', light: [0.28, 0.47], lightCol: [1, .58, .22], base: .10, flick: .10, spread: 5.5, motes: [0, 1.5, .05, .85] },
    attic:  { src: 'art/attic.jpg',  light: [0.76, 0.33], lightCol: [1, .9, .66], base: .12, flick: .0, spread: 4.2, motes: [.85, 1.35, .15, .8] }
  };

  // ================= GL =================
  const canvas = document.getElementById('gl');
  let gl = canvas.getContext('webgl2', { premultipliedAlpha: true, antialias: true });
  const isGL2 = !!gl;
  if (!gl) gl = canvas.getContext('webgl', { premultipliedAlpha: true, antialias: true });
  if (!gl) {
    const img = document.createElement('img'); img.className = 'fallback'; img.src = SCENES.larder.src; img.alt = '';
    canvas.replaceWith(img); document.getElementById('loading').remove();
  }

  const NOISE = `
    float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
    float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }`;

  function shader(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); const name = info.name.replace(/\[0\]$/, ''); u[name] = gl.getUniformLocation(p, name); }
    return { p, u, a: name => gl.getAttribLocation(p, name) };
  }

  // World space: x 0..1.5, y 0..1 (y down). The camera (centre x, y and zoom) is applied in every vertex shader.
  const toClip = `uniform vec3 uCam;
    vec4 toClip(vec2 w){ vec2 v = (w - uCam.xy) * uCam.z + vec2(.75, .5); return vec4(v.x/1.5*2.-1., 1.-v.y*2., 0., 1.); }`;

  let backdropProg, puppetProg, shadowProg, blobProg, sparkProg, postProg;
  const MAXB = 8;
  if (gl) {
    backdropProg = program(`
      attribute vec2 aPos; varying vec2 vUv; ${toClip}
      void main(){ vUv = aPos; gl_Position = toClip(aPos*vec2(1.5,1.)); }`, `
      precision mediump float; varying vec2 vUv; uniform sampler2D uTex;
      void main(){ gl_FragColor = texture2D(uTex, vUv); }`);

    puppetProg = program(`
      attribute vec2 aUv;
      uniform vec4 uBox[${MAXB * 2}];
      uniform vec4 uXf[${MAXB}];      // angle, scaleY, tx, ty
      uniform vec2 uPivot[${MAXB}];
      uniform float uFeather[${MAXB}];
      uniform int uBones;
      uniform float uAspect;
      uniform vec2 uFeet; uniform vec2 uPos; uniform float uHeight; uniform float uFlip; uniform float uRock; uniform vec2 uSquash;
      varying vec2 vUv; varying vec2 vWorld;
      ${toClip}
      float boxW(vec4 b, vec2 p, float f){
        if (b.z <= b.x) return 0.;
        vec2 fx = vec2(f / uAspect, f);
        vec2 lo = smoothstep(b.xy - fx, b.xy + fx, p);
        vec2 hi = 1. - smoothstep(b.zw - fx, b.zw + fx, p);
        return lo.x*lo.y*hi.x*hi.y;
      }
      void main(){
        vec2 p = aUv; vec2 A = vec2(uAspect, 1.);
        vec2 a = p * A; vec2 disp = vec2(0.);
        for (int i = 0; i < ${MAXB}; i++) {
          if (i >= uBones) break;
          float w = max(boxW(uBox[i*2], p, uFeather[i]), boxW(uBox[i*2+1], p, uFeather[i]));
          if (w <= 0.) continue;
          vec4 x = uXf[i]; vec2 pv = uPivot[i] * A; vec2 d = a - pv;
          d.y *= x.y; float c = cos(x.x), s = sin(x.x);
          vec2 t = pv + vec2(c*d.x - s*d.y, s*d.x + c*d.y) + x.zw;
          disp += w * (t - a);
        }
        vec2 q = (a + disp - uFeet * A) * uHeight * uSquash;
        q.x *= uFlip;
        float c = cos(uRock), s = sin(uRock);
        q = vec2(c*q.x - s*q.y, s*q.x + c*q.y);
        vUv = p; vWorld = uPos + q;
        gl_Position = toClip(vWorld);
      }`, `
      precision mediump float;
      uniform sampler2D uTex; uniform vec2 uEyeC; uniform vec2 uEyeR; uniform float uBlink; uniform vec2 uLid;
      uniform vec2 uFire; uniform float uFireAmt; uniform vec3 uLightCol;
      varying vec2 vUv; varying vec2 vWorld;
      void main(){
        vec4 c = texture2D(uTex, vUv);
        vec2 e = (vUv - uEyeC) / uEyeR;
        float r2 = dot(e, e);
        if (uBlink > .02 && r2 < 1.35) {
          float lid = -1.2 + 2.4 * uBlink;
          if (e.y < lid) c = texture2D(uTex, uLid + vec2(e.x, 0.) * uEyeR * .6);
          // fully shut eyes become a soft curved line, like a sleepy smile
          float lineY = mix(lid, .18 + .3 * e.x * e.x, smoothstep(.85, 1., uBlink));
          c.rgb = mix(c.rgb, vec3(.22,.14,.09) * c.a, smoothstep(.22, .02, abs(e.y - lineY)) * smoothstep(1.3, .8, r2));
        }
        float side = exp(-pow(distance(vWorld, uFire), 2.) * 3.) * uFireAmt;
        c.rgb *= vec3(1.0, .985, .955) + (uLightCol - vec3(.94, .97, 1.)) * .1 * side;
        gl_FragColor = c;
      }`);

    shadowProg = program(`
      attribute vec2 aPos; uniform vec2 uC; uniform vec2 uR; varying vec2 vP; ${toClip}

    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    // shadows, then the cast from back to front
    gl.useProgram(shadowProg.p); gl.uniform3fv(shadowProg.u.uCam, cu);
    bindAttr(shadowProg, 'aPos', disc, 2);
    cast.forEach(c => c.drawShadow());
    [...cast].sort((a, b) => a.y - b.y).forEach(c => {
      if (c instanceof Puppet) { gl.useProgram(puppetProg.p); gl.uniform3fv(puppetProg.u.uCam, cu); bindAttr(puppetProg, 'aUv', mesh.b, 2); }
      c.draw(scene);
    });
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    // particles: falling dust (painted), then sparkles and motes (light)
    gl.useProgram(sparkProg.p); gl.uniform3fv(sparkProg.u.uCam, cu); gl.uniform1f(sparkProg.u.uPx, H / 330);
    let n = 0;
    dust = dust.filter(p => (p.life += dt) < p.max);
    dust.forEach(p => { p.vy += dt * .12; p.x += p.vx * dt + Math.sin(T * 2 + p.size * 9) * dt * .01; p.y += p.vy * dt;
      if (n < 600) sparkData.set([p.x, p.y, p.size, .55 * Math.min(1, (p.max - p.life) * 2)], 4 * n++); });
    if (n) {
      gl.bindBuffer(gl.ARRAY_BUFFER, sparkBuf); gl.bufferData(gl.ARRAY_BUFFER, sparkData.subarray(0, n * 4), gl.DYNAMIC_DRAW);
      bindAttr(sparkProg, 'aP', sparkBuf, 4);
      gl.uniform3f(sparkProg.u.uCol, .45, .34, .22); gl.uniform1f(sparkProg.u.uStar, 0); gl.uniform1f(sparkProg.u.uAdd, 0);
      gl.drawArrays(gl.POINTS, 0, n);
    }
    n = 0;
    sparks = sparks.filter(p => (p.life += dt) < p.max);
    sparks.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-dt * 2.5); p.vy = p.vy * Math.exp(-dt * 2.5) + dt * .01;
      const q = p.life / p.max; if (n < 600) sparkData.set([p.x, p.y, p.size * (1 - q * .5), Math.sin(Math.PI * Math.min(1, q * 1.2)) * 1.3], 4 * n++); });
    const sparkN = n;
    motes.forEach(m => {
      m.y -= dt * (.006 + m.s * .01); m.x += Math.sin(T * .3 + m.ph) * dt * .01;
      if (m.y < scene.motes[2] - .03) { m.y = scene.motes[3]; m.x = scene.motes[0] + Math.random() * (scene.motes[1] - scene.motes[0]); }
      if (n < 600) sparkData.set([m.x, m.y, 2.2 * (.6 + m.s), (.35 + .65 * (.5 + .5 * Math.sin(T * (.6 + m.s) + m.ph))) * .55], 4 * n++);
    });
    gl.bindBuffer(gl.ARRAY_BUFFER, sparkBuf); gl.bufferData(gl.ARRAY_BUFFER, sparkData.subarray(0, n * 4), gl.DYNAMIC_DRAW);
    bindAttr(sparkProg, 'aP', sparkBuf, 4);
    gl.blendFunc(gl.ONE, gl.ONE); gl.uniform1f(sparkProg.u.uAdd, 1);
    if (sparkN) { gl.uniform3f(sparkProg.u.uCol, 1, .86, .5); gl.uniform1f(sparkProg.u.uStar, 1); gl.drawArrays(gl.POINTS, 0, sparkN); }
    gl.uniform3f(sparkProg.u.uCol, 1, .86, .6); gl.uniform1f(sparkProg.u.uStar, 0); gl.drawArrays(gl.POINTS, sparkN, n - sparkN);

    // post: light, paper, page-turn fade
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.disable(gl.BLEND);
    gl.useProgram(postProg.p);
    bindAttr(postProg, 'aPos', quad, 2);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex); gl.uniform1i(postProg.u.uScene, 0);
    gl.uniform2f(postProg.u.uRes, W, H);
    const [lx, ly] = worldToScreen(scene.light[0] * 1.5, scene.light[1]);
    gl.uniform2f(postProg.u.uLight, lx / 100, ly / 100);
    gl.uniform3fv(postProg.u.uLightCol, scene.lightCol);
    gl.uniform1f(postProg.u.uLightAmt, scene.base + scene.flick * flick);
    gl.uniform1f(postProg.u.uSpread, scene.spread); gl.uniform1f(postProg.u.uZoom, cam.z);
    gl.uniform1f(postProg.u.uFade, fade);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    requestAnimationFrame(frame);
  }

  // ================= Start =================
  const cover = document.getElementById('cover');
  document.getElementById('open').addEventListener('click', () => {
    audio(); sfx.page(); cover.classList.add('gone'); setTimeout(() => cover.remove(), 600);
    goTo(0, true);
  });
  pagenoEl.textContent = `Page 1 of ${PAGES.length}`;
  renderWords(); showBerries(); document.getElementById('prev').disabled = true;

  if (gl) {
    const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    const rigFor = name => window.Puppet && window.Puppet.rigs && window.Puppet.rigs[name]
      ? window.Puppet.create(gl, window.Puppet.rigs[name], { base: 'rig/' }).catch(e => { console.warn(name + ' rig unavailable', e); return null; })
      : Promise.resolve(null);
    // the cut-out rigs come first; a single-painting puppet stands in if a rig cannot load
    const actor = (name, baseH) => rigFor(name).then(r => r ? new RigActor(r, name, baseH)
      : load(RIGS[name].src).then(img => { const p = new Puppet(name); p.tex = texture(img); p.aspect = img.width / img.height; return p; }));
    const painted = name => load(RIGS[name].src).then(img => { const p = new Puppet(name); p.tex = texture(img); p.aspect = img.width / img.height; return p; });
    Promise.all([load(SCENES.larder.src), load(SCENES.attic.src), actor('wren', .38), actor('grandpa', .42)]).then(([l, a, w, g]) => {
      bgTex[SCENES.larder.src] = texture(l); bgTex[SCENES.attic.src] = texture(a);
      wren = cast[0] = w; grandpa = cast[1] = g;
      document.getElementById('loading').remove();
      seedMotes(scene.motes);
      if (new URLSearchParams(location.search).has('page')) { cover.remove(); goTo(+new URLSearchParams(location.search).get('page') - 1, true); }
      requestAnimationFrame(t => { last = t; frame(t); });
    }).catch(err => { console.error(err); document.getElementById('loading').textContent = 'The paintings could not be loaded.'; });
  }
})();
</script>
