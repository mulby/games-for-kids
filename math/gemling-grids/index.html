<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#23263a">
<title>Gemling Grids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#23263a; --violet:#3a3360; --violet2:#4a4078; --gold:#ffd86b; --lav:#b9a6e8;
  --ink:#f7f2ff; --ink2:#cfc6ec; --stone:#4b4672; --stone2:#5d5789; --stoneDark:#2e2a4c;
  --rubbit:#ff6f8e; --sapphly:#4ea8ff; --topip:#ffcd3c; --mossling:#3fd394; --amethyx:#b77cff;
  --cs:84px; --tp:84px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:'Andika',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
  --head:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--slate);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{background:
  radial-gradient(1200px 700px at 20% -10%, #4a3f7e 0%, transparent 60%),
  radial-gradient(900px 600px at 110% 110%, #2d4a6b 0%, transparent 55%),
  radial-gradient(2px 2px at 12% 22%, #fff8 50%, transparent 51%),
  radial-gradient(2px 2px at 78% 14%, #fff6 50%, transparent 51%),
  radial-gradient(2px 2px at 64% 72%, #fff5 50%, transparent 51%),
  radial-gradient(2px 2px at 30% 84%, #fff5 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 90% 48%, #fff7 50%, transparent 51%),
  var(--slate)}
button{font-family:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
svg{display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(10px + var(--sat)) calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal))}
.screen.active{display:flex}
.btn{min-width:64px;min-height:64px;border-radius:22px;border:2px solid #ffffff2a;background:linear-gradient(180deg,#5a4f92,#3d3568);
  box-shadow:0 4px 0 #1d1934, 0 8px 18px #0006, inset 0 2px 0 #ffffff30;font-size:22px;font-weight:700;padding:8px 18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--head);letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d1934,0 4px 10px #0006}
.btn.gold{background:linear-gradient(180deg,#ffe58f,#f3b93b);color:#4a2e00;border-color:#fff6}
.btn.soft{background:linear-gradient(180deg,#4b4378,#352f5c)}
.icon{width:64px;height:64px;padding:0;border-radius:20px;flex:0 0 auto}
.icon>svg{width:44px;height:44px}
.icon.on{box-shadow:0 0 0 3px var(--gold),0 4px 0 #1d1934}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1 1 auto;min-width:0}
h1,h2,h3{font-family:var(--head);margin:0}

/* Nib caption bubble */
.nibdock{display:flex;align-items:center;gap:10px;min-width:0}
.nibbtn{width:72px;height:72px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 40%,#6c5f9c,#3a3360);box-shadow:0 0 0 3px #ffffff22,0 6px 14px #0007;padding:2px;flex:0 0 auto}
.nibbtn>svg{width:100%;height:100%}
.cap{position:relative;flex:1 1 auto;min-width:0;min-height:64px;background:#fffaf0;color:#3a2f55;border-radius:22px;padding:10px 64px 10px 16px;font-size:20px;line-height:1.3;box-shadow:0 6px 16px #0006;display:flex;align-items:center}
.cap:before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:#fffaf0;border-left:0}
.cap .say{position:absolute;right:6px;top:50%;margin-top:-28px;width:56px;height:56px;border-radius:18px;border:none;background:#efe6ff;display:flex;align-items:center;justify-content:center}
.cap .say>svg{width:34px;height:34px}
.cap.hidecap .txt{visibility:hidden}
.cap .txt{display:block}
.cap.pop{animation:capPop .35s ease}
@keyframes capPop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}

/* TITLE */
#title{align-items:center;justify-content:center;text-align:center;gap:14px}
#title h1{font-size:clamp(40px,7vw,72px);color:var(--gold);text-shadow:0 0 24px #ffd86b66,0 4px 0 #6b4a00;line-height:1}
#title .sub{font-family:var(--head);font-size:clamp(20px,3.2vw,30px);color:var(--ink2)}
#crystalBtn{border:none;background:none;width:min(52vw,300px);height:min(52vw,300px);padding:0;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 30px #b9a6e8aa)}
#crystalBtn>svg{width:100%;height:100%}
.tapme{font-size:26px;font-family:var(--head);color:#fff;background:#ffffff14;padding:12px 24px;border-radius:30px;animation:breathe 2.4s ease-in-out infinite}
.peek{display:flex;gap:6px;justify-content:center}
.peek>svg{width:60px;height:60px;animation:bob 2.6s ease-in-out infinite}
.peek>svg:nth-child(2){animation-delay:.3s}.peek>svg:nth-child(3){animation-delay:.6s}.peek>svg:nth-child(4){animation-delay:.9s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* MAP */
#map{padding:0}
.mapscroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(90px + var(--sat)) 0 calc(190px + var(--sab))}
.mapsvg{width:min(100%,560px);margin:0 auto;height:auto}
.maptop{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--sat)) calc(12px + var(--sar)) 10px calc(12px + var(--sal));display:flex;gap:10px;align-items:center;background:linear-gradient(#23263aee,#23263a00);z-index:3}
.mapbottom{position:absolute;left:0;right:0;bottom:0;padding:16px calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal));background:linear-gradient(#23263a00,#23263aee 30%);z-index:3;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.mapbottom .nibdock{max-width:760px;margin:0 auto;width:100%}
#exploreBtn{align-self:center;min-width:240px;min-height:76px;font-size:30px;border-radius:40px}
#exploreBtn>svg{width:40px;height:40px}
.holdbtn{position:relative}
.holdbtn .ring{position:absolute;inset:-4px;pointer-events:none}
.holdbtn .ring circle{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.spot-new{animation:spotNew 1.6s ease-out 2}
@keyframes spotNew{0%{transform:scale(.4);opacity:.3}50%{transform:scale(1.6);opacity:1}100%{transform:scale(1)}}
.cavname{font-family:var(--head)}

/* DOORS */
#doors{gap:12px}
.doorrow{flex:0 0 auto;margin:auto 0;display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,3vw,40px);padding:10px 0 18px;min-height:0;background:radial-gradient(55% 26px at 50% 100%,#00000066,transparent)}
@media (orientation:portrait){.door{width:clamp(104px,30vw,260px)}}
.door{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(104px,28vw,240px);min-height:64px}
.door>svg{width:100%;height:auto;filter:drop-shadow(0 10px 18px #0008)}
.door .lbl{font-family:var(--head);font-size:clamp(18px,2.6vw,26px);background:#ffffff18;padding:6px 16px;border-radius:20px}
.door:active>svg{transform:scale(.97)}
.door.little>svg{width:78%}
.doorwall{position:absolute;inset:0;z-index:-1;background:
 radial-gradient(60% 50% at 50% 100%,#5a4f8a55,transparent),
 repeating-linear-gradient(115deg,#ffffff05 0 2px,transparent 2px 40px)}

/* PUZZLE */
#pz{padding-bottom:calc(8px + var(--sab))}
.pztop{display:grid;grid-template-columns:auto auto 1fr auto auto auto;gap:8px;align-items:center}
.pztop .nibbtn{width:68px;height:68px}
.pztop .cap{font-size:19px}
.playarea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;touch-action:none;position:relative}
#pz.land .playarea{flex-direction:row;gap:64px}
.gridwrap{position:relative;padding:14px;border-radius:30px;background:
  radial-gradient(120% 90% at 30% 0%,#6a63a0 0%,transparent 60%),
  linear-gradient(160deg,#575089,#3a3563);
  box-shadow:inset 0 3px 0 #ffffff22,inset 0 -6px 0 #0003,0 14px 30px #0009, 0 0 0 4px #2b2748;touch-action:none}
.gridwrap.glowall{box-shadow:inset 0 3px 0 #ffffff22,0 0 0 4px var(--gold),0 0 60px #ffd86baa}
.grid{position:relative;display:grid;grid-template-columns:repeat(var(--n),var(--cs));grid-template-rows:repeat(var(--n),var(--cs));touch-action:none}
.cell{position:relative;width:var(--cs);height:var(--cs)}
.nook{position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle at 50% 38%,#191630 0%,#25213f 55%,#3b3566 100%);box-shadow:inset 0 6px 12px #000a,0 2px 0 #ffffff1c}
.cell.given .nook{background:radial-gradient(circle at 50% 40%,#5d5878,#4a4566 60%,#3d3858);box-shadow:inset 0 3px 6px #0006,0 2px 0 #ffffff22}
.cg{position:absolute;pointer-events:none;border-color:var(--cgc)}
.piece{position:absolute;left:7%;top:9%;width:86%;height:86%;pointer-events:none}
.piece>svg,.ghost>svg{width:100%;height:100%;overflow:visible}
.cell.hasbadge .piece,.cell.hasbadge .ghost{left:16%!important;top:24%!important;width:74%!important;height:74%!important}
.cell.given .piece{filter:grayscale(.45) brightness(.92) contrast(.95) drop-shadow(0 1px 0 #ffffff40)}
.cell.solvedwake .piece{filter:none}
.cell.hl .nook{box-shadow:inset 0 6px 12px #000a,0 0 0 4px #ffd86bcc,0 0 18px #ffd86b99;animation:hlPulse 1.4s ease-in-out infinite}
@keyframes hlPulse{50%{box-shadow:inset 0 6px 12px #000a,0 0 0 6px #ffd86b,0 0 26px #ffd86bcc}}
.cell.twin .piece{animation:wiggle .5s ease-in-out 3}
.cell.twin .nook{box-shadow:inset 0 6px 12px #000a,0 0 0 4px var(--lav),0 0 14px #b9a6e8aa}
.cell.wob .piece{animation:wobble .6s ease-in-out 3}
.cell.hover .nook{box-shadow:inset 0 6px 12px #000a,0 0 0 4px #ffffffaa}
.cell.ghostcell .ghost{position:absolute;left:7%;top:9%;width:86%;height:86%;opacity:.5;filter:brightness(1.35) saturate(.55);animation:ghostPulse 1.3s ease-in-out infinite;pointer-events:none}
.cell.ghostcell .nook{box-shadow:inset 0 6px 12px #000a,0 0 0 3px #fff;outline:3px dashed #ffffffcc;outline-offset:3px}
@keyframes ghostPulse{50%{opacity:.75;transform:scale(1.06)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-4deg)}60%{transform:translateX(5px) rotate(4deg)}}
.cell.placed .piece{animation:plop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes plop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.cell.wake .piece{animation:wakeUp .7s cubic-bezier(.3,1.7,.5,1) both}
@keyframes wakeUp{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-22%) scale(1.08)}100%{transform:translateY(0) scale(1)}}
.badge{position:absolute;left:2px;top:2px;right:2px;z-index:4;display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:3px;pointer-events:none}
.bn{white-space:nowrap;flex:0 0 auto;min-width:calc(var(--cs)*.36);height:calc(var(--cs)*.32);padding:0 6px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:calc(var(--cs)*.22);color:#2a1f4a;
  background:linear-gradient(160deg,#ffffff,#d9ccff);clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 100%,0 50%);filter:drop-shadow(0 2px 0 #0004)}
.badge.ok .bn{background:linear-gradient(160deg,#fff6c9,#ffd86b);animation:badgeGlow 1s ease 2}
@keyframes badgeGlow{50%{transform:scale(1.18)}}
.badge.focus .bn{animation:hlPulse2 1.2s ease-in-out infinite}
@keyframes hlPulse2{50%{transform:scale(1.15)}}
.meter{display:grid;grid-template-columns:repeat(5,var(--md));gap:2px;padding:3px 4px;background:#1b1733d9;border-radius:8px;--md:max(6px,calc(var(--cs)*.085))}
.meter i{width:var(--md);height:var(--md);border-radius:50%;border:1.5px solid #fffc;display:block}
.meter i.f{background:var(--gold);border-color:var(--gold)}
.meter i.x{background:var(--lav);border-color:var(--lav)}
.meter.under i:not(.f){animation:twinkle .9s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35;transform:scale(.8)}}
.puff{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff,#b9a6e8 60%,transparent 70%);pointer-events:none;z-index:9;animation:puff 1.2s ease-out forwards}
@keyframes puff{to{transform:translate(var(--dx),-50px) scale(1.8);opacity:0}}
.fly{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);pointer-events:none;z-index:9;transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .7s}
.shimmer{position:absolute;pointer-events:none;z-index:6;border-radius:20px;overflow:hidden}
.shimmer:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff9 50%,transparent 70%);transform:translateX(-100%);animation:sweep 1s ease-out forwards}
.shimmer.v:after{background:linear-gradient(190deg,transparent 30%,#fff9 50%,transparent 70%);transform:translateY(-100%);animation:sweepV 1s ease-out forwards}
@keyframes sweep{to{transform:translateX(100%)}}
@keyframes sweepV{to{transform:translateY(100%)}}
.crystals{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:visible}
.crystals g{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
.rowsum{position:absolute;right:-50px;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:var(--gold);color:#4a2e00;font-family:var(--head);font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:8;animation:plop .5s both}

.side{display:flex;flex-direction:column;align-items:center;gap:10px}
#pz.land .side{justify-content:center}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 14px;border-radius:28px;background:linear-gradient(180deg,#3d3768,#2e2a52);box-shadow:inset 0 2px 0 #ffffff1f,0 8px 20px #0007;touch-action:none}
#pz.land .tray{flex-direction:column;flex-wrap:nowrap}
.tpiece{width:var(--tp);height:var(--tp);border-radius:24px;position:relative;background:radial-gradient(circle at 50% 30%,#ffffff1c,transparent 70%);touch-action:none;transition:transform .15s,opacity .2s}
.tpiece>svg{width:100%;height:100%;pointer-events:none;overflow:visible}
.tpiece:after{content:"";position:absolute;left:12%;right:12%;bottom:-3px;height:8px;border-radius:50%;background:#0005;z-index:-1}
.tpiece.sel{transform:translateY(-8px) scale(1.08);background:radial-gradient(circle,#ffd86b66,transparent 70%);box-shadow:0 0 0 3px var(--gold)}
.tpiece.dim{opacity:.28;filter:grayscale(.7)}
.tpiece.bounce{animation:trayBounce .8s ease-in-out infinite}
@keyframes trayBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.model{display:none;background:#fffaf0;color:#3a2f55;border-radius:22px;padding:8px 12px;box-shadow:0 6px 16px #0006;max-width:min(94vw,440px)}
.model.show{display:block;animation:capPop .35s}
.model{width:min(94vw,340px)}
.model>svg{width:100%;height:auto;max-height:190px}
.dragghost{position:fixed;left:0;top:0;width:var(--cs);height:var(--cs);pointer-events:none;z-index:100;filter:drop-shadow(0 10px 12px #000a)}
.dragghost>svg{width:100%;height:100%;overflow:visible}
.lantern{position:relative}
.lantern.glow{animation:lanternGlow 1.4s ease-in-out infinite;background:linear-gradient(180deg,#7a6bc0,#4f4590)}
@keyframes lanternGlow{50%{box-shadow:0 0 0 4px var(--gold),0 0 30px #ffd86b,0 4px 0 #1d1934}}
.toolsmenu{position:absolute;z-index:40;right:12px;top:calc(90px + var(--sat));background:#2d2850;border-radius:24px;padding:12px;display:none;flex-direction:column;gap:10px;box-shadow:0 12px 30px #000a,0 0 0 2px #ffffff22}
.toolsmenu.show{display:flex}
.toolsmenu .btn{justify-content:flex-start;font-size:20px}
.toolsmenu .btn>svg{width:40px;height:40px}

/* OVERLAYS */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#140f2bcc;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));overflow-y:auto}
.ov.show{display:flex}
.panel{background:linear-gradient(180deg,#3f3870,#2b2650);border-radius:32px;padding:20px;box-shadow:0 0 0 3px #ffffff22,0 20px 50px #000c;max-width:720px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;margin:auto}
.panel h2{font-size:28px;color:var(--gold)}
.rulecard{background:#fffaf0;color:#3a2f55;border-radius:24px;padding:14px;width:100%;max-width:520px}
.rulecard>svg{width:100%;height:auto;max-height:42vh}
.rulecard p{font-size:22px;margin:8px 0 0;line-height:1.35}
.stage{min-height:200px;display:flex;align-items:center;justify-content:center;width:100%}
.stage>svg{max-width:100%}
.bigcard{width:min(76vw,300px)}
.bigcard>svg{width:100%;height:auto}
.gemreveal>svg{width:160px;height:160px;animation:gemSpin 1.2s cubic-bezier(.3,1.5,.5,1)}
@keyframes gemSpin{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.geode{border:none;background:none;padding:0;width:220px;height:220px}
.geode>svg{width:100%;height:100%}
.geode.shake{animation:wobble .4s}
.burst{animation:burst .9s ease-out}
@keyframes burst{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.sparkle-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* BINDER / SHELF / NOOK */
.hdr{display:flex;align-items:center;gap:10px;min-height:72px}
.hdr h2{font-size:clamp(24px,4vw,34px);color:var(--gold);flex:1;text-align:center}
.cards6{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,200px));justify-content:center;gap:clamp(8px,2vw,18px);align-content:center;justify-items:center;padding:8px;min-height:0}
@media (orientation:portrait){.cards6{grid-template-columns:repeat(2,minmax(0,200px))}}
.cardslot{border:none;background:none;padding:0;width:100%;max-width:200px;aspect-ratio:200/280;min-height:64px}
.cardslot>svg{width:100%;height:100%}
.binderfoot{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;padding-top:6px}
.pageinfo{font-family:var(--head);font-size:22px;min-width:80px;text-align:center}
.stickers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:30px;min-height:10px}
.lineup{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;touch-action:none}
.lu-cards,.lu-slots{display:flex;gap:10px;justify-content:center;flex-wrap:nowrap;width:100%}
.lu-card{width:min(21vw,120px);aspect-ratio:200/280;border-radius:12px;touch-action:none;position:relative}
.lu-card>svg{width:100%;height:100%;pointer-events:none}
.lu-card.sel{box-shadow:0 0 0 4px var(--gold);transform:translateY(-6px)}
.lu-card.gone{visibility:hidden}
.lu-slot{width:min(21vw,120px);aspect-ratio:200/280;border-radius:14px;border:3px dashed #ffffff55;background:#ffffff0d;position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:26px;color:#ffffff66}
.lu-slot.hl{border-color:var(--gold);box-shadow:0 0 18px #ffd86b88}
.lu-slot .lu-card{width:100%;position:absolute;inset:0}
.lu-slot.wob{animation:wobble .6s 2}
.lu-shelfline{width:100%;max-width:540px;height:14px;border-radius:7px;background:linear-gradient(#a8763e,#6d4720);margin-top:-8px}
.shelfwrap{flex:1;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:0;touch-action:none}
.shelf{width:min(100%,560px);flex:0 1 auto;background:linear-gradient(180deg,#3a2616,#2a1b10);border-radius:24px;padding:14px;box-shadow:inset 0 0 0 4px #5c3b1f,0 14px 30px #000a;overflow-y:auto;min-height:0}

<script id="kid-voice" data-voice-base="../../voice/">
/* KidVoice: one friendly voice for every game.
   Source of truth is shared/voice.js; tools/sync-voice.py copies it into each game
   so every index.html stays self-contained.

   1. Recorded clips first: if voice/manifest.json (made by tools/make-voice-clips.mjs)
      has a clip for a sentence, it plays that. Lines with numbers in them, like
      "7 plus 5" or "This lantern needs 7 fireflies", are stitched from shorter clips.
   2. Otherwise the device's own speech, using the most natural voice it has
      (Premium / Enhanced iPad voices first, never the novelty or robot voices).
   A grown-up can pin a voice from The Wonder Shelf; it is saved in localStorage["gfk-voice"]. */
(function () {
  if (window.KidVoice) return;
  const synth = window.speechSynthesis || null;
  const NOVELTY = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Kathy)\b/i;
  const ROBOTIC = /\b(Eddy|Flo|Reed|Rocko|Sandy|Shelley|Grandma|Grandpa)\b/i; // iOS "Eloquence" voices
  const FAVORITES = ['Ava', 'Zoe', 'Samantha', 'Allison', 'Susan', 'Nicky', 'Serena', 'Karen', 'Moira', 'Kate', 'Tessa', 'Evan', 'Nathan', 'Tom', 'Daniel'];

  function score(v) {
    const id = (v.name || '') + ' ' + (v.voiceURI || '');
    let s = 0;
    if (NOVELTY.test(v.name)) s -= 100;
    if (ROBOTIC.test(v.name)) s -= 60;
    if (/premium/i.test(id)) s += 60;
    else if (/enhanced/i.test(id)) s += 40;
    if (/siri/i.test(id)) s += 35;
    if (/Online \(Natural\)/i.test(id)) s += 45; // Edge
    if (/^Google/i.test(v.name)) s += 20;      // Chrome
    const fav = FAVORITES.findIndex(n => new RegExp('\\b' + n + '\\b', 'i').test(v.name));
    if (fav >= 0) s += 15 - fav * 0.5;
    if (/en[-_]US/i.test(v.lang)) s += 5; else if (/en[-_]GB/i.test(v.lang)) s += 4; else if (/en[-_](AU|IE|NZ|CA)/i.test(v.lang)) s += 3;
    if (v.default) s += 1;
    return s;
  }
  function voices() {
    try { return (synth && synth.getVoices() || []).filter(v => /^en/i.test(v.lang)); } catch (e) { return []; }
  }
  function ranked() { return voices().map(v => ({ v, s: score(v) })).sort((a, b) => b.s - a.s).map(x => x.v); }
  let chosen = null;
  function pick() {
    let pinned = null;
    try { pinned = localStorage.getItem('gfk-voice'); } catch (e) {}
    const list = ranked();
    chosen = (pinned && list.find(v => v.voiceURI === pinned || v.name === pinned)) || list[0] || null;
    return chosen;
  }
  if (synth) { pick(); try { synth.addEventListener('voiceschanged', pick); } catch (e) {} }

  /* ---- recorded clips ---- */
  let clips = null; // { base, lines: {key: file} }
  const base = (document.currentScript && document.currentScript.dataset.voiceBase) || '../../voice/';
  try {
    if (location.protocol !== 'file:') fetch(base + 'manifest.json').then(r => r.ok ? r.json() : null)
      .then(m => { if (m && m.lines) clips = { base, lines: m.lines }; }).catch(() => {});
  } catch (e) {}
  const key = t => String(t).toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  function clipPlan(text) {
    if (!clips) return null;
    const plan = [];
    for (const sentence of String(text).match(/[^.!?]+[.!?]*/g) || []) {
      const k = key(sentence); if (!k) continue;
      if (clips.lines[k]) { plan.push(clips.lines[k]); continue; }
      // Stitch lines built from a template, like "this lantern needs" + "7" + "fireflies".
      const parts = k.split(/\b(\d+)\b/).map(x => x.trim()).filter(Boolean);
      if (parts.length > 1 && parts.every(x => clips.lines[x])) { parts.forEach(x => plan.push(clips.lines[x])); continue; }
      return null; // one sentence without a recording: use speech for the whole line so it sounds even
    }
    return plan.length ? plan : null;
  }
  const audio = typeof Audio !== 'undefined' ? new Audio() : null;
  let queue = [];
  function playNext() {
    if (!audio || !queue.length) return;
    audio.src = clips.base + queue.shift();
    audio.play().catch(() => { queue = []; });
  }
  if (audio) audio.addEventListener('ended', playNext);
  function stopClips() { queue = []; if (audio) try { audio.pause(); } catch (e) {} }
  // Games call speechSynthesis.cancel() when they change screens; make that stop clips too.
  if (synth) try { const cancel = synth.cancel.bind(synth); synth.cancel = function () { stopClips(); cancel(); }; } catch (e) {}
  // iPad Safari only plays audio after a tap: unlock the player on the first touch.
  if (audio) document.addEventListener('pointerdown', function unlock() {
    document.removeEventListener('pointerdown', unlock, true);
    if (!audio.src) { audio.src = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA=='; audio.play().catch(() => {}); }
  }, true);

  function speak(text, opts) {
    opts = opts || {};
    if (!text) return;
    const plan = clipPlan(text);
    if (plan) {
      if (!opts.queue) { try { synth && synth.cancel(); } catch (e) { stopClips(); } }
      const idle = !queue.length && (!audio || audio.paused || audio.ended);
      queue.push(...plan);
      if (idle) playNext();
      return;
    }
    if (!synth) return;
    try {
      if (!opts.queue) synth.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      const v = chosen || pick();
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      // A natural pitch: raised pitch is what made the old voice sound strained and creepy.
      u.rate = Math.min(1.05, Math.max(0.75, opts.rate || 0.92));
      u.pitch = Math.min(1.05, Math.max(0.95, opts.pitch || 1));
      synth.speak(u);
    } catch (e) {}
  }

  window.KidVoice = { speak, stop: () => { try { synth ? synth.cancel() : stopClips(); } catch (e) {} }, pick, ranked, score, current: () => chosen, key };
})();
</script>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function range(n){return Array.from({length:n},(_,i)=>i)}
function today(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function newSeed(){return (Math.floor(Math.random()*2147483647)^(Date.now()&0x7fffffff))>>>0}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

 const v=o.vol||0.18;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+(o.a||0.012));g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);

function startLineup(){const pool=shuffle(ownedDistinct().slice(),Math.random).slice(0,4);if(pool.length<4)return;LU={cards:pool,slots:[null,null,null,null],sel:null,hint:0};renderLineup();say('Line-Up! Put the cards in order, from the fewest sparkles to the most.')}
function renderLineup(){const sorted=LU.cards.slice().sort((a,b)=>a.sparkle-b.sparkle);const used=new Set(LU.slots.filter(Boolean));
 let ghost=-1,ghostId=null;if(LU.hint>=3){for(let k=0;k<4;k++)if(LU.slots[k]!==sorted[k].id){ghost=k;ghostId=sorted[k].id;break}}
 const html=`<h2>Line-Up!</h2><div class="lineup" id="luArea"><div class="lu-cards">${LU.cards.map(c=>`<div class="lu-card ${used.has(c.id)?'gone':''} ${LU.sel===c.id?'sel':''} ${ghostId===c.id&&!used.has(c.id)?'bounce':''}" data-lc="${c.id}" style="${ghostId===c.id?'animation:trayBounce .8s infinite':''}">${cardSVG(c)}</div>`).join('')}</div>
  <div class="lu-slots">${LU.slots.map((id,k)=>`<div class="lu-slot ${(LU.hint>=1&&k===0&&!id)||ghost===k?'hl':''}" data-ls="${k}">${id?`<div class="lu-card" data-lc="${id}" data-from="${k}" style="${ghostId===id?'animation:trayBounce .8s infinite':''}">${cardSVG(CARD_BY[id])}</div>`:(ghost===k?`<div style="opacity:.35;width:100%;position:absolute;inset:0">${cardSVG(CARD_BY[ghostId])}</div>`:k+1)}</div>`).join('')}</div><div class="lu-shelfline"></div>
  ${LU.hint>=2?numPathCards(LU.cards):''}</div>${capHTML}<div class="row" style="flex-wrap:wrap;justify-content:center"><button class="btn icon" id="luHint" aria-label="Hint Lantern">${ICON.lantern}</button><button class="btn soft" id="luClose" style="min-width:150px">Back</button></div>`;
 const keepLine=lastLine;ovShow(html);fillNibs($('#ov'));const c=capEl();if(c){$('.txt',c).textContent=keepLine;c.classList.toggle('hidecap',!S.settings.captions)}
 $('#luClose').onclick=()=>{sfx('tap');LU=null;ovHide();renderBinder()};$('#luHint').onclick=()=>{LU.hint=Math.min(3,LU.hint+1);sfx('tap');renderLineup();say(LU.hint===1?'Which card has the fewest sparkles? It goes first.':LU.hint===2?'Look at the number path. The smallest number is closest to zero.':(LU.slots.every(Boolean)?'The bouncing card goes in the glowing spot. Tap a card on the shelf to take it off, then try again.':'The bouncing card goes in the glowing spot. Can you move it?'))};
 bindPress($('#luArea'),e=>{const card=e.target.closest('[data-lc]');if(card)return{type:'card',id:card.dataset.lc,from:card.dataset.from!=null?+card.dataset.from:null,el:card,drag:true};const sl=e.target.closest('[data-ls]');if(sl)return{type:'slot',k:+sl.dataset.ls};return null},
  {tap(info){if(info.type==='card'){if(info.from!=null){LU.slots[info.from]=null;sfx('back');renderLineup();return}LU.sel=LU.sel===info.id?null:info.id;sfx('lift');renderLineup()}else if(info.type==='slot'&&LU.sel){luPlace(LU.sel,info.k,null)}},
   dragStart(p){p.ghost=makeGhost(cardSVG(CARD_BY[p.info.id]),p.info.el.getBoundingClientRect().width)},dragMove(p,e){moveGhost(p.ghost,e.clientX,e.clientY)},
   drop(p,e){killGhost(p.ghost);const el=document.elementFromPoint(e.clientX,e.clientY);const sl=el&&el.closest('[data-ls]');if(sl)luPlace(p.info.id,+sl.dataset.ls,p.info.from);else if(p.info.from!=null){LU.slots[p.info.from]=null;renderLineup()}},cancel(p){killGhost(p.ghost)}})}
function numPathCards(cards){const W=420,x0=20,x1=400,max=50,y=52;let s=`<svg viewBox="0 0 ${W} 84" style="width:100%;max-width:520px;background:#fffaf0;border-radius:16px"><line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#8a7fb8" stroke-width="3"/>`;
 for(let k=0;k<=max;k+=5){const x=x0+(x1-x0)*k/max;s+=`<line x1="${x}" y1="${y-6}" x2="${x}" y2="${y+6}" stroke="#8a7fb8" stroke-width="2"/><text x="${x}" y="${y+24}" text-anchor="middle" font-family="Fredoka" font-size="12" fill="#3a2f55">${k}</text>`}
 const cs=cards.slice().sort((a,b)=>a.sparkle-b.sparkle);let prevX=-99,up=false;
 cs.forEach(c=>{const x=x0+(x1-x0)*c.sparkle/max;up=(x-prevX<26)?!up:false;prevX=x;const ly=up?14:34;s+=`<line x1="${x}" y1="${ly+3}" x2="${x}" y2="${y-8}" stroke="#3a2f5566" stroke-width="1.5"/><circle cx="${x}" cy="${y}" r="8" fill="${hslPal(c.hue).color}" stroke="#3a2f55" stroke-width="2"/><text x="${x}" y="${ly}" text-anchor="middle" font-family="Fredoka" font-size="15" font-weight="700" fill="#3a2f55">${c.sparkle}</text>`});return s+'</svg>'}
function luPlace(id,k,from){if(from!=null)LU.slots[from]=null;const old=LU.slots.indexOf(id);if(old>=0)LU.slots[old]=null;LU.slots[k]=id;LU.sel=null;sfx('pop');
 if(LU.slots.every(Boolean)){const ok=LU.slots.every((x,i)=>i===0||CARD_BY[LU.slots[i-1]].sparkle<CARD_BY[x].sparkle);renderLineup();
  if(ok){sfx('chord');const st=STICKERS.find(x=>S.stickers.indexOf(x)<0)||STICKERS[S.stickers.length%STICKERS.length];S.stickers.push(st);addShared({id:'sticker-'+S.stickers.length,name:'Line-Up sticker',emoji:st,rarity:'common'});save();
   const nums=LU.slots.map(x=>CARD_BY[x].sparkle);say(`${nums.join(', ')}. From fewest to most! You earned a ${st} sticker for your binder!`);setTimeout(()=>{if(LU){ovShow(`<h2>A binder sticker!</h2><div class="stage" style="font-size:120px">${st}</div>${capHTML}<button class="btn gold" id="luDone" style="min-width:180px">Yay!</button>`);fillNibs($('#ov'));$('.txt',capEl()).textContent=lastLine;$('#luDone').onclick=()=>{LU=null;ovHide();renderBinder()}}},1500)}
  else{sfx('hmm');LU.hint=Math.max(LU.hint,0);$$('.lu-slot').forEach((s,i)=>{if(i>0&&CARD_BY[LU.slots[i-1]].sparkle>CARD_BY[LU.slots[i]].sparkle)s.classList.add('wob')});say('Hmm, a couple of cards want to swap. Look at their sparkle numbers. The lantern can help!')}}
 else renderLineup()}

/* ---------- GEM SHELF ---------- */
function openShelf(){sfx('tap');show('shelfScr');ui.shelfSel=null;renderShelf();say(S.gems.owned.length?'Drag your gems onto the shelf. Put them anywhere you like!':'Solve a wall to earn your first gem!')}
function renderShelf(){const placed=S.gems.placed;const slots=Math.max(24,Math.ceil((S.gems.owned.length+1)/6)*6);const bySlot={};placed.forEach(p=>bySlot[p.slot]=p.id);const gById={};S.gems.owned.forEach(g=>gById[g.id]=g);
 let h='';for(let p=0;p<slots/6;p++){h+='<div class="plank">';for(let k=0;k<6;k++){const s=p*6+k;const gid=bySlot[s];h+=`<div class="gslot" data-slot="${s}">${gid&&gById[gid]?`<div data-gem="${gid}" data-from="${s}" style="width:84%;height:84%">${gemStoneSVG(gById[gid].type)}</div>`:''}</div>`}h+='</div>'}
 $('#shelf').innerHTML=h;const placedIds=new Set(placed.map(p=>p.id));const loose={};S.gems.owned.forEach(g=>{if(!placedIds.has(g.id))(loose[g.type]=loose[g.type]||[]).push(g.id)});
 $('#pouch').innerHTML=Object.keys(loose).length?Object.keys(loose).map(t=>`<div class="pgem ${ui.shelfSel&&gById[ui.shelfSel]&&gById[ui.shelfSel].type===t&&!placedIds.has(ui.shelfSel)?'sel':''}" data-gem="${loose[t][0]}" aria-label="${GEMS[t].name}">${gemStoneSVG(t)}<span class="cnt">${loose[t].length}</span></div>`).join(''):`<div style="padding:20px;color:#cfc6ec;font-size:18px">${S.gems.owned.length?'All your gems are on the shelf!':'Your gem pouch is empty.'}</div>`}
function shelfPlace(gid,slot){const P=S.gems.placed;const fromIdx=P.findIndex(p=>p.id===gid);const occ=P.findIndex(p=>p.slot===slot);
 if(occ>=0&&P[occ].id!==gid){if(fromIdx>=0){P[occ].slot=P[fromIdx].slot}else P.splice(occ,1)}
 const fi=P.findIndex(p=>p.id===gid);if(fi>=0)P[fi].slot=slot;else P.push({id:gid,slot});ui.shelfSel=null;sfx('gem');save();renderShelf()}

 s+='</svg>';$('#nookScene').innerHTML=s;
 const hats=S.nib.hats.filter(h=>h!=='scarf');$('#hats').innerHTML=hats.length?['none'].concat(hats).map(h=>`<button class="btn soft ${((S.nib.wearing||'none')===h)?'on':''}" data-hat="${h}" aria-label="${h}">${h==='none'?nibSVG({}):nibSVG({hat:h})}</button>`).join(''):''}

/* ---------- GROWN-UPS ---------- */
function openGrown(){const T=S.tracks;const ladder=(arr,tr,track)=>`<div class="lv">${arr.slice(1).map((L,i)=>`<span class="${i+1===tr.level?'cur':''} ${i+1===tr.best?'best':''}" title="${esc(L.desc)}">${L.id}</span>`).join('')}</div><div class="small"><b>Now:</b> ${arr[tr.level].id}: ${esc(arr[tr.level].desc)}<br><b>Best reached:</b> ${arr[tr.best].id}. Streak ${tr.streak}, miss streak ${tr.missStreak}.</div>`;
 const days=[];for(let k=0;k<7;k++){const d=new Date();d.setDate(d.getDate()-k);days.push(today(d))}
 const dayRow=k=>{const dd=S.daily[k]||{walls:0,little:0,big:0,picture:0};const m=Math.round(S.dailyMinutes[k]||0);return `<tr><td>${k===today()?'<b>Today</b>':k}</td><td>${m}</td><td>${dd.walls||0}</td><td>${dd.little||0} / ${dd.big||0} / ${dd.picture||0}</td></tr>`};
 const hToday=S.history.filter(h=>today(new Date(h.t))===today());const firstSeen={};S.history.forEach(h=>{const k=h.track+':'+h.level;if(!firstSeen[k])firstSeen[k]=today(new Date(h.t))});
 const skill=h=>(h.track==='logic'?LOGIC:SUM)[h.level].skill;const prac=[...new Set(hToday.map(skill))];const nw=[...new Set(hToday.filter(h=>firstSeen[h.track+':'+h.level]===today()&&S.history.filter(x=>x.track===h.track&&x.level===h.level).length===hToday.filter(x=>x.track===h.track&&x.level===h.level).length).map(skill))];
 const summary=hToday.length?`Solved ${hToday.length} wall${hToday.length===1?'':'s'}. Practiced: ${prac.join(', ')}.${nw.length?' New: '+nw.join(', ')+'.':''}`:'No walls solved yet today.';
 const stat=k=>{const t=T[k];return `<tr><td>${k==='logic'?'Logic (Picture Door)':'Sum (Big Door)'}</td><td>${t.solves}</td><td>${t.solves?Math.round(100*t.clean/t.solves):0}%</td><td>${t.solves?(t.hintSteps/t.solves).toFixed(1):'0'}</td><td>${t.glasses}</td></tr>`};
 const last=S.history.slice(-20).reverse().map(h=>`<tr><td>${new Date(h.t).toLocaleDateString()}</td><td>${(h.track==='logic'?LOGIC:SUM)[h.level].id}${h.tut?' (tutorial)':''}</td><td>${h.door}</td><td>${h.n}×${h.n}</td><td>${h.blanks}</td><td>${h.hintSteps} (max ${h.hintMax})</td><td>${h.twins}</td><td>${h.wrongCages}</td><td>${(h.ms/60000).toFixed(1)}</td></tr>`).join('');
 const opt=(arr,v)=>arr.slice(1).map((L,i)=>`<option value="${i+1}" ${i+1===v?'selected':''}>${L.id}: ${esc(L.desc).slice(0,60)}</option>`).join('');
 const rate=recentCleanRate();
 $('#grownPanel').innerHTML=`<div class="row"><h2 class="grow">Grown-ups: Gemling Grids</h2><button class="gbtn prim" id="gClose">Close</button></div>
 <div class="small">Every puzzle is a Latin-square logic grid (sudoku/KenKen style). The <b>Sum track</b> practises addition facts and missing addends through “nooks” whose pieces must add to a number (later: differences). The <b>Logic track</b> builds reasoning with pictures only. Levels move up after 3 clean solves (2 if she's above 95%) and down after 2 non-clean solves; the very first levels (LG1–LG3, S1–S2) can skip ahead after one perfect first try. If her recent clean rate dips below 70%, the Big Door offers one level easier for a couple of sets. Clean = never needed more than the first hint nudge on any cell. She never sees levels or percentages.</div>
 <h3>Summary</h3><div><b>${esc(summary)}</b> Total walls: ${S.totalWalls}. Rolling clean rate (last 8): ${rate===null?'n/a':Math.round(rate*100)+'%'}${S.softLanding?' (soft landing active)':''}.</div>
 <h3>Skill ladders</h3><div><b>Logic</b>${ladder(LOGIC,T.logic,'logic')}</div><div><b>Sum</b>${ladder(SUM,T.sum,'sum')}</div>
 <div class="small"><b>Sum fade stage:</b> ${STAGE_NAMES[Math.max(0,SUM[T.sum.level].stage-S.fadeStage.drop)]} (drop ${S.fadeStage.drop} from the level default).</div>
 <h3>Last 7 days</h3><div class="scroll"><table><tr><th>Day</th><th>Minutes</th><th>Walls</th><th>Doors L / B / P</th></tr>${days.map(dayRow).join('')}</table></div>
 <h3>By track</h3><div class="scroll"><table><tr><th>Track</th><th>Solves</th><th>Clean</th><th>Avg hint steps</th><th>Sparkle Glasses used</th></tr>${stat('sum')}${stat('logic')}</table></div>
 <h3>Last 20 puzzles</h3><div class="scroll"><table><tr><th>Date</th><th>Level</th><th>Door</th><th>Grid</th><th>Blanks</th><th>Hints</th><th>Twins</th><th>Wrong nooks</th><th>Min</th></tr>${last||'<tr><td colspan="9">None yet</td></tr>'}</table></div>
 <h3>Settings</h3><div class="set"><label>Logic start <select id="gLog">${opt(LOGIC,T.logic.level)}</select></label><label>Sum start <select id="gSum">${opt(SUM,T.sum.level)}</select></label></div>
 <div class="set"><label><input type="checkbox" id="gVoice" ${S.settings.voice?'checked':''}> Voice</label><label>Speed <input type="range" id="gRate" min="0.6" max="1.2" step="0.05" value="${S.settings.rate}" style="width:140px;height:40px"></label><label><input type="checkbox" id="gSfx" ${S.settings.sfx?'checked':''}> Sound effects</label><label><input type="checkbox" id="gCap" ${S.settings.captions?'checked':''}> Captions</label><label><input type="checkbox" id="gDots" ${S.settings.alwaysDots?'checked':''}> Always show dots</label></div>

function setupHold(btn,ms,fn){btn.innerHTML=ICON.mushroom+`<svg class="ring" viewBox="0 0 72 72"><circle cx="36" cy="36" r="33" stroke-dasharray="207.3" stroke-dashoffset="207.3"/></svg>`;let t=null,raf=null,start=0;const ring=$('.ring circle',btn);
 const reset=()=>{clearTimeout(t);cancelAnimationFrame(raf);t=null;ring.style.strokeDashoffset=207.3};
 btn.addEventListener('pointerdown',e=>{e.preventDefault();try{btn.setPointerCapture(e.pointerId)}catch(_){}start=performance.now();const tick=()=>{const p=Math.min(1,(performance.now()-start)/ms);ring.style.strokeDashoffset=207.3*(1-p);if(p<1)raf=requestAnimationFrame(tick)};tick();t=setTimeout(()=>{reset();fn()},ms)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,()=>{if(t)reset()}))}

/* ---------- POINTER (tap + drag) ---------- */
function bindPress(container,resolver,H){if(container._bound)container.removeEventListener('pointerdown',container._bound);let press=null;
 const down=e=>{if(press)return;const info=resolver(e);if(!info)return;e.preventDefault();ensureAudio();ui.lastInteract=Date.now();press={id:e.pointerId,info,sx:e.clientX,sy:e.clientY,drag:false};try{container.setPointerCapture(e.pointerId)}catch(_){}};
 const move=e=>{if(!press||e.pointerId!==press.id)return;if(!press.drag&&press.info.drag&&Math.hypot(e.clientX-press.sx,e.clientY-press.sy)>9){press.drag=true;H.dragStart(press,e)}if(press.drag)H.dragMove(press,e)};
 const up=e=>{if(!press||e.pointerId!==press.id)return;const p=press;press=null;if(p.drag)H.drop(p,e);else H.tap(p.info,e)};
 const cancel=e=>{if(!press)return;const p=press;press=null;if(p.drag&&H.cancel)H.cancel(p)};
 container._bound=down;container.addEventListener('pointerdown',down);if(!container._moveBound){container._moveBound=true;container.addEventListener('pointermove',e=>container._move&&container._move(e));container.addEventListener('pointerup',e=>container._up&&container._up(e));container.addEventListener('pointercancel',e=>container._cancel&&container._cancel(e))}
 container._move=move;container._up=up;container._cancel=cancel}
function makeGhost(svg,size){const g=document.createElement('div');g.className='dragghost';g.style.width=g.style.height=size+'px';if(size&&svg.indexOf('0 0 200 280')>0){g.style.height=size*1.4+'px'}g.innerHTML=svg;document.body.appendChild(g);return g}
function moveGhost(g,x,y){if(!g)return;const w=g.offsetWidth,h=g.offsetHeight;g.style.transform=`translate(${x-w/2}px,${y-h/2-28}px) scale(1.08)`}
function killGhost(g){if(g)g.remove()}
function cellAt(x,y){const g=$('#grid').getBoundingClientRect();const n=cur.P.n;const cs=g.width/n;const c=Math.floor((x-g.left)/cs),r=Math.floor((y-g.top)/cs);if(r<0||c<0||r>=n||c>=n)return -1;return r*n+c}
function setupPuzzleInput(){let hover=-1;
 bindPress($('#playArea'),e=>{if(!cur||cur.solved)return null;const tp=e.target.closest('.tpiece');if(tp)return{type:'tray',v:+tp.dataset.v,drag:true,el:tp};const cell=e.target.closest('.cell');if(cell){const i=+cell.dataset.i;const v=cur.place[i];return{type:'cell',i,v,drag:!!v&&!cur.P.givens[i],el:cell}}return null},
 {tap(info){if(!cur||cur.solved)return;if(info.type==='tray'){ui.sel=ui.sel===info.v?0:info.v;if(ui.sel)sfx('lift');renderTray();return}
   const i=info.i,P=cur.P;if(P.givens[i]){if(ui.sel){say('That Gemling is sleeping in stone. Try an empty nook!');sfx('hmm')}return}
   if(ui.sel){const v=ui.sel;ui.sel=0;place(i,v,null);return}
   if(cur.place[i]){const v=cur.place[i];removeAt(i);ui.sel=v;sfx('lift');renderTray();return}
   if(cur.hint&&cur.hint.step>=3&&cur.hint.target===i){say(`Drag ${KINDS[P.sol[i]].name} from the tray, or tap it and then tap here.`)}},
  dragStart(p,e){const v=p.info.type==='tray'?p.info.v:p.info.v;p.v=v;p.from=p.info.type==='cell'?p.info.i:null;ui.sel=0;sfx('lift');const cs=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cs'))||84;p.ghost=makeGhost(gemSVG(v,{mode:pieceMode()}),cs);
   if(p.from!=null){const pc=$(`.cell[data-i="${p.from}"] .piece`);if(pc)pc.style.opacity='.25'}renderTray()},
  dragMove(p,e){moveGhost(p.ghost,e.clientX,e.clientY);const i=cellAt(e.clientX,e.clientY-28);if(i!==hover){if(hover>=0){const o=$(`.cell[data-i="${hover}"]`);o&&o.classList.remove('hover')}hover=i;if(i>=0&&!cur.P.givens[i]){const o=$(`.cell[data-i="${i}"]`);o&&o.classList.add('hover')}}},
  drop(p,e){killGhost(p.ghost);hover=-1;const i=cellAt(e.clientX,e.clientY-28);
   if(i>=0&&!cur.P.givens[i]){if(p.from===i){renderPuzzle();return}place(i,p.v,p.from)}
   else if(p.from!=null){removeAt(p.from)}else{renderPuzzle();if(i>=0)say('That Gemling is sleeping in stone. Try an empty nook!')}},
  cancel(p){killGhost(p.ghost);hover=-1;if(cur)renderPuzzle()}})}
function setupShelfInput(){bindPress($('#shelfWrap'),e=>{const g=e.target.closest('[data-gem]');if(g)return{type:'gem',id:g.dataset.gem,from:g.dataset.from!=null?+g.dataset.from:null,drag:true,el:g};const s=e.target.closest('[data-slot]');if(s)return{type:'slot',slot:+s.dataset.slot};return null},
 {tap(info){if(info.type==='gem'){if(ui.shelfSel&&info.from!=null&&ui.shelfSel!==info.id){shelfPlace(ui.shelfSel,info.from);return}ui.shelfSel=ui.shelfSel===info.id?null:info.id;sfx('lift');renderShelf();if(ui.shelfSel){const t=S.gems.owned.find(g=>g.id===info.id).type;say(`A ${GEMS[t].name}! Tap a spot on the shelf.`,{silent:false})}}else if(ui.shelfSel){shelfPlace(ui.shelfSel,info.slot)}},
  dragStart(p){const t=S.gems.owned.find(g=>g.id===p.info.id).type;p.ghost=makeGhost(gemStoneSVG(t),80)},dragMove(p,e){moveGhost(p.ghost,e.clientX,e.clientY);$$('.gslot.hover').forEach(x=>x.classList.remove('hover'));const el=document.elementFromPoint(e.clientX,e.clientY-28);const s=el&&el.closest('[data-slot]');if(s)s.classList.add('hover')},
  drop(p,e){killGhost(p.ghost);const el=document.elementFromPoint(e.clientX,e.clientY-28);const s=el&&el.closest('[data-slot]');if(s)shelfPlace(p.info.id,+s.dataset.slot);else if(p.info.from!=null&&el&&el.closest('#pouch')){S.gems.placed=S.gems.placed.filter(x=>x.id!==p.info.id);save();renderShelf()}else renderShelf()},cancel(p){killGhost(p.ghost);renderShelf()}})}
