<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>The Shining Sea</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shining Sea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Cinzel+Decorative:wght@700;900&display=swap">
<style>
/* Layout: one full-screen app; a painted Aegean chart is home base, every other screen is a parchment panel floating on the sea. */
:root {
  --sea: #1d6fa5;
  --sea-deep: #0d4573;
  --sea-light: #5fb3d9;
  --sand: #f2dca6;
  --parchment: #fbf3dc;
  --ink: #23303f;
  --ink-soft: #5b6878;
  --gold: #e9b23a;
  --gold-deep: #b9821a;
  --olive: #6f8f3a;
  --coral: #e2725b;
  --good: #3f9e5a;
  --font-display: "Cinzel Decorative", "Palatino", Georgia, serif;
  --font-body: "Andika", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  --cell: clamp(30px, 6.4vmin, 56px);
  --tap: clamp(76px, 15vmin, 128px);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sea-deep);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(17px, 2.3vmin, 22px);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
#app {
  position: fixed;
  inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.18), transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(0,20,60,.35), transparent 60%),
    linear-gradient(170deg, var(--sea-light), var(--sea) 45%, var(--sea-deep));
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 12px 16px; gap: 10px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }

/* ---------- buttons ---------- */
.btn {
  border: none; border-radius: 18px;
  padding: .7em 1.4em; min-height: 60px;
  background: var(--gold); color: var(--ink);
  font-weight: 700; font-size: 1.15em;
  box-shadow: 0 5px 0 var(--gold-deep), 0 8px 18px rgba(0,0,0,.25);
  transition: transform .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--gold-deep); }
.btn.alt { background: var(--parchment); box-shadow: 0 5px 0 #c9b98d, 0 8px 18px rgba(0,0,0,.2); }
.icon-btn {
  width: 56px; height: 56px; border-radius: 16px; border: none;
  background: rgba(251,243,220,.92); font-size: 28px; line-height: 1;
  box-shadow: 0 3px 0 rgba(0,0,0,.2); flex: none;
}
.icon-btn:active { transform: translateY(2px); }
.topbar { display: flex; align-items: center; gap: 10px; flex: none; }
.topbar .spacer { flex: 1; }
.coins {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(251,243,220,.95); border-radius: 30px;
  padding: 6px 16px 6px 10px; font-weight: 700; font-size: 1.2em;
  font-variant-numeric: tabular-nums; box-shadow: 0 3px 0 rgba(0,0,0,.2);
}
.coins.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.3); } }

.panel {
  background: var(--parchment); border-radius: 26px;
  box-shadow: 0 10px 0 rgba(0,0,0,.12), 0 20px 40px rgba(0,0,0,.25);
  padding: 20px; min-width: 0;
}

/* ---------- title & story ---------- */
.title-screen { align-items: center; justify-content: center; text-align: center; gap: 18px; }
.title-screen h1 {
  color: var(--parchment); font-size: clamp(40px, 9vmin, 96px); line-height: 1.02;
  text-shadow: 0 4px 0 var(--sea-deep), 0 8px 24px rgba(0,0,0,.35);
}
.title-screen .sub { color: var(--parchment); font-size: 1.2em; opacity: .95; max-width: 30ch; }
.title-ship { width: min(46vmin, 320px); animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-2deg); } }
.waves { font-size: 28px; letter-spacing: 8px; color: rgba(255,255,255,.55); margin-top: -26px; }
.story { max-width: 640px; width: 100%; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
.story .who { font-size: 84px; line-height: 1; animation: float 3s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }
.story p { font-size: 1.3em; line-height: 1.5; margin: 0; }
.name-input {
  font: inherit; font-size: 1.4em; text-align: center; padding: 12px 16px;
  border-radius: 16px; border: 3px solid var(--gold); width: min(360px, 100%);
  background: #fff; color: var(--ink); -webkit-user-select: text; user-select: text;
}
.chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.chip {
  border: 3px solid transparent; background: #fff; border-radius: 40px;
  padding: 10px 18px; font-weight: 700; min-height: 56px;
}
.chip.on { border-color: var(--gold); background: #fff6d9; }

/* ---------- map ---------- */
.map { position: relative; flex: 1; min-height: 0; border-radius: 28px; overflow: hidden;
  box-shadow: inset 0 0 0 6px rgba(251,243,220,.5), inset 0 0 60px rgba(0,30,70,.4); }
.map svg.route { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.wave { position: absolute; color: rgba(255,255,255,.35); font-size: 22px; pointer-events: none; animation: drift 6s ease-in-out infinite; }
@keyframes drift { 50% { transform: translateX(12px); } }
.critter { position: absolute; font-size: 30px; pointer-events: none; animation: swim 14s linear infinite; opacity: .9; }
@keyframes swim { 0% { transform: translateX(0) scaleX(-1); } 48% { transform: translateX(26vw) scaleX(-1); } 52% { transform: translateX(26vw) scaleX(1); } 100% { transform: translateX(0) scaleX(1); } }
.compass { position: absolute; right: 14px; bottom: 12px; width: 70px; height: 70px; opacity: .8; pointer-events: none; }
.isle {
  position: absolute; transform: translate(-50%, -50%);
  border: none; background: none; padding: 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.isle .land {
  width: clamp(76px, 15vmin, 128px); height: clamp(62px, 12vmin, 104px);
  border-radius: 48% 52% 44% 56% / 55% 45% 55% 45%;
  background: radial-gradient(ellipse at 50% 40%, #8fb35a 0 38%, var(--olive) 39% 52%, var(--sand) 53%);
  box-shadow: 0 0 0 6px rgba(255,255,255,.25), 0 8px 16px rgba(0,30,60,.4);
  display: grid; place-items: center; font-size: clamp(32px, 6vmin, 52px);
}
.isle .label {
  background: var(--parchment); border-radius: 12px; padding: 2px 10px;
  font-weight: 700; font-size: .85em; box-shadow: 0 2px 0 rgba(0,0,0,.2); white-space: nowrap;
}
.isle.locked .land { background: radial-gradient(circle, #e8eef5 0 40%, #b8c6d6 70%); filter: saturate(.3); font-size: 34px; opacity: .85; }
.isle.locked .label { opacity: .75; }
.isle.next .land { animation: beckon 1.6s ease-in-out infinite; }
@keyframes beckon { 50% { box-shadow: 0 0 0 14px rgba(233,178,58,.55), 0 8px 16px rgba(0,30,60,.4); } }
.isle .stamp { position: absolute; top: -6px; right: -6px; font-size: 26px; }
.ship-token { position: absolute; width: clamp(70px, 13vmin, 120px); transform: translate(-50%, -80%); transition: left 2.2s ease-in-out, top 2.2s ease-in-out; pointer-events: none; z-index: 3; }
.ship-token svg { width: 100%; animation: bob 3s ease-in-out infinite; }
.map-foot { display: flex; align-items: center; gap: 10px; flex: none; flex-wrap: wrap; }
.pip-line { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.pip-face { font-size: 46px; line-height: 1; flex: none; animation: float 3s ease-in-out infinite; }
.pip-say {
  background: var(--parchment); border-radius: 18px; padding: 10px 14px; font-size: 1.05em;
  position: relative; min-width: 0; box-shadow: 0 3px 0 rgba(0,0,0,.15);
}
.pip-say::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right-color: var(--parchment); border-left: 0; }

/* ---------- god intro ---------- */
.meet { align-items: center; justify-content: center; text-align: center; }
.medallion {
  width: clamp(130px, 26vmin, 210px); aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  display: grid; place-items: center; font-size: clamp(70px, 14vmin, 120px);
  background: radial-gradient(circle, #fff6dc 0 55%, var(--isle, var(--gold)) 56% 64%, #fff6dc 65% 70%, var(--isle, var(--gold)) 71%);
  box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: float 3.5s ease-in-out infinite;
}
.meet .panel { max-width: 640px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.meet h2 { font-size: clamp(26px, 4.6vmin, 42px); color: var(--isle, var(--ink)); }
.meet p { margin: 0; font-size: 1.25em; line-height: 1.5; }

/* ---------- play ---------- */
.progress { display: flex; gap: 8px; flex: 1; justify-content: center; }
.progress span { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.35); box-shadow: inset 0 2px 0 rgba(0,0,0,.15); }
.progress span.on { background: radial-gradient(circle at 35% 35%, #fff, #e7e2f5 50%, #c9c1e0); box-shadow: 0 0 8px #fff; }
.asker { display: flex; align-items: center; gap: 12px; flex: none; }
.asker .face {
  width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 36px;
  background: var(--parchment); box-shadow: 0 0 0 4px var(--isle, var(--gold));
}
.asker .bubble { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--parchment); border-radius: 20px; padding: 10px 12px 10px 18px; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
.asker .bubble p { margin: 0; flex: 1; font-size: 1.2em; line-height: 1.4; min-width: 0; }
.say { width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--sea-light); font-size: 24px; flex: none; }
.stage {
  flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  background: rgba(251,243,220,.92); border-radius: 26px; padding: 14px;
  box-shadow: inset 0 0 0 4px rgba(255,255,255,.6);
}
.frames { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.frame {
  display: grid; grid-template-columns: repeat(5, var(--cell)); gap: 5px; padding: 8px;
  background: #fff; border-radius: 14px; border: 3px solid #c7d7e6;
}
.cell { width: var(--cell); height: var(--cell); border-radius: 10px; display: grid; place-items: center; font-size: calc(var(--cell) * .72); line-height: 1; background: #eef4f9; }
.cell.empty { background: #eef4f9; box-shadow: inset 0 0 0 2px #d5e2ee; }
.cell.glow { background: #fff3c7; box-shadow: inset 0 0 0 3px var(--gold); animation: glow 1.2s ease-in-out infinite; }
@keyframes glow { 50% { background: #ffe38a; } }
.cell.b, .item.b { filter: hue-rotate(160deg) saturate(1.4); }
.cell.gone, .item.gone { opacity: .28; position: relative; }
.cell.gone::after { content: "✕"; position: absolute; color: var(--coral); font-weight: 700; font-size: calc(var(--cell) * .8); }
.pearl-dot { width: 76%; height: 76%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ece7f6 45%, #bdb3d8); box-shadow: 0 2px 2px rgba(0,0,0,.2); }
.row { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-width: 100%; }
.item { font-size: calc(var(--cell) * .85); line-height: 1.05; display: inline-grid; place-items: center; width: calc(var(--cell) * .95); height: calc(var(--cell) * .95); }
.item .pearl-dot { width: 80%; height: 80%; }
.necklace { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; padding: 10px 18px; border-bottom: 3px dotted #b49a62; border-radius: 0 0 50% 50%; max-width: 100%; }
.groups { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; }
.group { display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(var(--cell) * 5.2); justify-content: center; padding: 8px; background: #fff; border-radius: 16px; }
.op { font-size: calc(var(--cell) * 1.1); font-weight: 700; color: var(--ink-soft); }
.eq { font-size: clamp(40px, 9vmin, 84px); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--ink); }
.eq .q { display: inline-block; min-width: 1.1em; text-align: center; color: var(--gold-deep); border-bottom: 5px solid var(--gold); }
.caption { font-size: 1.05em; color: var(--ink-soft); text-align: center; }
.needs { font-size: 1.3em; font-weight: 700; color: var(--ink-soft); }
.answers { flex: none; display: flex; justify-content: center; gap: clamp(12px, 3vmin, 28px); flex-wrap: wrap; padding-bottom: 4px; }
.ans {
  width: var(--tap); height: var(--tap); border-radius: 26px; border: none;
  font-size: calc(var(--tap) * .44); font-weight: 700; font-variant-numeric: tabular-nums;
  background: linear-gradient(#fffaf0, #f4e6c0); color: var(--ink);
  box-shadow: 0 7px 0 #c9ad6c, 0 10px 18px rgba(0,0,0,.25);
}
.ans:active { transform: translateY(5px); box-shadow: 0 2px 0 #c9ad6c; }
.ans.pebble { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d9dde3, #9aa3ae); box-shadow: 0 7px 0 #6c7480, 0 10px 18px rgba(0,0,0,.25); }
.ans.nope { opacity: .35; animation: shake .45s; }
.ans.yes { background: linear-gradient(#c6f0cf, #8fd6a0); box-shadow: 0 7px 0 #4d9b60; animation: pop .5s; }
.ans.nudge { animation: nudge 1.1s ease-in-out infinite; }
@keyframes shake { 25% { transform: translateX(-10px); } 50% { transform: translateX(10px); } 75% { transform: translateX(-6px); } }
@keyframes pop { 50% { transform: scale(1.18); } }
@keyframes nudge { 50% { transform: scale(1.08); box-shadow: 0 7px 0 #c9ad6c, 0 0 0 10px rgba(233,178,58,.5); } }
.pip-row { flex: none; display: flex; align-items: center; gap: 10px; min-height: 56px; }
.pip-row .pip-say:empty { visibility: hidden; }

/* gold bars & coins */
.gold { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; justify-content: center; max-width: 100%; }
.bar {
  width: calc(var(--cell) * .55); height: calc(var(--cell) * 3.2); border-radius: 6px; position: relative;
  background: repeating-linear-gradient(to bottom, #f7d46b 0 calc(10% - 2px), var(--gold-deep) calc(10% - 2px) 10%);
  box-shadow: inset 0 0 0 2px var(--gold-deep), 0 3px 0 rgba(0,0,0,.2); border: none; padding: 0; flex: none;
}
.coin {
  width: calc(var(--cell) * .62); height: calc(var(--cell) * .62); border-radius: 50%; flex: none; border: none; padding: 0;
  background: radial-gradient(circle at 35% 30%, #fff0b0, var(--gold) 55%, var(--gold-deep));
  box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.labelled { position: relative; margin-bottom: 1.4em; }
.labelled::after { content: attr(data-n); position: absolute; left: 50%; top: 100%; transform: translateX(-50%); font-weight: 700; font-size: .9em; color: var(--gold-deep); margin-top: 4px; }
.coin-col { display: flex; flex-wrap: wrap; gap: 4px; width: calc(var(--cell) * 2.2); align-content: flex-end; }
.target { font-size: 1.4em; text-align: center; }
.target b { font-size: 2.2em; color: var(--gold-deep); display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.build-tray { min-height: calc(var(--cell) * 3.5); width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 10px; border: 3px dashed #d6c28c; border-radius: 18px; background: #fffdf5; }
.build-tray .empty-msg { color: var(--ink-soft); align-self: center; }
.build-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.build-btns .btn { display: inline-flex; align-items: center; gap: 10px; }
.melt { animation: melt .6s ease-in forwards; }
@keyframes melt { to { transform: scale(.2) translateY(-20px); opacity: 0; } }

/* scales */
.scale { position: relative; width: min(520px, 92%); height: calc(var(--cell) * 4.6); flex: none; }
.scale .post { position: absolute; left: 50%; bottom: 0; width: 14px; height: 78%; transform: translateX(-50%); background: linear-gradient(90deg, #8a6a3a, #c69c5a, #8a6a3a); border-radius: 6px; }
.scale .foot { position: absolute; left: 50%; bottom: 0; width: 120px; height: 16px; transform: translateX(-50%); background: #8a6a3a; border-radius: 10px 10px 4px 4px; }
.scale .owl { position: absolute; left: 50%; top: 2%; transform: translateX(-50%); font-size: calc(var(--cell) * .9); z-index: 2; }
.beam { position: absolute; left: 8%; right: 8%; top: 22%; height: 12px; background: linear-gradient(#e2bb6b, #a57a32); border-radius: 6px; transform-origin: 50% 50%; transition: transform .8s cubic-bezier(.3,1.6,.5,1); }
.pan { position: absolute; top: 6px; width: 40%; transform-origin: 50% 0; transition: transform .8s cubic-bezier(.3,1.6,.5,1); display: flex; flex-direction: column; align-items: center; }
.pan.l { left: -20%; } .pan.r { right: -20%; }
.pan .strings { width: 80%; height: calc(var(--cell) * 1.1); display: block; }
.pan .dish { width: 100%; min-height: calc(var(--cell) * 1.1); border-radius: 0 0 50% 50% / 0 0 100% 100%; background: linear-gradient(#e7c477, #b98a3c); display: flex; align-items: flex-end; justify-content: center; gap: 4px; padding: 0 6px 8px; flex-wrap: wrap-reverse; }
.stone { display: inline-grid; place-items: center; width: calc(var(--cell) * 1.05); height: calc(var(--cell) * .95); border-radius: 50% 50% 45% 45%; background: radial-gradient(circle at 35% 30%, #e5e8ec, #9aa3ae); font-weight: 700; font-size: calc(var(--cell) * .5); color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.stone.mystery { background: #fff6d9; border: 3px dashed var(--gold); color: var(--gold-deep); box-shadow: none; }
.stone.drop { animation: drop .4s ease-out; }
@keyframes drop { from { transform: translateY(-60px); opacity: 0; } }
.scale-sums { display: flex; justify-content: space-between; width: min(520px, 92%); font-weight: 700; font-size: 1.15em; color: var(--ink-soft); }

/* ---------- reward & cards ---------- */
.reward { align-items: center; text-align: center; overflow: auto; }
.reward .panel { margin: auto 0; }
.pack .card { width: clamp(112px, 17vmin, 160px); }
.reward .panel { max-width: 720px; width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.reward h2 { font-size: clamp(26px, 4.6vmin, 40px); }
.reward p { margin: 0; font-size: 1.2em; line-height: 1.5; }
.chest { font-size: clamp(90px, 18vmin, 150px); line-height: 1; border: none; background: none; animation: wiggle 1.2s ease-in-out infinite; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-6deg); } 40% { transform: rotate(6deg); } 60% { transform: rotate(-3deg); } }
.pack { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.card {
  --rim: #c7b48a;
  width: clamp(130px, 22vmin, 180px); aspect-ratio: 5 / 7; max-width: 100%;
  border-radius: 16px; padding: 7px; background: var(--rim);
  box-shadow: 0 6px 16px rgba(0,0,0,.25); position: relative; flex: none;
}
.card .face { height: 100%; border-radius: 11px; background: linear-gradient(170deg, #fffdf6, #f3e7c8); display: flex; flex-direction: column; align-items: center; padding: 8px 6px 6px; gap: 4px; overflow: hidden; }
.card .art { flex: 1; width: 100%; border-radius: 9px; display: grid; place-items: center; font-size: clamp(44px, 8vmin, 66px); background: radial-gradient(circle at 50% 45%, #fff, var(--tint, #cfe6f3)); }
.card .nm { font-weight: 700; font-size: clamp(13px, 1.9vmin, 17px); line-height: 1.15; text-align: center; min-height: 2.3em; display: grid; place-items: center; }
.card .rar { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.card.rare { --rim: linear-gradient(135deg, #b9c6d6, #f4f7fb, #8ea3bd); background: var(--rim); }
.card.legend { background: linear-gradient(135deg, #f6d36b, #fff3c4, #e0a92f, #fff3c4, #f6d36b); background-size: 300% 300%; animation: foil 4s linear infinite; }
.card.legend .art::after, .card.rare .art::after { content: ""; position: absolute; inset: 7px; border-radius: 11px; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 45%, transparent 60%); background-size: 250% 100%; animation: shine 3s linear infinite; }
@keyframes foil { to { background-position: 300% 0; } }
@keyframes shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.card .count { position: absolute; top: -8px; right: -8px; background: var(--coral); color: #fff; border-radius: 20px; padding: 2px 9px; font-weight: 700; font-size: 14px; }
.card .new { position: absolute; top: -10px; left: -6px; background: var(--good); color: #fff; border-radius: 20px; padding: 2px 10px; font-weight: 700; font-size: 13px; transform: rotate(-8deg); }
.card.missing { background: rgba(255,255,255,.25); box-shadow: none; }
.card.missing .face { background: rgba(255,255,255,.35); }
.card.missing .art { background: none; filter: brightness(0) opacity(.18); }
.card.missing .nm, .card.missing .rar { color: rgba(35,48,63,.45); }

/* GFKCards: one card look, one pack-opening moment and one lucky-draw system for every game.
   Source of truth is this file; tools/sync-cards.py copies it into each game and the shelf
   as the "gfk-cards" script block so every index.html stays self-contained.

   Games call GFKCards.collect({game, id, name, emoji, rarity}) when she earns a card.
   It writes the card to the shared "gfk-collection" list (same shape as before), then:
   - Luck: a common or rare card can come out Shiny (holo). Never fewer than one Shiny in 7 packs.
   - Bonus: some packs also hold a Wonder Charm from a shared set, never a duplicate.
     Never more than 3 packs in a row without one.
   - Saved for last: each game's finale card is Legendary, and Crown Cards unlock at
     8, 20, 35, 55 and 80 cards collected across every game.
   Nothing is ever bought or lost. New cards wait in a glowing pack button; tapping it opens them.
   GFKCards.face(card) draws a card; GFKCards.view(cards, i) opens the big swipeable viewer. */

    "gemling-grids": { name: "Crystal Caves", icon: "💎", a: "#a9eadf", b: "#2b7f75" },
    "egypt-puzzles": { name: "Miu's Pyramids", icon: "🔺", a: "#ffe3a1", b: "#c08523" },
    "mouse-shop": { name: "Acorn Bakery", icon: "🥐", a: "#f5d2b0", b: "#9a6038" },
    "pirate-voyage": { name: "The Shining Sea", icon: "⚓", a: "#a9dcf5", b: "#235f8c" },
    "wonder-charms": { name: "Wonder Charms", icon: "🍀", a: "#d9ccff", b: "#6a4fc4" },
    "wonder-crowns": { name: "Crown Cards", icon: "👑", a: "#fff0b3", b: "#c9931a" }

  const FINALES = { "egypt-puzzles": ["hidden-3"], "gemling-grids": ["card-r-moonFinale"], "fairy-lantern-festival": ["starwing"], "pirate-voyage": ["sea:5"], "mouse-shop": ["mouse-shop-moonbeam-the-unicorn-sparkly"] };

        if (G) return openGL(t, shakes);
        back.classList.add("shake" + Math.min(3, shakes));
        setTimeout(() => {
          flip.classList.add("open"); chime(t); burst(stage, t);
          setTimeout(() => reveal(t), reduced() ? 50 : 650);
        }, reduced() ? 0 : 450 * Math.min(3, shakes) * (shakes > 2 ? 0.6 : 1));
      }
      stage.addEventListener("click", open);
      go.addEventListener("click", e => {
        e.stopPropagation();
        if (queue.length) return next();
        ov.classList.remove("on");
        setTimeout(() => { if (G) G.destroy(); ov.remove(); opening = false; showButton(); done(); }, 260);
      });
      next();
    });
  }

  /* ---------- big viewer: swipe through cards ---------- */
  function view(cards, start, opts) {
    opts = opts || {};
    if (!cards || !cards.length) return;
    let i = Math.max(0, Math.min(cards.length - 1, start || 0));
    const v = document.createElement("div");
    v.className = "gfk-view"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", "Card viewer");
    v.innerHTML = `<button class="rb x" type="button" aria-label="Close">✕</button><div class="stage"></div><div class="info"></div>
      <div class="nav"><button class="rb prev" type="button" aria-label="Previous card">◀</button><span class="pos"></span><button class="rb nextb" type="button" aria-label="Next card">▶</button></div>`;
    document.body.appendChild(v);
    const stage = v.querySelector(".stage"), info = v.querySelector(".info"), pos = v.querySelector(".pos");
    const prevB = v.querySelector(".prev"), nextB = v.querySelector(".nextb");
    const G = glStage(v, stage);
    if (G) { G.S.ry = 0; G.S.scale = 1; }
    const tl = G ? { move() {}, reset() {} } : tilt(stage, 26);
    function when(s) { try { return new Date(s).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }); } catch (e) { return ""; } }
    function draw(dir) {
      const c = cards[i], t = tierOf(c), set = SETS[c.game];
      stage.innerHTML = face(c, { big: true });
      if (G) {
        const S = G.S;
        if (!dir || reduced()) { G.setCard(c); }
        else {
          const start = S.ry; let swapped = false;
          G.anim(560, k => { S.ry = start + dir * 2 * Math.PI * ease(k); S.scale = 1 - 0.12 * Math.sin(Math.PI * k); if (!swapped && k > 0.3) { swapped = true; G.setCard(c); S.raysTo = G.look().rays * 0.55; } });
        }
        S.raysTo = G.look().rays * 0.55; S.ambient = { common: 0, rare: 1, sparkly: 4, legendary: 8 }[t]; S.glow = t === "legendary" ? 0.3 : 0;
      } else if (dir && !reduced()) { stage.style.transition = "none"; stage.style.transform = `translateX(${dir * 60}px)`; stage.style.opacity = "0"; requestAnimationFrame(() => { stage.style.transition = ""; stage.style.transform = ""; stage.style.opacity = "1"; }); }
      info.innerHTML = `<b>${esc(c.name)}</b><span>${c.shiny ? "✨ Shiny" : TIER_NAME[t]} · ${esc(set ? set.name : "Treasures")}</span>${c.earnedAt ? `<span>Won on ${esc(when(c.earnedAt))}</span>` : ""}`;
      pos.textContent = `${i + 1} of ${cards.length}`;
      prevB.disabled = i === 0; nextB.disabled = i === cards.length - 1;
      if (opts.onShow) opts.onShow(c);
    }
    const go = d => { const j = i + d; if (j < 0 || j >= cards.length) return; i = j; draw(d); };
    function close() { if (G) G.destroy(); v.remove(); document.removeEventListener("keydown", key); if (opts.onClose) opts.onClose(); }
    function key(e) { if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1); else if (e.key === "Escape") close(); }
    prevB.onclick = () => go(-1); nextB.onclick = () => go(1); v.querySelector(".x").onclick = close;
    document.addEventListener("keydown", key);
    let sx = null, sy = 0;
    v.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
    v.addEventListener("pointerup", e => {
      if (sx == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
      else if (dy > 120) close();
      tl.reset();
    });
    stage.addEventListener("touchmove", e => tl.move(e), { passive: true });
    draw(0);
    nextB.focus({ preventScroll: true });
  }

  window.GFKCards = { collect, face, locked, view, openPacks, list, SETS, CROWNS, CHARMS, TIERS, TIER_NAME, pending: () => queue.length };
})();
</script>
<script id="kid-voice" data-voice-base="../../voice/">
/* KidVoice: one friendly voice for every game.
   Source of truth is shared/voice.js; tools/sync-voice.py copies it into each game
   so every index.html stays self-contained.

   1. Recorded clips first: if voice/manifest.json (made by tools/make-voice-clips.mjs)
      has a clip for a sentence, it plays that. Lines with numbers in them, like
      "7 plus 5" or "This lantern needs 7 fireflies", are stitched from shorter clips.
   2. Otherwise the device's own speech, using the most natural voice it has
      (Premium / Enhanced iPad voices first, never the novelty or robot voices).
   A grown-up can pin a voice from The Wonder Shelf; it is saved in localStorage["gfk-voice"]. */
(function () {
  if (window.KidVoice) return;
  const synth = window.speechSynthesis || null;
  const NOVELTY = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Kathy)\b/i;
  const ROBOTIC = /\b(Eddy|Flo|Reed|Rocko|Sandy|Shelley|Grandma|Grandpa)\b/i; // iOS "Eloquence" voices
  const FAVORITES = ['Ava', 'Zoe', 'Samantha', 'Allison', 'Susan', 'Nicky', 'Serena', 'Karen', 'Moira', 'Kate', 'Tessa', 'Evan', 'Nathan', 'Tom', 'Daniel'];

  function score(v) {
    const id = (v.name || '') + ' ' + (v.voiceURI || '');
    let s = 0;
    if (NOVELTY.test(v.name)) s -= 100;
    if (ROBOTIC.test(v.name)) s -= 60;
    if (/premium/i.test(id)) s += 60;
    else if (/enhanced/i.test(id)) s += 40;
    if (/siri/i.test(id)) s += 35;
    if (/Online \(Natural\)/i.test(id)) s += 45; // Edge
    if (/^Google/i.test(v.name)) s += 20;      // Chrome
    const fav = FAVORITES.findIndex(n => new RegExp('\\b' + n + '\\b', 'i').test(v.name));
    if (fav >= 0) s += 15 - fav * 0.5;
    if (/en[-_]US/i.test(v.lang)) s += 5; else if (/en[-_]GB/i.test(v.lang)) s += 4; else if (/en[-_](AU|IE|NZ|CA)/i.test(v.lang)) s += 3;
    if (v.default) s += 1;
    return s;
  }
  function voices() {
    try { return (synth && synth.getVoices() || []).filter(v => /^en/i.test(v.lang)); } catch (e) { return []; }
  }
  function ranked() { return voices().map(v => ({ v, s: score(v) })).sort((a, b) => b.s - a.s).map(x => x.v); }
  // iPad Safari hides the Premium/Enhanced voices you download from web pages and often lists
  // only the robotic "Eloquence" voices. When nothing natural is listed, leave the voice unset so
  // iOS uses its own default English voice instead of us picking a robot.
  const NATURAL = 10;
  let chosen = null;
  function pick() {
    let pinned = null;
    try { pinned = localStorage.getItem('gfk-voice'); } catch (e) {}
    const list = ranked();
    if (pinned === 'default') return (chosen = null);
    chosen = (pinned && list.find(v => v.voiceURI === pinned || v.name === pinned)) || auto(list);
    return chosen;
  }
  function auto(list) { list = list || ranked(); return list[0] && score(list[0]) >= NATURAL ? list[0] : null; }
  const quality = v => /premium/i.test(v.voiceURI + v.name) ? 'Premium' : /enhanced/i.test(v.voiceURI + v.name) ? 'Enhanced' : '';
  if (synth) { pick(); try { synth.addEventListener('voiceschanged', pick); } catch (e) {} }

  /* ---- recorded clips ---- */
  let clips = null; // { base, lines: {key: file} }
  const base = (document.currentScript && document.currentScript.dataset.voiceBase) || '../../voice/';
  try {
    if (location.protocol !== 'file:') fetch(base + 'manifest.json').then(r => r.ok ? r.json() : null)
      .then(m => { if (m && m.lines) clips = { base, lines: m.lines }; }).catch(() => {});
  } catch (e) {}
  const key = t => String(t).toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  function clipPlan(text) {
    if (!clips) return null;
    const plan = [];
    for (const sentence of String(text).match(/[^.!?]+[.!?]*/g) || []) {
      const k = key(sentence); if (!k) continue;
      if (clips.lines[k]) { plan.push(clips.lines[k]); continue; }
      // Stitch lines built from a template, like "this lantern needs" + "7" + "fireflies".
      const parts = k.split(/\b(\d+)\b/).map(x => x.trim()).filter(Boolean);
      if (parts.length > 1 && parts.every(x => clips.lines[x])) { parts.forEach(x => plan.push(clips.lines[x])); continue; }
      return null; // one sentence without a recording: use speech for the whole line so it sounds even
    }
    return plan.length ? plan : null;
  }
  const audio = typeof Audio !== 'undefined' ? new Audio() : null;
  let queue = [];
  function playNext() {
    if (!audio || !queue.length) return;
    audio.src = clips.base + queue.shift();
    audio.play().catch(() => { queue = []; });
  }
  if (audio) audio.addEventListener('ended', playNext);
  function stopClips() { queue = []; if (audio) try { audio.pause(); } catch (e) {} }
  // Games call speechSynthesis.cancel() when they change screens; make that stop clips too.
  if (synth) try { const cancel = synth.cancel.bind(synth); synth.cancel = function () { stopClips(); cancel(); }; } catch (e) {}
  // iPad Safari only plays audio after a tap: unlock the player on the first touch.
  if (audio) document.addEventListener('pointerdown', function unlock() {
    document.removeEventListener('pointerdown', unlock, true);
    if (!audio.src) { audio.src = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA=='; audio.play().catch(() => {}); }
  }, true);

  function speak(text, opts) {
    opts = opts || {};
    if (!text) return;
    const plan = clipPlan(text);
    if (plan) {
      if (!opts.queue) { try { synth && synth.cancel(); } catch (e) { stopClips(); } }
      const idle = !queue.length && (!audio || audio.paused || audio.ended);
      queue.push(...plan);
      if (idle) playNext();
      return;
    }
    if (!synth) return;
    try {
      if (!opts.queue) synth.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      const v = chosen;
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      // A natural pitch: raised pitch is what made the old voice sound strained and creepy.
      u.rate = Math.min(1.05, Math.max(0.75, opts.rate || 0.92));
      u.pitch = Math.min(1.05, Math.max(0.95, opts.pitch || 1));
      synth.speak(u);
    } catch (e) {}
  }

  window.KidVoice = { speak, stop: () => { try { synth ? synth.cancel() : stopClips(); } catch (e) {} }, pick, auto, ranked, score, quality, current: () => chosen, key };
})();
</script>

let actx = null;
function tone(freqs, dur = 0.14, type = "sine", gap = 0.09, vol = 0.16) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime + 0.02;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i * gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
    });
  } catch (e) {}
}

  tap: () => tone([660], 0.06, "triangle", 0, 0.07),

function say(text) {
  if (!S.settings.voice || !("speechSynthesis" in window) || !text) return;
  try {

}

const PEARL = '<span class="pearl-dot"></span>';
function frame(cells, size) {
  let h = `<div class="frame" style="grid-template-columns:repeat(5,var(--cell))">`;
  for (let i = 0; i < size; i++) {
    const c = cells[i];
    h += c ? `<div class="cell ${c.cls || ""}">${c.e}</div>` : `<div class="cell empty"></div>`;
  }
  return h + "</div>";
}
// groups: [{n, e, cls}] laid into ten-frames (five-frames when total ≤ 5)
function frames(groups, total) {
  const cells = [];
  groups.forEach(g => { for (let i = 0; i < g.n; i++) cells.push({ e: g.e, cls: g.cls }); });
  const size = total <= 5 ? 5 : 10;
  const n = Math.max(1, Math.ceil(total / size));
  let h = '<div class="frames">';
  for (let f = 0; f < n; f++) h += frame(cells.slice(f * size, (f + 1) * size), size);
  return h + "</div>";
}
const items = (n, e, cls = "") => Array.from({ length: n }, () => `<span class="item ${cls}">${e}</span>`).join("");
const goldPile = (tens, ones, labels) => {
  let h = '<div class="gold">';
  for (let i = 0; i < tens; i++) h += `<span class="bar ${labels ? "labelled" : ""}" data-n="${(i + 1) * 10}"></span>`;
  if (ones) {
    h += '<div class="coin-col">';
    for (let i = 0; i < ones; i++) h += `<span class="coin ${labels ? "labelled" : ""}" data-n="${labels ? "+" + 1 : ""}"></span>`;
    h += "</div>";
  }
  return h + "</div>";
};

  sub: ["Taking away within 5", "Taking away within 10", "Teens, no regrouping (17 − 4)", "Teens across 10 (13 − 5)"],
  place: ["Teen numbers as 1 ten and ones", "Tens and ones up to 59", "Tens and ones up to 99"],

};

function choices(ans, min, max, extra = []) {
  const set = new Set([ans]);
  const cands = [...extra.filter(x => x !== ans), ...shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 3])];
  for (const c of cands) { if (set.size >= 3) break; if (c >= min && c <= max) set.add(c); }
  let k = 1; while (set.size < 3) { if (!set.has(ans + k + 2)) set.add(ans + k + 2); k++; }
  return [...set].sort((a, b) => a - b);
}

const GEN = {
  bonds(L) {
    const total = L === 1 ? 5 : L < 4 ? 10 : 20;
    const have = total === 20 ? rnd(11, 19) : rnd(1, total - 1);
    const ans = total - have;
    const thing = pick([
      { e: PEARL, txt: `This necklace needs ${total} pearls. It has ${have}. How many more pearls do we need?` },
      { e: "🐚", txt: `Poseidon wants ${total} shells in his basket. There are ${have}. How many more shells?` },
      { e: "🐟", txt: `${total} fish fit in the net. ${have} are in. How many more fish can fit?` },
    ]);
    const vis = L === 3
      ? `<div class="needs">Needs ${total}</div><div class="necklace">${items(have, thing.e)}</div>`
      : frames([{ n: have, e: thing.e }], total);
    return {
      prompt: thing.txt, answer: ans, choices: choices(ans, 0, total),
      visual: vis + `<div class="eq">${have} + <span class="q">?</span> = ${total}</div>`,
      hint: frames([{ n: have, e: thing.e }, { n: ans, e: "", cls: "glow" }], total) + `<div class="eq">${have} + <span class="q">?</span> = ${total}</div>`,
      hintText: "Count the glowing empty spaces!",
    };
  },
  add(L) {
    let a, b;
    if (L === 1) { a = rnd(1, 4); b = rnd(1, 5 - a); }
    else if (L === 2) { a = rnd(2, 8); b = rnd(1, 10 - a); }
    else if (L === 3) { a = rnd(6, 9); b = rnd(11 - a, 9); }
    else if (Math.random() < .5) { a = rnd(10, 15); b = rnd(1, Math.min(9, 20 - a)); }
    else { a = rnd(5, 9); b = rnd(Math.max(1, 11 - a), 9); }
    const ans = a + b;
    const s = pick([
      { e: "📦", t: `Hermes has ${a} parcels. Then ${b} more arrive. How many parcels now?` },
      { e: "✉️", t: `There are ${a} letters in the bag. Hermes adds ${b} more. How many letters?` },
      { e: "🪶", t: `Hermes finds ${a} golden feathers, then ${b} more. How many feathers?` },
    ]);
    const visual = L <= 2
      ? `<div class="groups"><div class="group">${items(a, s.e)}</div><span class="op">+</span><div class="group">${items(b, s.e, "b")}</div></div><div class="eq">${a} + ${b} = <span class="q">?</span></div>`
      : `<div class="eq">${a} + ${b} = <span class="q">?</span></div><div class="caption">${s.e} ${a} and ${s.e} ${b} more</div>`;
    return {
      prompt: s.t, answer: ans, choices: choices(ans, 0, 20, [ans + 10, ans - 10]),
      visual, hint: frames([{ n: a, e: s.e }, { n: b, e: s.e, cls: "b" }], ans) + `<div class="eq">${a} + ${b} = <span class="q">?</span></div>`,
      hintText: ans > 10 ? "Fill up ten first. Then count the extras!" : "Count them all, one at a time!",
    };
  },
  sub(L) {
    let t, k;
    if (L === 1) { t = rnd(2, 5); k = rnd(1, t - 1); }
    else if (L === 2) { t = rnd(5, 10); k = rnd(1, t - 1); }
    else if (L === 3) { t = rnd(11, 19); k = rnd(1, t - 10); }
    else { t = rnd(11, 18); k = rnd(t - 9, 9); }
    const ans = t - k;
    const [plural, e] = pick([["deer", "🦌"], ["bunnies", "🐇"], ["foxes", "🦊"], ["hedgehogs", "🦔"], ["owls", "🦉"]]);
    const prompt = `${t} ${plural} played in the moonlight. ${k} went home to bed. How many are still playing?`;
    const visual = L <= 2
      ? `<div class="row">${items(t - k, e)}${items(k, e, "gone")}</div><div class="eq">${t} − ${k} = <span class="q">?</span></div>`
      : `<div class="eq">${t} − ${k} = <span class="q">?</span></div><div class="caption">${e} ${t} played, ${k} went to bed</div>`;
    return {
      prompt, answer: ans, choices: choices(ans, 0, 20),
      visual, hint: frames([{ n: t - k, e }, { n: k, e, cls: "gone" }], t) + `<div class="eq">${t} − ${k} = <span class="q">?</span></div>`,
      hintText: "The crossed-out ones went to bed. Count the ones still playing!",
    };
  },
  place(L) {
    const n = L === 1 ? rnd(11, 19) : L === 2 ? rnd(20, 59) : rnd(60, 99);
    const tens = Math.floor(n / 10), ones = n % 10;
    const hintText = `Each gold bar is 10. Count the bars by tens, then add the coins. ${n} is ${tens} ${tens === 1 ? "bar" : "bars"} and ${ones} ${ones === 1 ? "coin" : "coins"}.`;
    if (Math.random() < 0.5) {
      return {
        kind: "build", target: n, answer: n,
        prompt: `Hephaestus needs ${n} gold coins. Build ${n} with gold bars and coins!`,
        visual: `<div class="target">Build<b>${n}</b></div>`,
        hint: `<div class="target">Build<b>${n}</b></div>${goldPile(tens, ones, true)}`,
        hintText,
      };
    }
    const extra = [n + 10, n - 10];
    if (ones && ones !== tens) extra.unshift(ones * 10 + tens);
    return {
      prompt: "How many gold coins does Hephaestus have? Each bar is worth 10 coins.",
      answer: n, choices: choices(n, 1, 99, extra),
      visual: goldPile(tens, ones, false),
      hint: goldPile(tens, ones, true), hintText,
    };
  },
  balance(L) {
    let left, c;
    if (L === 1) { const n = rnd(3, 10); left = [n]; c = rnd(1, n - 1); }
    else if (L === 2) { const a = rnd(1, 7), b = rnd(1, 10 - a); left = [a, b]; c = rnd(1, a + b - 1); }
    else { const a = rnd(5, 10), b = rnd(3, Math.min(10, 20 - a)); left = [a, b]; c = rnd(Math.max(1, a + b - 9), a + b - 1); }
    const sumL = left.reduce((x, y) => x + y, 0), ans = sumL - c;
    return {
      kind: "balance", left, right: [c], answer: ans, choices: choices(ans, 1, 20),
      prompt: "Athena's scales must be equal on both sides. Which stone will make them balance?",
      hintText: left.length > 1
        ? `This side has ${left.join(" + ")}, that makes ${sumL}. The other side has ${c}. How many more to make ${sumL}?`
        : `This side has ${sumL}. The other side has ${c}. How many more to make ${sumL}?`,
    };
  },
};

// ================= adaptive difficulty =================
// Two first-try answers in a row move a skill up a level; two shaky questions in a row move it down.
function record(skill, firstTry) {
  const s = S.skills[skill];
  s.total++;
  let up = false;
  if (firstTry) {
    s.firstTry++; s.streak++; s.struggle = 0;
    if (s.streak >= 2 && s.level < MAX[skill]) { s.level++; s.streak = 0; up = true; }
  } else {
    s.streak = 0; s.struggle++;
    if (s.struggle >= 2 && s.level > 1) { s.level--; s.struggle = 0; }
  }
  return up;
}

  </div>`;

// Draw cards from a set, favouring ones she doesn't have yet so the binder keeps filling.
function drawCard(set) {
  const pool = CARDS[set].map((c, i) => ({ i, r: c[2] })).filter(c => c.r < 3);
  const missing = pool.filter(c => !S.cards[cardKey(set, c.i)]);
  let c;
  if (missing.length && Math.random() < 0.7) c = pick(missing);
  else {
    const weighted = pool.flatMap(c => Array(c.r === 1 ? 3 : 1).fill(c));
    c = pick(weighted);
  }
  return c.i;
}
function giveCard(set, i) {
  const k = cardKey(set, i);
  const isNew = !S.cards[k];
  S.cards[k] = (S.cards[k] || 0) + 1;
  shareCard(set, i);
  return { set, i, isNew };
}

// ================= quest flow =================
function startQuest(isle, idx) {
  run = { isle, idx, n: 0, total: 5, coinsWon: 0, firstTries: 0 };
  go("meet", isle);
}
function nextQ() {
  if (run.n >= run.total) return finishQuest();
  const skill = run.isle.skill === "mixed" ? pick(["bonds", "add", "sub", "place", "balance"]) : run.isle.skill;
  const q = GEN[skill](S.skills[skill].level);
  q.skill = skill; q.kind = q.kind || "choice";
  run.q = q; run.miss = 0; run.locked = false; run.build = { bars: 0, coins: 0 };
  screen = "play"; RENDER.play(); say(q.prompt);
}
function pipSay(text, speak = true) {
  const el = document.getElementById("pipSay");
  if (el) el.textContent = text;
  if (speak) say(text);
}
async function onCorrect(btn) {
  const q = run.q;
  run.locked = true;
  if (btn) btn.classList.add("yes");
  document.querySelectorAll(".ans").forEach(b => { if (b !== btn) b.disabled = true; });
  sfx.right();
  const first = run.miss === 0;
  const up = record(q.skill, first);
  if (first) run.firstTries++;
  const won = first ? 2 : 1;
  run.coinsWon += won;
  setTimeout(() => addCoins(won), 300);
  run.n++;
  const dots = document.querySelectorAll(".progress span");
  if (dots[run.n - 1]) dots[run.n - 1].classList.add("on");
  pipSay(up ? `${pick(PRAISE)} You're ready for bigger puzzles!` : pick(PRAISE));
  save();
  await wait(up ? 2300 : 1600);
  if (screen === "play") nextQ();
}
function onWrong(btn) {
  const q = run.q;
  run.miss++;
  sfx.wrong();
  if (btn) { btn.classList.add("nope"); btn.disabled = true; }
  if (q.hint) document.getElementById("stage").innerHTML = q.hint;
  pipSay(`${pick(TRY)} ${q.hintText}`);
  if (run.miss >= 2 && q.kind !== "build") {
    const right = [...document.querySelectorAll(".ans")].find(b => +b.dataset.v === q.answer);
    if (right) right.classList.add("nudge");
  }
}
function finishQuest() {
  const isle = run.isle;
  const firstVisit = isle.id !== "sea" && !S.done.includes(isle.id);
  const set = isle.id;
  const got = [];
  if (firstVisit) {
    const legendIdx = CARDS[set].findIndex(c => c[2] === 3);
    got.push(giveCard(set, legendIdx));
    S.done.push(isle.id);
  }
  // a pack: two cards, three on a strong round
  const packSize = run.firstTries >= 4 ? 3 : 2;
  for (let k = 0; k < packSize; k++) {
    // on the open sea, a small chance of the Sea Dragon
    if (set === "sea" && Math.random() < 0.12) got.push(giveCard("sea", 5));
    else got.push(giveCard(set, drawCard(set)));
  }
  S.voyages++;
  const bonus = firstVisit ? 5 : 3;
  S.coins += bonus;
  if (firstVisit) S.at = Math.min(S.done.length, ISLES.length - 1);
  save();
  const gift = firstVisit ? CARDS[set].find(c => c[2] === 3)[1] : null;
  run.reward = {
    opened: false, cards: got, fromAt: run.idx,
    title: firstVisit ? `${isle.god} is so happy!` : `Well sailed, Captain ${S.name}!`,
    lead: firstVisit ? `"Thank you, Captain ${S.name}! Please take this treasure chest."` : `${isle.god} has a treasure chest for you!`,
    text: firstVisit ? `You won the legendary ${gift} card, a pack of treasure cards, and ${bonus} bonus gold coins!` : `You found ${got.length} treasure cards and ${bonus} bonus gold coins!`,
  };
  sfx.fanfare(); confetti();
  go("reward");
  say(run.reward.lead + " Tap the treasure chest!");
}

// ================= balance scale =================
function scaleHTML(q, placed) {
  const L = q.left.reduce((a, b) => a + b, 0);
  const R = q.right.reduce((a, b) => a + b, 0) + (placed || 0);
  const ang = Math.max(-14, Math.min(14, (R - L) * 3));
  const leftStones = q.left.map(v => `<span class="stone">${v}</span>`).join("");
  const rightStones = q.right.map(v => `<span class="stone">${v}</span>`).join("") + (placed != null ? `<span class="stone drop">${placed}</span>` : `<span class="stone mystery">?</span>`);
  return `<div class="scale" id="scale">
      <span class="owl">🦉</span><div class="post"></div><div class="foot"></div>
      <div class="beam" style="transform:rotate(${ang}deg)">
        <div class="pan l" style="transform:rotate(${-ang}deg)"><svg class="strings" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0 L4 40 M50 0 L96 40" stroke="#8a6a3a" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/></svg><div class="dish">${leftStones}</div></div>
        <div class="pan r" style="transform:rotate(${-ang}deg)"><svg class="strings" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M50 0 L4 40 M50 0 L96 40" stroke="#8a6a3a" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/></svg><div class="dish">${rightStones}</div></div>
      </div>
    </div>
    <div class="eq" style="font-size:clamp(30px,6vmin,56px)">${q.left.join(" + ")} = ${q.right.join(" + ")} + <span class="q">${placed != null ? placed : "?"}</span></div>`;
}
function tiltTo(q, placed) {
  const stage = document.getElementById("stage");
  const L = q.left.reduce((a, b) => a + b, 0);
  // start from current tilt, then animate to the new tilt
  stage.innerHTML = scaleHTML(q, null);
  const R = q.right.reduce((a, b) => a + b, 0) + placed;
  const ang = Math.max(-14, Math.min(14, (R - L) * 3));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    stage.innerHTML = scaleHTML(q, placed);
    const beam = stage.querySelector(".beam");
    const start = Math.max(-14, Math.min(14, (q.right[0] - L) * 3));
    beam.style.transition = "none"; beam.style.transform = `rotate(${start}deg)`;
    beam.querySelectorAll(".pan").forEach(p => { p.style.transition = "none"; p.style.transform = `rotate(${-start}deg)`; });
    void beam.offsetWidth;
    beam.style.transition = ""; beam.style.transform = `rotate(${ang}deg)`;
    beam.querySelectorAll(".pan").forEach(p => { p.style.transition = ""; p.style.transform = `rotate(${-ang}deg)`; });
  }));
}

// ================= gold building =================
function drawTray() {
  const tray = document.getElementById("tray");
  if (!tray) return;
  const b = run.build;
  if (!b.bars && !b.coins) { tray.innerHTML = '<span class="empty-msg">Your gold goes here</span>'; return; }
  let h = "";
  for (let i = 0; i < b.bars; i++) h += `<button class="bar" data-act="rm-bar" aria-label="Take away a bar"></button>`;
  if (b.coins) { h += '<div class="coin-col">'; for (let i = 0; i < b.coins; i++) h += `<button class="coin" data-act="rm-coin" aria-label="Take away a coin"></button>`; h += "</div>"; }
  tray.innerHTML = h;
}
async function addBuildCoin() {
  const b = run.build;
  if (b.bars * 10 + b.coins >= 99) return pipSay("That's the most gold the forge can hold!");
  b.coins++; sfx.clink(); drawTray();
  if (b.coins === 10) {
    run.locked = true;
    document.querySelectorAll("#tray .coin").forEach(c => c.classList.add("melt"));
    pipSay("Ten coins! Hephaestus melts them into one gold bar!");
    await wait(900);
    b.coins = 0; b.bars++; sfx.magic(); drawTray(); run.locked = false;
  }
}

let selThing = -1;
function drawThings() {
  const box = document.getElementById("things");
  if (!box) return;
  const cab = document.getElementById("cabin");
  const unit = Math.min(cab.clientWidth, cab.clientHeight * 1.4) / 14;
  box.innerHTML = S.cabin.things.map((t, i) => {
    const d = DECOR.find(x => x.id === t.id); if (!d) return "";
    return `<div class="thing ${t.f ? "flipx" : ""} ${i === selThing ? "sel" : ""}" data-i="${i}" style="left:${t.x}%;top:${t.y}%;font-size:${(d.size * t.s * unit).toFixed(0)}px;z-index:${Math.round(t.y)}">${d.e}</div>`;
  }).join("") + (selThing >= 0 ? `<div class="selbar">
    <button class="icon-btn" data-act="th-big" aria-label="Bigger">➕</button><button class="icon-btn" data-act="th-small" aria-label="Smaller">➖</button>
    <button class="icon-btn" data-act="th-flip" aria-label="Flip">↔️</button><button class="icon-btn" data-act="th-away" aria-label="Put away">📦</button>
    <button class="icon-btn" data-act="th-ok" aria-label="Done">✅</button></div>` : "");
}
function drawDrawer() {
  const dr = document.getElementById("drawer");
  if (!dr) return;
  if (shopTab === "walls") {
    dr.innerHTML = WALLS.map(w => {
      const own = S.owned.includes("wall:" + w.id), on = S.cabin.wall === w.id;
      return `<button class="ware ${on ? "on" : ""} ${!own && S.coins < w.price ? "poor" : ""}" data-act="wall" data-v="${w.id}"><span class="sw" style="background:${w.css};width:56px;height:44px;border-radius:8px"></span><span class="nm">${w.name}</span><span class="pr">${own ? (on ? "Using" : "Yours") : "🪙 " + w.price}</span></button>`;
    }).join("");
  } else {
    dr.innerHTML = DECOR.map(d => {
      const own = S.owned.includes(d.id);
      return `<button class="ware ${!own && S.coins < d.price ? "poor" : ""}" data-act="decor" data-v="${d.id}"><span class="pic">${d.e}</span><span class="nm">${d.name}</span><span class="pr">${own ? "Add to room" : "🪙 " + d.price}</span></button>`;
    }).join("");

}
// drag furniture with one finger
let drag = null;
app.addEventListener("pointerdown", e => {
  const th = e.target.closest(".thing");
  if (!th || screen !== "cabin") return;
  e.preventDefault();
  const i = +th.dataset.i;
  const cab = document.getElementById("cabin").getBoundingClientRect();
  drag = { i, el: th, cab, moved: false, sx: e.clientX, sy: e.clientY };
  try { th.setPointerCapture(e.pointerId); } catch (_) {}
});
app.addEventListener("pointermove", e => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 6) drag.moved = true;
  if (!drag.moved) return;
  const t = S.cabin.things[drag.i];
  t.x = Math.max(4, Math.min(96, (e.clientX - drag.cab.left) / drag.cab.width * 100));
  t.y = Math.max(12, Math.min(99, (e.clientY - drag.cab.top) / drag.cab.height * 100 + 6));
  drag.el.style.left = t.x + "%"; drag.el.style.top = t.y + "%"; drag.el.style.zIndex = Math.round(t.y);
});
const endDrag = () => {
  if (!drag) return;
  const was = drag; drag = null;
  if (!was.moved) { selThing = selThing === was.i ? -1 : was.i; sfx.tap(); }
  save(); drawThings();
};
app.addEventListener("pointerup", endDrag);
app.addEventListener("pointercancel", endDrag);
window.addEventListener("resize", () => { if (screen === "cabin") drawThings(); });

// ================= buying =================
function buy(id, price) {
  if (S.owned.includes(id)) return true;
  if (S.coins < price) { sfx.wrong(); say(`You need ${price - S.coins} more gold coins for that. Solve some puzzles to earn more!`); return false; }
  S.coins -= price; S.owned.push(id); sfx.magic(); save();
  return true;
}

// ================= tap handling =================
app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act !== "ans") sfx.tap();
  switch (act) {
    case "story": storyStep = 0; go("story"); break;
    case "story-next": if (storyStep < 2) { storyStep++; go("story"); } else go("name"); break;
    case "shipname": S.shipName = v; document.querySelectorAll("#shipNames .chip").forEach(c => c.classList.toggle("on", c.dataset.v === v)); break;
    case "sayit": say(b.dataset.text); break;
    case "map": run = null; selThing = -1; resetArmed = false; go("map"); break;
    case "locked": RENDER.map({ pip: "That island is hidden in the clouds. Visit the next god first!" }); break;
    case "isle": startQuest(ISLES[+v], +v); break;
    case "opensea": startQuest(pick(CREATURES), S.at); break;
    case "begin": nextQ(); break;
    case "sayq": if (run && run.q) say(run.q.prompt); break;
    case "ans": {
      if (!run || run.locked) return;
      const val = +v, q = run.q;
      if (q.kind === "balance") {
        run.locked = true;
        tiltTo(q, val);
        if (val === q.answer) { await wait(700); onCorrect(null); }
        else {
          sfx.tap(); await wait(1000);
          onWrong(b);
          await wait(900);
          if (screen === "play" && run && run.q === q) { document.getElementById("stage").innerHTML = scaleHTML(q, null); run.locked = false; }
        }
      } else if (val === q.answer) onCorrect(b); else onWrong(b);
      break;
    }
    case "b-bar": {
      if (run.locked) return;
      const bb = run.build;
      if (bb.bars >= 9) { pipSay("Nine bars is all the forge can hold!"); break; }
      bb.bars++; sfx.clink(); drawTray(); break;
    }
    case "b-coin": if (!run.locked) addBuildCoin(); break;
    case "rm-bar": if (!run.locked && run.build.bars) { run.build.bars--; drawTray(); } break;
    case "rm-coin": if (!run.locked && run.build.coins) { run.build.coins--; drawTray(); } break;
    case "b-done": {
      if (run.locked) return;
      const q = run.q, have = run.build.bars * 10 + run.build.coins;
      if (have === q.target) {
        document.querySelectorAll(".build-btns .btn").forEach(x => x.disabled = true);
        onCorrect(null);
      } else {
        run.miss++; sfx.wrong();
        const tens = Math.floor(q.target / 10), ones = q.target % 10;
        const youHave = `You have ${run.build.bars} ${run.build.bars === 1 ? "bar" : "bars"} and ${run.build.coins} ${run.build.coins === 1 ? "coin" : "coins"}. That's ${have}.`;
        const need = `We need ${q.target}: ${tens} ${tens === 1 ? "bar" : "bars"} and ${ones} ${ones === 1 ? "coin" : "coins"}.`;
        pipSay(`${have > q.target ? "Too much gold!" : "Not enough gold yet!"} ${youHave} ${need}`);
        if (run.miss >= 2) {
          const t = document.querySelector("#stage .target");
          if (t) t.insertAdjacentHTML("beforeend", `<div class="caption">${tens} ${tens === 1 ? "bar" : "bars"} and ${ones} ${ones === 1 ? "coin" : "coins"}</div>`);
        }
      }
      break;
    }
    case "open-chest": {
      run.reward.opened = true; sfx.magic(); confetti(24, ["✨", "🌟", "💫"]);
      RENDER.reward();
      const legend = run.reward.cards.find(c => CARDS[c.set][c.i][2] === 3);
      say(legend ? `Wow! The legendary ${CARDS[legend.set][legend.i][1]} card!` : `${run.reward.cards.filter(c => c.isNew).length ? "New cards for your binder!" : "More treasure cards!"}`);
      break;
    }
    case "sail-on": {
      const from = run.reward.fromAt; run = null; screen = "map";
      RENDER.map({ from });
      break;
    }
    case "cards": go("cards"); break;
    case "shop": go("shop"); break;
    case "cabin": selThing = -1; shopTab = "things"; go("cabin"); break;
    case "grown": go("grown"); break;
    case "ware": {
      const w = SHIP_SHOP.find(x => x.id === v);
      const owned = S.owned.includes(w.id);
      if (!buy(w.id, w.price)) break;
      if (w.type === "crew") {
        const c = S.look.crew;
        if (c.includes(w.val)) { if (owned) S.look.crew = c.filter(x => x !== w.val); }
        else { if (c.length >= 4) c.shift(); c.push(w.val); }
      } else S.look[w.type] = w.val;
      save(); RENDER.shop(); break;
    }
    case "friend": {
      const c = S.look.crew;
      if (c.includes(v)) S.look.crew = c.filter(x => x !== v); else { if (c.length >= 4) c.shift(); c.push(v); }
      save(); RENDER.shop(); break;
    }
    case "ctab": shopTab = v; RENDER.cabin(); break;
    case "decor": {
      const d = DECOR.find(x => x.id === v);
      if (!buy(d.id, d.price)) break;
      S.cabin.things.push({ id: d.id, x: 35 + Math.random() * 30, y: 90, s: 1, f: false });
      selThing = S.cabin.things.length - 1; save();
      document.getElementById("coinCount").textContent = S.coins;
      drawThings(); drawDrawer(); break;
    }
    case "wall": {
      const w = WALLS.find(x => x.id === v);
      if (!buy("wall:" + w.id, w.price)) break;
      S.cabin.wall = w.id; save(); RENDER.cabin(); break;
    }
    case "th-big": if (selThing >= 0) { const t = S.cabin.things[selThing]; t.s = Math.min(2.2, +(t.s * 1.2).toFixed(2)); save(); drawThings(); } break;
    case "th-small": if (selThing >= 0) { const t = S.cabin.things[selThing]; t.s = Math.max(.45, +(t.s / 1.2).toFixed(2)); save(); drawThings(); } break;
    case "th-flip": if (selThing >= 0) { const t = S.cabin.things[selThing]; t.f = !t.f; save(); drawThings(); } break;
    case "th-away": if (selThing >= 0) { S.cabin.things.splice(selThing, 1); selThing = -1; save(); drawThings(); } break;
    case "th-ok": selThing = -1; drawThings(); break;
    case "t-voice": S.settings.voice = !S.settings.voice; save(); RENDER.grown(); break;
    case "t-sound": S.settings.sound = !S.settings.sound; save(); RENDER.grown(); break;
    case "reset1": resetArmed = true; RENDER.grown(); break;
    case "reset0": resetArmed = false; RENDER.grown(); break;
    case "reset2": resetArmed = false; S = fresh(); save(); storyStep = 0; go("title"); break;
  }
});

// test hook for automated checks
window.__voyage = { get state() { return S; }, get run() { return run; }, get screen() { return screen; }, GEN, CARDS, ISLES, CREATURES };
go("title");
})();
</script>
<script type="module" id="gl3d-loader">
/* Load the 3D world unless ?g3d=0 (or ?gl=0). If it fails, the game keeps its 2D drawings. */
if (!/[?&](g3d|gl)=0\b/.test(location.search)) import('./world3d.js').catch(e => { console.warn('[3d] off:', e && e.message); document.body.classList.remove('g3d'); const c = document.getElementById('gl3d'); if (c) c.remove(); });
</script>
