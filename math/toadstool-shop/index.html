.pop{animation:pop .35s ease-out}

/* KidVoice: one friendly voice for every game.
   Source of truth is shared/voice.js; tools/sync-voice.py copies it into each game
   so every index.html stays self-contained.

   1. Recorded clips first: if voice/manifest.json (made by tools/make-voice-clips.mjs)
      has a clip for a sentence, it plays that. Lines with numbers or names in them, like
      "7 plus 5" or "This lantern needs 7 fireflies", are stitched from shorter clips.
      A character can have their own recorded voice: KidVoice.speak(text, { voice: 'bramble' }).
   2. Otherwise the device's own speech, using the most natural voice it has
      (Premium / Enhanced iPad voices first, never the novelty or robot voices).
   A grown-up can pin a voice from The Wonder Shelf; it is saved in localStorage["gfk-voice"]. */
(function () {
  if (window.KidVoice) return;
  const synth = window.speechSynthesis || null;
  const NOVELTY = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Kathy)\b/i;
  const ROBOTIC = /\b(Eddy|Flo|Reed|Rocko|Sandy|Shelley|Grandma|Grandpa)\b/i; // iOS "Eloquence" voices
  const FAVORITES = ['Ava', 'Zoe', 'Samantha', 'Allison', 'Susan', 'Nicky', 'Serena', 'Karen', 'Moira', 'Kate', 'Tessa', 'Evan', 'Nathan', 'Tom', 'Daniel'];

  function score(v) {
    const id = (v.name || '') + ' ' + (v.voiceURI || '');
    let s = 0;
    if (NOVELTY.test(v.name)) s -= 100;
    if (ROBOTIC.test(v.name)) s -= 60;
    if (/premium/i.test(id)) s += 60;
    else if (/enhanced/i.test(id)) s += 40;
    if (/siri/i.test(id)) s += 35;
    if (/Online \(Natural\)/i.test(id)) s += 45; // Edge
    if (/^Google/i.test(v.name)) s += 20;      // Chrome
    const fav = FAVORITES.findIndex(n => new RegExp('\\b' + n + '\\b', 'i').test(v.name));
    if (fav >= 0) s += 15 - fav * 0.5;
    if (/en[-_]US/i.test(v.lang)) s += 5; else if (/en[-_]GB/i.test(v.lang)) s += 4; else if (/en[-_](AU|IE|NZ|CA)/i.test(v.lang)) s += 3;
    if (v.default) s += 1;
    return s;
  }
  function voices() {
    try { return (synth && synth.getVoices() || []).filter(v => /^en/i.test(v.lang)); } catch (e) { return []; }
  }
  function ranked() { return voices().map(v => ({ v, s: score(v) })).sort((a, b) => b.s - a.s).map(x => x.v); }
  let chosen = null;
  function pick() {
    let pinned = null;
    try { pinned = localStorage.getItem('gfk-voice'); } catch (e) {}
    const list = ranked();
    chosen = (pinned && list.find(v => v.voiceURI === pinned || v.name === pinned)) || list[0] || null;
    return chosen;
  }
  if (synth) { pick(); try { synth.addEventListener('voiceschanged', pick); } catch (e) {} }

  /* ---- recorded clips ---- */
  // manifest: { lines: {key: file}, voices: {character: {lines}}, packs: {file: [pack, start, length]} }
  // Clips can be bundled into a few "pack" files (tools/pack-voice.mjs) so the shelf stays under its file limit.
  let clips = null;
  const base = (document.currentScript && document.currentScript.dataset.voiceBase) || '../../voice/';
  try {
    if (location.protocol !== 'file:') fetch(base + 'manifest.json').then(r => r.ok ? r.json() : null)
      .then(m => { if (m && m.lines) clips = { base, lines: m.lines, voices: m.voices || {}, packs: m.packs || {} }; }).catch(() => {});
  } catch (e) {}
  const key = t => String(t).toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  // Cover a sentence with as few recorded pieces as possible, like "here is a bag of" + "5" + "acorn buns" + "for your shop".
  // Too many tiny pieces would sound choppy, so then it gives up and the device voice reads the line.
  function stitch(k, lines) {
    if (lines[k]) return [lines[k]];
    // Numbers past 100 are said in two pieces: 150 is "100" + "50".
    const w = k.split(' ').flatMap(t => /^[1-9]\d\d$/.test(t) && !lines[t] ? [String(t[0] * 100)].concat(+t.slice(1) ? [String(+t.slice(1))] : []) : [t]);
    const n = w.length, best = [[]];
    for (let i = 1; i <= n; i++) {
      for (let j = Math.max(0, i - 40); j < i; j++) {
        const f = best[j] && lines[w.slice(j, i).join(' ')];
        if (f && (!best[i] || best[j].length + 1 < best[i].length)) best[i] = best[j].concat(f);
      }
    }
    const p = best[n];
    return p && p.length <= Math.max(3, Math.ceil(n * 0.75)) ? p : null;
  }
  function planWith(text, lines) {
    const plan = [];
    for (const sentence of String(text).match(/[^.!?]+[.!?]*/g) || []) {
      const k = key(sentence); if (!k) continue;
      const p = stitch(k, lines);
      if (!p) return null; // one sentence without a recording: use one voice for the whole line so it sounds even
      plan.push(...p);
    }
    return plan.length ? plan : null;
  }
  // A character's own voice first (opts.voice, like "bramble"), then the main voice.
  function clipPlan(text, who) {
    if (!clips) return null;
    const own = who && clips.voices[who];
    return (own && planWith(text, own.lines)) || planWith(text, clips.lines);
  }
  const packs = {}, urls = {};
  function clipUrl(f) {
    const p = clips.packs[f];
    if (!p) return Promise.resolve(clips.base + f);
    if (!urls[f]) {
      packs[p[0]] = packs[p[0]] || fetch(clips.base + p[0]).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
      urls[f] = packs[p[0]].then(b => URL.createObjectURL(new Blob([b.slice(p[1], p[1] + p[2])], { type: 'audio/mpeg' })));
      urls[f].catch(() => { delete urls[f]; delete packs[p[0]]; });
    }
    return urls[f];
  }
  const audio = typeof Audio !== 'undefined' ? new Audio() : null;
  let queue = [], turn = 0, playing = false;
  function playNext() {
    if (!audio || !queue.length) { playing = false; return; }
    playing = true;
    const t = turn;
    clipUrl(queue.shift()).then(u => {
      if (t !== turn) return;
      audio.src = u;
      return audio.play();
    }).catch(() => { if (t === turn) { queue = []; playing = false; } });
  }
  if (audio) audio.addEventListener('ended', playNext);
  function stopClips() { queue = []; turn++; playing = false; if (audio) try { audio.pause(); } catch (e) {} }
  // Games call speechSynthesis.cancel() when they change screens; make that stop clips too.
  if (synth) try { const cancel = synth.cancel.bind(synth); synth.cancel = function () { stopClips(); cancel(); }; } catch (e) {}
  // iPad Safari only plays audio after a tap: unlock the player on the first touch.
  if (audio) document.addEventListener('pointerdown', function unlock() {
    document.removeEventListener('pointerdown', unlock, true);
    if (!audio.src) { audio.src = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA=='; audio.play().catch(() => {}); }
  }, true);

  function speak(text, opts) {
    opts = opts || {};
    if (!text) return;
    const plan = clipPlan(text, opts.voice);
    if (plan) {
      if (!opts.queue) { try { synth && synth.cancel(); } catch (e) { stopClips(); } }
      plan.forEach(f => clipUrl(f).catch(() => {})); // start unpacking every piece now, so they play without gaps
      queue.push(...plan);
      if (!playing) playNext();
      return;
    }
    if (!synth) return;
    try {
      if (!opts.queue) synth.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      const v = chosen || pick();
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      // A natural pitch: raised pitch is what made the old voice sound strained and creepy.
      u.rate = Math.min(1.05, Math.max(0.75, opts.rate || 0.92));
      u.pitch = Math.min(1.05, Math.max(0.95, opts.pitch || 1));
      synth.speak(u);
    } catch (e) {}
  }

  window.KidVoice = { speak, stop: () => { try { synth ? synth.cancel() : stopClips(); } catch (e) {} }, pick, ranked, score, current: () => chosen, key, plan: clipPlan };
})();
</script>
<script id="gfk-cards">
/* GFKCards: one card look, one pack-opening moment and one lucky-draw system for every game.
   Source of truth is this file; tools/sync-cards.py copies it into each game and the shelf
   as the "gfk-cards" script block so every index.html stays self-contained.

   Games call GFKCards.collect({game, id, name, emoji, rarity}) when she earns a card.
   It writes the card to the shared "gfk-collection" list (same shape as before), then:
   - Luck: a common or rare card can come out Shiny (holo). Never fewer than one Shiny in 7 packs.
   - Bonus: some packs also hold a Wonder Charm from a shared set, never a duplicate.
     Never more than 3 packs in a row without one.
   - Saved for last: each game's finale card is Legendary, and Crown Cards unlock at
     8, 20, 35, 55 and 80 cards collected across every game.
   Nothing is ever bought or lost. New cards wait in a glowing pack button; tapping it opens them.
   GFKCards.face(card) draws a card; GFKCards.view(cards, i) opens the big swipeable viewer. */
(function () {
  if (window.GFKCards) return;
  const KEY = "gfk-collection", LUCK = "gfk-cards-luck";
  const TIERS = { common: 0, rare: 1, sparkly: 2, legendary: 3 };
  const TIER_NAME = { common: "Common", rare: "Rare", sparkly: "Shiny", legendary: "Legendary" };
  const TIER_GEMS = { common: "●", rare: "◆◆", sparkly: "✦✦✦", legendary: "👑" };
  const SETS = {
    "moonlit-map": { name: "The Moonlit Map", icon: "🗺️", a: "#9fb4f0", b: "#3d5bb0" },
    "fairy-lantern-festival": { name: "Lantern Festival", icon: "🏮", a: "#f6c6ec", b: "#a24e93" },
    "gemling-grids": { name: "Crystal Caves", icon: "💎", a: "#a9eadf", b: "#2b7f75" },
    "egypt-puzzles": { name: "Miu's Pyramids", icon: "🔺", a: "#ffe3a1", b: "#c08523" },
    "mouse-shop": { name: "Acorn Bakery", icon: "🥐", a: "#f5d2b0", b: "#9a6038" },
    "pirate-voyage": { name: "The Shining Sea", icon: "⚓", a: "#a9dcf5", b: "#235f8c" },
    "toadstool-shop": { name: "The Toadstool Shop", icon: "🍄", a: "#ffc9c9", b: "#c23f55" },
    "wonder-charms": { name: "Wonder Charms", icon: "🍀", a: "#d9ccff", b: "#6a4fc4" },
    "wonder-crowns": { name: "Crown Cards", icon: "👑", a: "#fff0b3", b: "#c9931a" }
  };
  // Each game's very last reward is its Legendary card.
  const FINALES = { "egypt-puzzles": ["hidden-3"], "gemling-grids": ["card-r-moonFinale"], "fairy-lantern-festival": ["starwing"], "pirate-voyage": ["sea:5"], "mouse-shop": ["mouse-shop-moonbeam-the-unicorn-sparkly"], "toadstool-shop": ["friend-queen"] };
  const CROWNS = [
    { at: 8, id: "scarab", name: "The Golden Scarab", emoji: "🪲" },
    { at: 20, id: "fairy-queen", name: "The Fairy Queen", emoji: "🧚" },
    { at: 35, id: "crystal-dragon", name: "The Crystal Dragon", emoji: "🐉" },
    { at: 55, id: "moon-pegasus", name: "The Moon Pegasus", emoji: "🦄" },
    { at: 80, id: "wonder-crown", name: "The Crown of Wonders", emoji: "👑" }
  ];
  const CHARMS = [
    ["clover", "🍀", "Four-Leaf Clover", "common"], ["shell", "🐚", "Mermaid Shell", "common"], ["toadstool", "🍄", "Fairy Toadstool", "common"],
    ["moon", "🌙", "Moon Pebble", "common"], ["feather", "🪶", "Owl Feather", "common"], ["daisy", "🌼", "Daisy Chain", "common"],
    ["cupcake", "🧁", "Mouse-Size Cupcake", "common"], ["ribbon", "🎀", "Silk Ribbon", "common"], ["bell", "🔔", "Fairy Bell", "common"],
    ["teapot", "🫖", "Tiny Teapot", "common"], ["coin", "🪙", "Pirate Coin", "common"], ["compass", "🧭", "Lucky Compass", "common"],
    ["ladybird", "🐞", "Ladybird", "common"], ["acorn", "🌰", "Golden Acorn", "common"],
    ["butterfly", "🦋", "Rainbow Butterfly", "rare"], ["crystal", "🔮", "Crystal Ball", "rare"], ["amphora", "🏺", "Greek Amphora", "rare"],
    ["key", "🗝️", "Skeleton Key", "rare"], ["owl", "🦉", "Athena's Owl", "rare"], ["bastet", "🐈", "Bastet the Cat", "rare"],
    ["rainbow", "🌈", "Bottled Rainbow", "sparkly"], ["diamond", "💎", "Pirate Diamond", "sparkly"], ["star", "⭐", "Wishing Star", "sparkly"],
    ["wand", "🪄", "Fairy Wand", "sparkly"]
  ];
  const CHARM_WEIGHT = { common: 70, rare: 24, sparkly: 6 };
  const SHINY_CHANCE = { common: 0.12, rare: 0.2 }, SHINY_PITY = 7, BONUS_CHANCE = 0.3, BONUS_PITY = 3;

  const ls = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const tierOf = c => (c && TIERS[c.rarity] != null ? c.rarity : "common");
  const keyOf = c => (c.game || "") + "/" + (c.id || c.name);
  const reduced = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };

  function list() {
    const v = ls.get(KEY, []);
    if (!Array.isArray(v)) return [];
    return v.filter(x => x && typeof x === "object").map(x => (FINALES[x.game] || []).includes(x.id) ? Object.assign({}, x, { rarity: "legendary" }) : x);
  }

  /* ---------- card face ---------- */
  function face(c, opts) {
    opts = opts || {};
    const set = SETS[c.game] || { name: "Treasures", icon: "⭐", a: "#eadcc4", b: "#8a6a45" };
    const t = tierOf(c);
    const cls = ["gfc", "t-" + t, c.shiny ? "shiny" : "", opts.big ? "big" : "", opts.isNew ? "is-new" : ""].join(" ");
    return `<div class="${cls}" style="--a:${set.a};--b:${set.b}" role="img" aria-label="${esc(c.name)}, ${TIER_NAME[t]} card from ${esc(set.name)}">
      <div class="gfc-in">
        <div class="gfc-top"><span class="gfc-name">${esc(c.name || "Card")}</span></div>
        <div class="gfc-art"><span class="gfc-rays"></span><span class="gfc-emo">${esc(c.emoji || "⭐")}</span></div>
        <div class="gfc-bot"><span class="gfc-set">${set.icon} ${esc(set.name)}</span><span class="gfc-gem">${TIER_GEMS[t]}</span></div>
      </div>
      <div class="gfc-foil"></div><div class="gfc-glare"></div>
      ${opts.isNew ? '<span class="gfc-new">NEW</span>' : ""}
    </div>`;
  }
  function locked(crown) {
    return `<div class="gfc t-locked" role="img" aria-label="Locked Crown Card"><div class="gfc-in">
      <div class="gfc-top"><span class="gfc-name">Crown Card</span></div>
      <div class="gfc-art"><span class="gfc-emo">🔒</span></div>
      <div class="gfc-bot"><span class="gfc-set">Unlocks at ${crown.at} cards</span></div></div></div>`;
  }

  /* ---------- sounds ---------- */
  let AC = null;
  function tone(freq, at, dur, type, vol) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === "suspended") AC.resume();
      const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + at;
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  function soundsOn() { try { return localStorage.getItem("gfk-card-sound") !== "off"; } catch (e) { return true; } }
  function chime(t) {
    if (!soundsOn()) return;
    const notes = { common: [523, 659, 784], rare: [523, 659, 784, 1047], sparkly: [587, 740, 880, 1175, 1480], legendary: [392, 523, 659, 784, 1047, 1319, 1568] }[t];
    notes.forEach((f, i) => { tone(f, i * 0.09, 0.5, "triangle", 0.1); if (t !== "common") tone(f * 2, i * 0.09 + 0.03, 0.4, "sine", 0.04); });
    if (t === "legendary") [523, 659, 784].forEach(f => tone(f, notes.length * 0.09 + 0.1, 1.4, "sine", 0.07));
  }
  const rustle = () => { if (soundsOn()) [180, 140, 220].forEach((f, i) => tone(f, i * 0.07, 0.12, "sawtooth", 0.03)); };

  /* ---------- styles ---------- */
  const CSS = `
.gfc,.gfc *,.gfk-ov *,.gfk-view *,.gfk-packbtn{box-sizing:border-box}
.gfc{--a:#eee;--b:#888;--mx:50%;--my:50%;--rx:0deg;--ry:0deg;position:relative;container-type:inline-size;aspect-ratio:5/7;width:100%;border-radius:7%/5%;
  background:linear-gradient(160deg,#fffdf7,#efe6d6);padding:4.5%;box-shadow:0 2px 0 #0002,0 6px 14px #0002;overflow:hidden;isolation:isolate;
  font-family:"Grandstander","Andika","Trebuchet MS",system-ui,sans-serif;color:#2c2118;user-select:none;-webkit-user-select:none;transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry));}
.gfc-in{position:relative;height:100%;display:flex;flex-direction:column;gap:3cqw;border-radius:4cqw;padding:3.5cqw;background:linear-gradient(170deg,var(--a),color-mix(in srgb,var(--a) 55%,var(--b)));box-shadow:inset 0 0 0 1.2cqw #fff8}
.gfc-top{display:flex;align-items:center;justify-content:center;min-height:15cqw;background:#fffc;border-radius:3cqw;padding:1cqw 3cqw}
.gfc-name{font-weight:800;font-size:9.5cqw;line-height:1;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gfc-art{position:relative;flex:1;border-radius:4cqw;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#fff 0,color-mix(in srgb,var(--a) 70%,#fff) 35%,var(--b) 110%);box-shadow:inset 0 0 0 1cqw #fff9,inset 0 -4cqw 8cqw #0002}
.gfc-art::before{content:"";position:absolute;inset:0;opacity:.25;background-image:radial-gradient(circle,#fff 0 1.2cqw,transparent 1.5cqw);background-size:14cqw 14cqw}
.gfc-emo{position:relative;font-size:40cqw;line-height:1;filter:drop-shadow(0 2.5cqw 2cqw #0004)}
.gfc-rays{position:absolute;inset:-50%;display:none;background:repeating-conic-gradient(from 0deg,#fff5 0 8deg,transparent 8deg 20deg)}
.gfc-bot{display:flex;align-items:center;justify-content:space-between;gap:2cqw;font-weight:800;font-size:6.5cqw;line-height:1.1}

.gfc.t-sparkly .gfc-foil{mix-blend-mode:color-dodge;opacity:.42;
  background:repeating-linear-gradient(110deg,#ff6ec7 0,#ffe66e 8%,#6effa8 16%,#6ed8ff 24%,#c06eff 32%,#ff6ec7 40%),radial-gradient(circle,#fff 0 .6cqw,transparent .8cqw);
  background-size:300% 300%,7cqw 7cqw;background-position:var(--mx) var(--my),0 0;animation:gfc-foil 5s ease-in-out infinite}

function coinWords(coins) {
  const d = coins.filter(v => v === 10).length, k = coins.filter(v => v === 5).length, p = coins.filter(v => v === 1).length;
  const parts = [d && (d === 1 ? 'a dime' : `${d} dimes`), k && 'a nickel', p && `${p} ${plural(p, 'penny', 'pennies')}`].filter(Boolean);
  return (coins.length === 1 ? 'is ' : 'are ') + parts.join(' and ');
}
function coinsFor(n) {
  const out = [], F = S.lv.F;
  if (F >= 3) while (n >= 10) { out.push(10); n -= 10; }
  if (F >= 4) while (n >= 5) { out.push(5); n -= 5; }
  while (n > 0) { out.push(1); n--; }
  return out;
}
function sparkle(el, n = 12) {
  const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  for (let i = 0; i < n; i++) { const s = document.createElement('div'); s.className = 'spark'; s.textContent = pick(['✨', '⭐', '💛', '🌟']); s.style.left = x - 14 + 'px'; s.style.top = y - 14 + 'px'; const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90; s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d - 30 + 'px'); document.body.appendChild(s); setTimeout(() => s.remove(), 1100); }
}

/* ================= asking a question, gently ================= */
function options(ans, lo = 0) {
  const c = new Set([ans]);
  const near = shuffle([ans - 1, ans + 1, ans + 2, ans - 2, ans + 10, ans - 10].filter(v => v >= lo && v !== ans));
  for (const v of near) { if (c.size >= 3) break; c.add(v); }
  let k = 3; while (c.size < 3) c.add(ans + k++);
  return [...c].sort((a, b) => a - b);
}
// A new wrong choice near the answer that is not on the buttons and has not been tried.
function freshOpt(ans, not, lo = 0) {
  const pool = shuffle([ans - 1, ans + 1, ans - 2, ans + 2, ans + 3, ans - 3, ans + 10, ans - 10, ans + 4].filter(v => v >= lo && v !== ans && !not.includes(v)));
  return pool.length ? pool[0] : null;
}
// Guessing should not pay. While she serves a friend, TIP tracks whether every answer was right on the first tap;
// if so the friend leaves a penny tip. A wrong tap that comes this soon after the buttons appear is a guess.
let TIP = null; const QUICK_MS = 1500;
// o: {k, who, q, show(), answer, opts, help(), helpSay, labels:{v:html}}
function ask(o) {
  return new Promise(res => {
    let misses = 0, helped = false, paused = false, shownAt = Date.now(); const gone = new Set(); let done = false;
    const fixed = !!o.opts, opts = o.opts || options(o.answer, o.lo || 0);
    DBG.cur = { type: 'ask', answer: o.answer, k: o.k, opts };
    say(o.who, o.q);
    const coach = coachOnce('ask');
    const draw = () => setPanel(`
      ${coach && !misses ? `<div class="coach">👆 Tap the right answer.</div>` : ''}
      ${o.show ? `<div class="row ${o.peek ? 'mm-peekable' : ''}">${o.show()}</div>` : ''}
      <div class="helpbox" id="hb">${helped && o.help ? o.help() : ''}</div>
      <div class="opts ${paused ? 'wait' : ''}">${opts.map(v => `<button class="opt ${(fixed && gone.has(v)) || (misses >= 2 && v !== o.answer) ? 'no' : ''} ${misses >= 2 && v === o.answer ? 'glow' : ''}" data-v="${v}" ${paused ? 'disabled' : ''}>${o.labels ? o.labels[v] : v}</button>`).join('')}</div>
      ${o.help && !helped ? `<button class="hint" id="hint">💡 Help me</button>` : ''}
      ${o.back ? `<button class="btn alt" id="bk">${o.back}</button>` : ''}`, p => {
      $$('.opt', p).forEach(b => b.addEventListener('click', () => choose(b.dataset.v, b)));
      if (o.back) $('#bk', p).addEventListener('click', () => { if (done) return; done = true; SFX.tap(); rerender = null; res('back'); });
      const h = $('#hint', p); if (h) h.addEventListener('click', () => { SFX.tap(); helped = true; draw(); if (o.helpSay) say(o.helpWho || o.who, o.helpSay); });
      if (o.peek) Mental.armPeek(p, o, helped);
    });
    async function choose(v, b) {
      if (done || paused) return;
      v = isNaN(+v) ? v : +v;
      if (v === o.answer) {
        done = true; rerender = null;
        record(o.k, misses === 0 && !helped); Mental.solved(o, misses === 0 && !helped);
        b.classList.add('yes', 'pop'); sparkle(b); SFX.ok();
        if (o.after !== false) speak(pick(['Yes!', 'That\'s right!', 'You got it!', 'Perfect!']));
        await wait(900); res(misses === 0);
        return;
      }
      misses++; gone.add(v); SFX.soft(); if (TIP) TIP.ok = false;
      // No free guesses: the wrong answer is swapped for a new one, so tapping around does not narrow it down,
      // and the buttons rest while the help opens (longer after a very quick tap). After a second miss the answer glows.
      const quick = Date.now() - shownAt < QUICK_MS;
      if (!fixed) { const i = opts.indexOf(v), f = freshOpt(o.answer, opts.concat([...gone]), o.lo || 0); if (i >= 0 && f !== null) { opts[i] = f; opts.sort((a, b) => a - b); } }
      if (misses === 1) { helped = !!o.help; say(o.helpWho || o.who, (quick ? 'Whoa, quick paws! ' : '') + (o.helpSay || 'Hmm, not quite. Let\'s look again together.')); }
      else say(o.who, o.lastSay || `Let's count it together. It's ${o.answer}. Tap ${o.answer}.`);
      paused = misses === 1; draw();
      if (paused) { await wait(quick ? 3200 : 1800); paused = false; if (!done) { draw(); shownAt = Date.now(); } }
    }
    rerender = draw; draw();
  });
}

// She counts goods into the customer's basket.
function pickTask(order, who) {
  return new Promise(res => {
    const basket = {}; let tries = 0; DBG.cur = { type: 'pick', order };
    const goods = order.map(o => o[0]);
    const coach = coachOnce('pick');
    if (coach) speak(`Tap the ${GOODS[goods[0]].one} to put it in the basket. Then tap Here you go!`, { queue: true });
    const draw = () => { const full = order.every(([g, n]) => (basket[g] || 0) === n); setPanel(`
      ${coach ? `<div class="coach">👆 Tap the ${GOODS[goods[0]].one} to put ${order[0][1] === 1 ? 'it' : 'them'} in the basket. Then tap <b>Here you go!</b></div>` : ''}

}
// She moves coins from a tray into someone's paw. mode 'pay' lets her give more and get change back.
function coinsTask({ who, amount, source, title, prompt, mode = 'exact', k = 'F', helpSay = '', coach = '', back = '', countUp = null }) {
  return new Promise(res => {
    const src = source.map((v, i) => ({ v, i, given: false })); let tries = 0, rest = false; DBG.cur = { type: 'coins', amount, mode };
    say(who, prompt);
    if (coach) speak(coach.replace(/<[^>]+>/g, ''), { queue: true });
    const total = () => src.filter(c => c.given).reduce((s, c) => s + c.v, 0);
    const draw = () => { const t = total(), first = src.find(c => !c.given); setPanel(`
      ${coach ? `<div class="coach">👆 ${coach}</div>` : ''}
      <div class="tray"><span class="lbl">${title}</span>${src.map(c => coinHTML(c.v, 'button', `data-i="${c.i}" ${c.given ? 'style="visibility:hidden"' : coach && t < amount && c === first ? 'class="pulse"' : ''}`)).join('')}</div>
      ${countUp && tries && countUp.to - countUp.from <= 20 ? `<div class="countup"><b>${countUp.from}</b>${Array.from({ length: countUp.to - countUp.from }, (_, i) => `<i class="${i < t ? 'on' : ''}">${countUp.from + i + 1}</i>`).join('')}</div>` : ''}
      <div class="tray drop" id="paw"><span class="lbl">${mode === 'change' ? 'Change for ' + CAST[who].name : 'For ' + CAST[who].name}</span>${src.filter(c => c.given).map(c => coinHTML(c.v, 'button', `data-i="${c.i}"`)).join('')}</div>
      <div class="row">${back ? `<button class="btn alt" id="bk">${back}</button>` : ''}<button class="btn ${coach && t >= amount ? 'pulse' : ''}" id="done">Done</button></div>`, p => {
      if (back) $('#bk', p).addEventListener('click', () => { SFX.tap(); rerender = null; res(null); });
      $$('.tray:not(#paw) .coin', p).forEach(b => b.addEventListener('click', () => { const c = src[+b.dataset.i]; c.given = true; SFX.coin(total()); speak(String(total())); draw(); }));
      $$('#paw .coin', p).forEach(b => b.addEventListener('click', () => { const c = src[+b.dataset.i]; c.given = false; SFX.tap(); draw(); }));
      $('#done', p).addEventListener('click', () => {
        if (rest) return;
        const t = total();
        if (t === amount || (mode === 'pay' && t > amount)) { rerender = null; record(k, tries === 0); SFX.ok(); res(t); return; }
        tries++; SFX.soft(); if (TIP) TIP.ok = false;
        rest = true; setTimeout(() => { rest = false; }, 1200); if (rerender) draw();
        if (helpSay && tries === 1) say(who, `Hmm, not quite. ${helpSay}`);
        else if (t < amount) say(who, `That's ${t}. I need ${amount}. A little more, please!`);
        else say(who, `That's ${t}. That's more than ${amount}. Tap a coin to take it back.`);
      });
    }); };
    rerender = draw; draw();
  });
}

/* ----- morning: Bramble's cart ----- */
function packFor() { const M = S.lv.M; return M >= 4 ? pick([2, 5, 10]) : M >= 3 ? 5 : 2; }
const PACK = { 2: 'bag', 5: 'box', 10: 'crate' }, PACKS = { 2: 'bags', 5: 'boxes', 10: 'crates' };
// Bramble sells at half the usual price, so every good she sells earns her something,
// and every fresh good left over at night is pennies she spent for nothing.
const packCost = (g, size) => Math.max(1, Math.ceil(size * GOODS[g].price / 2));
// She sets her own prices. The usual price is GOODS[g].price; higher means fewer animals buy.
const priceOf = g => S.prices[g] || GOODS[g].price;
const priceMax = g => Math.max(GOODS[g].price * 2, GOODS[g].price + 3);
// How many an animal buys at her price, if they would buy n at the usual price.
// Steep enough that a little above the usual price earns most and a lot above earns less.
function wantAt(g, n) {
  const x = n * Math.pow(GOODS[g].price / priceOf(g), 1.6);
  return Math.min(n * 2 + 1, Math.floor(x) + (Math.random() < x - Math.floor(x) ? 1 : 0));
}
async function morning() {
  // from day 5 she can take a day off for Hide and Seek or Firefly Jars instead (mental.js)
  setScene('outside', { time: 'morning' });
  const off = await Mental.chooseDay();
  if (off) { S.play = off; S.phase = 'play'; save(); hush(); setPanel(''); return; }
  setScene('outside', { time: 'morning', cart: true, cam: 'cart' });
  S.sold = {}; S.missed = {}; S.dear = {}; S.spent = 0; S.shop = null;
  await walkIn('bramble');
  if (S.day === 1) {
    await talk('bramble', `Good morning, ${S.keeper.name}! I'm Bramble. Every morning I bring things for your shop.`);
    await talk('bramble', 'You buy them from me, and sell them to the animals of the wood.');
    await firstCart();
    S.wanted = {}; S.phase = 'shop'; for (const g of Object.keys(S.stock)) S.had[g] = S.stock[g]; save();
    await walkOut();
    return;
  } else {
    const want = Object.keys(S.wanted || {});
    if (want.length && S.day >= PRICES_DAY) await talk('keeper', `My notebook says: friends asked for ${want.map(g => GOODS[g].many).join(' and ')}!`);
    await talk('bramble', pick(['Good morning! What would you like today?', 'Hello again! My cart is full of good things.', 'Morning! Lovely day for shopping.']));
  }
  const offer = [...new Set([...unlocked(S.day), ...Object.keys(S.wanted || {})])].filter(g => GOODS[g]);
  // Everything on Bramble's cart is on one screen with how many pennies she will have left,
  // and her order stays hers to change until she pays: the sum and the pay screen both lead back to it.
  const lines = [];
  for (const g of offer) {
    const size = packFor(), cost = packCost(g, size);
    if (10 - (S.stock[g] || 0) < size) { await talk('bramble', `Your shelf is full of ${GOODS[g].many}!`); continue; }
    lines.push({ g, size, cost, n: 0, asked: 0 });
  }
  const spentBut = l => lines.reduce((s, o) => s + (o === l ? 0 : o.n * o.cost), 0);
  const mostFor = l => Math.min(Math.floor((10 - (S.stock[l.g] || 0)) / l.size), Math.floor((S.till - spentBut(l)) / l.cost), S.day < SUMS_DAY ? 2 : 5);
  let cart = [], again = false;
  for (;;) {
    if (lines.length) await shopCart(lines, mostFor, again);
    again = true;
    S.lastBuy = S.lastBuy || {};
    for (const l of lines) S.lastBuy[l.g] = { size: l.size, n: l.n };
    cart = lines.filter(l => l.n).map(l => ({ g: l.g, qty: l.n * l.size, cost: l.n * l.cost, n: l.n, size: l.size }));
    if (!cart.length) { await talk('bramble', 'Nothing today? That\'s all right. See you tomorrow!', 'Open the shop!'); break; }
    for (const { g, size, n } of cart) {
      const l = lines.find(o => o.g === g);
      if (n < 2 || n === l.asked) continue;
      l.asked = n;
      if (S.day < SUMS_DAY) {
        await talk('bramble', `${n} ${PACKS[size]} with ${size} in each. That's ${n * size} ${GOODS[g].many}!`, 'Next',
          `<div class="row">${Array.from({ length: n }, () => `<span class="grp">${dots(size)}</span>`).join('')}</div>`);
      } else {
        await ask({
          k: 'M', who: 'bramble', q: `${n} ${PACKS[size]} with ${size} in each. How many ${GOODS[g].many} is that?`, answer: n * size, strat: 'skip', peek: n * size <= 30 ? 3000 : 0,
          show: () => Array.from({ length: n }, (_, i) => `<span class="grp"><span class="lab">${PACK[size]} ${i + 1}</span>${dots(size)}</span>`).join(''),
          help: () => `<div class="row">${Array.from({ length: n }, (_, i) => `<span class="grp"><span class="lab">${(i + 1) * size}</span>${dots(size)}</span>`).join('')}</div><div class="small">Count by ${size}s: ${Array.from({ length: n }, (_, i) => (i + 1) * size).join(', ')}</div>`,
          helpSay: `Count by ${size}s: ${Array.from({ length: n }, (_, i) => (i + 1) * size).join(', ')}.`,
        });
      }
    }
    const total = cart.reduce((s, c) => s + c.cost, 0);
    if (cart.length > 1 && S.day < SUMS_DAY) {
      await talk('bramble', `${cart.map((c, i) => `${i ? 'the' : 'The'} ${GOODS[c.g].many} are ${c.cost}`).join(' and ')}. That's ${total} ${plural(total, 'penny', 'pennies')} altogether.`, 'Next',
        `<div class="row">${cart.map(c => `<span class="grp">${goodImg(c.g, 'sm')}${dots(c.cost)}</span>`).join('')}</div>`);
    } else if (cart.length > 1) {
      const sum = Mental.sumHelp(cart.map(c => c.cost), S.lv.A);
      const r = await ask({
        k: 'A', who: 'bramble', helpWho: 'keeper', strat: sum.kind, q: `${cart.map(c => `The ${GOODS[c.g].many} are ${c.cost} ${plural(c.cost, 'penny', 'pennies')}`).join('. ')}. How much is that altogether?`, answer: total,
        show: () => cart.map(c => `<span class="grp">${goodImg(c.g, 'sm')}<span class="lab">${c.cost}¢</span></span>`).join('<b style="font-size:30px">+</b>'),

function makeCustomers() {
  if (S.day === 1) return [{ who: 'hazel', flow: 'count', order: [['bun', 1]] }, { who: 'mo', flow: 'count', order: [['bun', 1]] }];
  // From day 3 most customers pay with a bigger coin, so she gives change.
  // From day 7 one more friend, but only while she is doing well (a long day is no fun when the sums are hard)
  const howMany = S.day === 2 ? 2 : S.day === 3 ? 3 : 4 + (ramp() >= 1 && goingWell() ? 1 : 0);
  const regs = shuffle(REGULARS).slice(0, howMany).map((who, i) => ({ who, flow: i === 0 || S.day < CHANGE_DAY ? 'count' : 'change' }));
  const sp = SPECIAL_BY_DAY[S.day] || (S.day > 11 ? pick(['captain', 'miu', 'athena']) : null);
  if (sp) regs.splice(1, 0, { who: sp, flow: 'change', special: sp });
  const notHere = Object.keys(GOODS).filter(g => !unlocked(S.day).includes(g));
  if (S.day >= PRICES_DAY && notHere.length && Math.random() < .6) regs[regs.length - 1].missing = notHere[0];
  regs.forEach(c => { if (!c.special) c.order = makeOrder(S.day < SUMS_DAY ? 1 : ramp() >= 1 && S.lv.A >= 2 ? 3 : 2, true); });
  return regs;
}
const inStock = () => Object.keys(S.stock).filter(g => S.stock[g] > 0);
// An order whose total fits her adding level.
const orderBand = () => {
  if (S.day < SUMS_DAY) return [1, 4];
  const [lo, hi] = [[2, 5], [3, 10], [8, 20], [15, 30]][S.lv.A - 1];
  return [Math.round(lo + (hi - lo) * ramp() * .15), hi]; // later days lean toward the top of her level
};
// wish: what an animal would like at the usual prices, whatever is on the shelf (her stock decides what she can sell).
function makeOrder(maxGoods = 2, wish = false) {
  const band = orderBand(), cap = S.day < SUMS_DAY ? 2 : S.lv.N >= 2 ? 6 : 5;
  const goods = wish ? unlocked(S.day) : inStock(); if (!goods.length) return null;
  const most = g => wish ? cap : Math.min(S.stock[g], cap);
  let best = null, bestD = 1e9;
  for (let t = 0; t < 60; t++) {
    const gs = shuffle(goods).slice(0, 1 + rnd(Math.min(maxGoods, goods.length)));
    const order = gs.map(g => [g, 1 + rnd(most(g))]);
    const total = order.reduce((s, [g, n]) => s + n * GOODS[g].price, 0), qty = order.reduce((s, o) => s + o[1], 0);
    const d = total < band[0] ? band[0] - total : total > band[1] ? total - band[1] : 0;
    if (qty > cap) continue;
    if (d < bestD) { best = order; bestD = d; }
    if (!d) break;
  }
  return best;
}
const orderTotal = order => order.reduce((s, [g, n]) => s + n * priceOf(g), 0);
const orderWords = order => order.map(([g, n]) => `${n} ${plural(n, GOODS[g].one, GOODS[g].many)}`).join(' and ');

      await talk('keeper', rest.length ? `The shelves are empty! Everything is sold! But ${rest.length} more ${plural(rest.length, 'friend was', 'friends were')} still coming to shop. I'll write it in my notebook.` : 'The shelves are empty! Everything is sold!', 'Close the shop');

async function serve(c) {

    });

    } else {

// An animal's wish list meets her price tags, then her shelf.
async function shopFor(c) {
  const who = c.who, budget = orderBand()[1] + 2;
  let order = [], dear = [], cheap = [], short = [];
  for (const [g, n] of c.order) {
    const at = wantAt(g, n);
    if (at < n) { dear.push(g); S.dear[g] = (S.dear[g] || 0) + (n - at); }
    if (at > n) cheap.push(g);
    if (at > 0) order.push([g, at]);
  }
  // nobody spends more than they have in their purse
  while (order.length && orderTotal(order) > budget) { const o = order.reduce((a, b) => (b[1] * priceOf(b[0]) > a[1] * priceOf(a[0]) ? b : a)); o[1]--; if (!o[1]) order.splice(order.indexOf(o), 1); }
  // then what is actually on the shelf
  order = order.map(([g, n]) => { const have = Math.min(n, S.stock[g] || 0); if (have < n) { short.push(g); S.missed[g] = (S.missed[g] || 0) + (n - have); } return [g, have]; }).filter(o => o[1] > 0);
  save();
  const many = gs => gs.map(g => GOODS[g].many).join(' and ');
  // no price talk about goods the shelf has none of
  const onShelf = g => (S.stock[g] || 0) > 0;
  dear = dear.filter(onShelf); cheap = cheap.filter(onShelf);
  if (dear.length) { mood('cust', 'think', 1800); await talk(who, order.length || short.length ? `Ooh, ${many(dear)} are expensive today! I'll buy fewer.` : `Ooh, ${many(dear)} cost too much for me today. Maybe another day!`, order.length || short.length ? 'Okay' : 'Bye!'); }
  else if (cheap.length) { mood('cust', 'happy', 1800); await talk(who, `${many(cheap)[0].toUpperCase() + many(cheap).slice(1)} are cheap today! I'll take extra!`, 'Hooray!'); }
  if (short.length) await talk(who, order.length ? `Oh, you haven't got enough ${many(short)}. I'll take what you have.` : `Oh no, no ${many(short)} left! I'll come back another day.`, order.length ? 'Okay' : 'Bye!');
  return order.length ? order : null;
}
function coinsTaskWithHelp({ who, change, paid, total, source }) {
  return coinsTask({ who, amount: change, source, title: 'The till drawer', k: 'S', mode: 'change', countUp: { from: total, to: paid },
    prompt: `It costs ${total}. I gave you ${paid}. How much change do I get? Put the coins in my paw.`,

async function athenaRiddle(who) {

async function evening() {

  mood('keeper', 'idle');
  // what is left on the shelf
  const fresh = Object.keys(S.had).filter(g => GOODS[g] && GOODS[g].fresh && S.had[g] > 0);
  const g = fresh.find(x => (S.sold[x] || 0) > 0 && S.stock[x] > 0);
  if (g && S.day >= SUMS_DAY) {
    const had = S.had[g], sold = S.sold[g], left = Mental.subHelp(had, sold, S.lv.S);
    await ask({
      k: 'S', who: 'keeper', q: `This morning I had ${had} ${GOODS[g].many}. I sold ${sold}. How many are left?`, answer: S.stock[g],
      show: () => `<span class="grp">${goodImg(g, 'sm')}${dots(had)}</span>`,
      help: () => left.html, helpSay: left.say, strat: left.kind,
    });
  }
  S.soldOut = {}; for (const x of Object.keys(S.had)) if (S.had[x] > 0 && !(S.stock[x] > 0)) S.soldOut[x] = 1;
  const gone = fresh.filter(x => S.stock[x] > 0);
  if (gone.length) {
    const words = gone.map(x => `${S.stock[x]} ${plural(S.stock[x], GOODS[x].one, GOODS[x].many)}`).join(' and ');
    await talk('keeper', `${words[0].toUpperCase() + words.slice(1)} left over. They're best fresh, so the duck family gets them for supper. Quack quack! Maybe I'll buy a little less tomorrow.`, 'Goodnight, ducks!');

    await talk('keeper', 'Every single one was sold! Maybe I\'ll buy more tomorrow.', 'Next');
  }

  const missedAll = Object.values(S.missed).reduce((a, b) => a + b, 0);
  if (missedAll) {
    const top = Object.keys(S.missed).sort((a, b) => S.missed[b] - S.missed[a])[0];
    await talk('keeper', `My notebook: friends wanted ${S.missed[top]} more ${plural(S.missed[top], GOODS[top].one, GOODS[top].many)} after mine ran out. That's ${S.missed[top] * priceOf(top)} ${plural(S.missed[top] * priceOf(top), 'penny', 'pennies')} I didn't get! Maybe I'll buy more tomorrow.`, 'Into my notebook 📒');
  }
  const tips = S.shop && S.shop.tips || 0;

  await profitTask();
  // count the till in tens
  const T = S.till;
  if (T >= 10 && S.day >= 2) await stackTask(T);
  else await talk('keeper', `There ${T === 1 ? 'is' : 'are'} ${T} ${plural(T, 'penny', 'pennies')} in the till.`);
  if (T < 10) {
    await talk('clover', `Aunt Clover's rainy-day tin adds ${10 - T} ${plural(10 - T, 'penny', 'pennies')}, so you have 10 for tomorrow. Love, Clover.`);
    S.till = 10; hud();
  }
  save();
  await decorShop();
  S.phase = 'night'; save();
}
// Money in, money out: what the shop really earned today.
async function profitTask() {
  const took = S.shop ? S.shop.earned : 0, spent = S.spent || 0, P = took - spent;
  S.profit = P;
  if (!took && !spent) return;
  if (!spent) await talk('keeper', `I took in ${took} ${plural(took, 'penny', 'pennies')} today, and I didn't buy anything from Bramble. So I earned ${took}!`);
  else if (P <= 0) {
    await talk('keeper', `I paid Bramble ${spent} ${plural(spent, 'penny', 'pennies')} and took in ${took}. ${P === 0 ? 'That\'s the same, so I earned nothing today.' : 'I took in less than I paid.'} Tomorrow I'll think about what to buy and my prices. Aunt Clover's tin will look after the till.`, 'I\'ll try again!');
  } else if (S.day < SUMS_DAY) {
    await talk('keeper', `I took in ${took} ${plural(took, 'penny', 'pennies')}. I paid Bramble ${spent}. So my shop earned ${P}!`, 'Hooray!');
  } else {
    const earn = Mental.subHelp(took, spent, S.lv.S);
    await ask({
      k: 'S', who: 'keeper', q: `I took in ${took} ${plural(took, 'penny', 'pennies')}. I paid Bramble ${spent} this morning. How much did my shop earn today?`, answer: P,
      show: () => `<span class="grp"><span class="lab">Took in ${took}</span>${dots(took)}</span>`,
      help: () => earn.html, helpSay: earn.say, strat: earn.kind,
    });
  }
  if (P > 0) {
    S.total += P;
    if (P > S.best) {
      if (S.best > 0) { SFX.cheer(); mood('keeper', 'happy', 2200); await talk('keeper', `${P} pennies! That's my best day ever! My old best was ${S.best}.`, 'Hooray! ⭐'); }
      S.best = P;
    }
    for (const [at, id, name, emoji, rarity] of EARN_CARDS) if (S.total >= at && !(S.earnCards || []).includes(id)) {
      (S.earnCards = S.earnCards || []).push(id);
      if (window.GFKCards) GFKCards.collect({ game: GAME, id, name, emoji, rarity });
      SFX.cheer(); await talk('keeper', `My shop has earned ${S.total} pennies so far! I won the ${name} card!`, 'Wow!');
    }
  }
  save();
}
const EARN_CARDS = [[20, 'earn-20', 'Busy Bee Shopkeeper', '🐝', 'common'], [50, 'earn-50', 'Golden Acorn Award', '🌰', 'rare'], [100, 'earn-100', 'Hundred Penny Purse', '👛', 'rare'], [200, 'earn-200', 'Shopkeeper of Bramble Wood', '🏆', 'sparkly']];
function stackTask(T) {
  return new Promise(res => {
    const auto = Math.max(0, Math.floor(T / 10) - 2); // beyond two stacks the coin roller helps
    let stacks = auto, loose = T - auto * 10, mat = 0;
    say('keeper', auto ? 'Let\'s count the till. Aunt Clover\'s coin roller made some stacks. Tap pennies to make another stack of ten!' : 'Let\'s count the till! Tap pennies to make a stack of ten.');
    const draw = () => setPanel(`
      <div class="row">${Array.from({ length: stacks }, () => `<span class="grp"><span class="stack">${Array.from({ length: 10 }, () => coinHTML(1)).join('')}</span><span class="lab">10</span></span>`).join('')}
        <span class="ten">${Array.from({ length: 10 }, (_, i) => i < mat ? coinHTML(1) : '<span></span>').join('')}</span></div>
      <div class="tray"><span class="lbl">The till</span>${Array.from({ length: loose }, (_, i) => coinHTML(1, 'button', `data-i="${i}"`)).join('')}</div>`, p => {
      $$('.tray .coin', p).forEach(b => b.addEventListener('click', async () => {
        if (loose <= 0 || mat >= 10 || (mat === 0 && loose < 10)) return;
        loose--; mat++; SFX.coin(mat); speak(String(mat)); draw();
        if (mat === 10) { await wait(500); stacks++; mat = 0; SFX.stack(); speak('A stack of ten!'); draw(); }
        if (loose < 10 && mat === 0) { await wait(700); rerender = null; finish(); }
      }));
    });
    rerender = draw; draw();
    if (loose < 10) setTimeout(() => { rerender = null; finish(); }, 50);
    async function finish() {
      await ask({
        k: 'P', who: 'keeper', q: `${stacks} ${plural(stacks, 'stack', 'stacks')} of ten and ${loose} more. How many pennies is that?`, answer: T,
        show: () => `${Array.from({ length: stacks }, () => `<span class="grp"><span class="stack">${Array.from({ length: 10 }, () => coinHTML(1)).join('')}</span><span class="lab">10</span></span>`).join('')}<span class="grp"><span class="row">${Array.from({ length: loose }, () => coinHTML(1)).join('')}</span></span>`,
        help: () => `<div class="small">${Array.from({ length: stacks }, (_, i) => (i + 1) * 10).join(', ')}${loose ? ', then ' + Array.from({ length: loose }, (_, i) => stacks * 10 + i + 1).join(', ') : ''}</div>`,
        helpSay: `Count the stacks by tens, then the pennies by ones.`,
      });
      res();
    }
  });
}
function decorShop() {

    const shopGrid = () => `<div class="decor">${DECOR.map(d => `<button data-d="${d.id}" class="${S.decor.includes(d.id) ? 'own' : spare() < d.cost ? 'cant' : ''}">${decorImg(d)}<span>${d.name}</span><span class="tag">${S.decor.includes(d.id) ? '✓ yours' : d.cost + '¢'}</span></button>`).join('')}</div>`;

        <div class="decor wgrid">${W.CLOTHES.filter(x => x.cost).map(x => clothesBtn(x, W.owns(S, x.id) ? 'own' : x.id === trying ? 'try' + (spare() < x.cost ? ' cant' : '') : spare() < x.cost ? 'cant' : '')).join('')}</div>`;
    };

      ${avail.length && wearables.length ? `<div class="tabs"><button data-tab="shop" class="${tab === 'shop' ? 'sel' : ''}">🏡 For my shop</button><button data-tab="me" class="${tab === 'me' ? 'sel' : ''}">👗 For me</button></div>` : ''}
      ${tab === 'shop' ? shopGrid() : meGrid()}
      <button class="btn alt" id="later">${spare() >= cheapest ? 'Save for later' : 'Keep saving'}</button>`, p => {
      $$('[data-tab]', p).forEach(b => b.addEventListener('click', () => { tab = S.shelfTab = b.dataset.tab; trying = null; SFX.tap(); speak(tab === 'me' ? 'Things to wear' : 'Things for my shop'); draw(); }));

        const d = DECOR.find(x => x.id === b.dataset.d);
        if (S.decor.includes(d.id)) { say('keeper', `My ${d.name.toLowerCase()}!`); return; }
        if (spare() < d.cost) { SFX.soft(); say('keeper', `The ${d.name.toLowerCase()} costs ${d.cost}. I have ${spare()} to spend. I need ${d.cost - spare()} more.`); return; }
        const had = S.till, left = had - d.cost;
        S.till = left; S.decor.push(d.id); save(); syncView(); hud(); SFX.cheer(); sparkle(b, 18);
        mood('keeper', 'happy', 2000);
        if (!d.out) { TSV.scene = 'inside'; TSV.cam = null; }
        say('keeper', `The ${d.name.toLowerCase()}! ${had} take away ${d.cost} leaves ${left}.`);
        if (window.GFKCards && S.decor.length === DECOR.length) GFKCards.collect({ game: GAME, id: 'all-decor', name: 'Prettiest Shop in the Wood', emoji: '🏡', rarity: 'rare' });
        done('Lovely!');

      $$('.decor button[data-c]', p).forEach(b => b.addEventListener('click', () => {

        if (W.owns(S, c.id)) { SFX.tap(); say('keeper', `My ${c.name.toLowerCase()}! I can wear it with the dress button.`); return; }
        trying = c.id; SFX.tap();
        say('keeper', spare() >= c.cost ? `The ${c.name.toLowerCase()} costs ${c.cost}. I have ${spare()} to spend.` : `The ${c.name.toLowerCase()} costs ${c.cost}. I have ${spare()} to spend. I need ${c.cost - spare()} more.`);
        draw();
      }));
      const bi = $('#buyit', p);
      if (bi) bi.addEventListener('click', () => {
        const c = W.byId(trying), had = S.till;
        if (spare() < c.cost) { SFX.soft(); say('keeper', `The ${c.name.toLowerCase()} costs ${c.cost}. I have ${spare()} to spend. I need ${c.cost - spare()} more.`); return; }
        W.buy(S, c.id, spare()); save(); syncView(); hud(); SFX.cheer(); sparkle(bi, 18); mood('keeper', 'happy', 2000);
        say('keeper', `The ${c.name.toLowerCase()}! ${had} take away ${c.cost} leaves ${S.till}.`);
        bestDressed();
        trying = null; rerender = null;
        setPanel(`<div class="wlook">${lookImg(keeperSpec())}</div><button class="btn" id="nx">Lovely!</button>`, q => $('#nx', q).addEventListener('click', () => { SFX.tap(); TSV.scene = 'outside'; res(); }));
      });
      $('#later', p).addEventListener('click', () => { SFX.tap(); rerender = null; res(); });
    });
    rerender = draw; draw();
  });
}

      <div class="places">${Object.entries(PLACES).map(([id, P]) => `<button data-p="${id}" class="${P.job && S_.done[id] ? 'own' : ''}"><span class="pp">${portrait(P.who)}</span><span>${P.name}</span><span class="tag">${P.home ? `${P.emoji} my home` : P.board ? `${P.emoji} challenges` : P.job ? (S_.done[id] ? '✓ helped' : `${P.emoji} job`) : `${P.emoji} shop`}</span></button>`).join('')}</div>
      <button class="btn alt" id="home">Back to my shop 🍄</button>`, p => {

let folkT = {};
async function visit(id) {
  const P = PLACES[id], who = P.who;
  if (P.home) return houseVisit();
  if (P.room) { SFX.door(); setScene('room', { room: P.room, time: 'day' }); }
  TSV.place = id; TSV.cust = CAST[who].spec; mood('cust', 'idle');
  await wait(has3d() ? (P.room ? 700 : 1300) : 150);
  if (P.room) { mood('cust', 'wave', 1600); await talk(who, P.come, 'Thank you!'); }
  if (P.board) await Challenges.run(); else if (P.job) await jobVisit(id); else await stallVisit(id);
  hush(); setPanel('');
  if (P.room) { await leaveRoom(id); return; }
  TSV.cust = null; await wait(has3d() ? 900 : 100); TSV.place = null;
}
// back out through the door: she is on the step outside, and the lane carries on
async function leaveRoom(id) {
  SFX.door(); TSV.cust = null; TSV.place = null; TSV.go = id; TSV.at = null;

}
// her own house: what she has bought for it, and her wardrobe
async function houseVisit() {

    DBG.cur = { type: 'house' };
    const draw = () => setPanel(`
      ${n ? `<div class="decor">${HOME.filter(it => S.home.includes(it.id)).map(it => `<button data-h="${it.id}" class="own">${itemImg('home', it)}<span>${it.name}</span></button>`).join('')}</div>` : ''}
      <div class="row"><button class="btn" id="dress">Change my clothes 👗</button><button class="btn alt" id="bye">Go outside</button></div>`, p => {
      $$('[data-h]', p).forEach(b => b.addEventListener('click', () => { SFX.tap(); say('keeper', `I love my ${HOME.find(x => x.id === b.dataset.h).name.toLowerCase()}!`); mood('keeper', 'happy', 1500); }));

async function jobVisit(id) {
  const P = PLACES[id], who = P.who, me = CAST[who];
  if (S.village.done[id]) { await talk(who, pick(['Thank you for your help today! Come back tomorrow.', 'Hello again! See you tomorrow for another job.']), 'Bye-bye!'); return; }
  await talk(who, P.ask, 'I\'ll help!');
  TIP = { ok: true };
  await P.job(who);
  const tip = !!(TIP && TIP.ok); TIP = null;
  const pay = 2 + (tip ? 1 : 0);
  S.till += pay; S.village.done[id] = 1; S.village.earned += pay; save(); syncView(); hud();
  SFX.coin(1); sparkle($('#tillChip'), 10); mood('cust', 'happy', 2200); SFX.cheer();
  const coins = `<div class="tray tipcoin"><span class="lbl">For helping</span>${Array.from({ length: pay }, () => coinHTML(1)).join('')}</div>`;
  const text = tip ? 'Thank you! Here are 2 pennies for helping, and 1 more for getting it right the first time!' : 'Thank you! Here are 2 pennies for helping.';
  if (!S.friends[who]) {
    S.friends[who] = S.day; save();
    if (window.GFKCards) GFKCards.collect({ game: GAME, id: 'friend-' + who, name: me.name, emoji: me.emoji, rarity: me.special ? 'rare' : 'common' });
    await talk(who, text + ' Let\'s be friends!', 'Thank you!', coins);
    await giftFrom(who);
  } else await talk(who, text, 'Thank you!', coins);
}

/* ----- the jobs: a little story and two questions at her level ----- */
// running totals under each group, for the help
const groupsHelp = (n, size, cls, lab) => `<div class="row">${Array.from({ length: n }, (_, i) => `<span class="grp"><span class="lab">${(i + 1) * size}</span>${dots(size, 0, cls)}</span>`).join('')}</div><div class="small">Count by ${size}s: ${Array.from({ length: n }, (_, i) => (i + 1) * size).join(', ')}</div>`;
async function carrotJob(who) {
  const M = S.lv.M;
  for (let q = 0; q < 2; q++) {
    const [rows, per] = M <= 1 ? [2, 1 + rnd(4)] : M === 2 ? [2 + rnd(4), 2] : M === 3 ? [2 + rnd(3), 5] : pick([[2 + rnd(4), 5], [2 + rnd(3), 10]]);
    await ask({
      k: 'M', who, q: q ? `And the next patch has ${rows} rows with ${per} in each. How many carrots?` : `I planted ${rows} rows of carrots, with ${per} in each row. How many carrots is that?`, answer: rows * per,
      show: () => Array.from({ length: rows }, (_, i) => `<span class="grp"><span class="lab">row ${i + 1}</span>${dots(per, 0, 'or')}</span>`).join(''),
      help: () => groupsHelp(rows, per, 'or'),
      helpWho: rows === 2 ? 'keeper' : undefined, helpSay: rows === 2 ? `${per} and ${per}. That's a double!` : `Count by ${per}s, one row at a time.`,
      strat: rows === 2 ? 'double' : 'skip', peek: rows * per <= 20 ? 3000 : 0,
    });
  }
}
async function bookJob(who) {
  const P = S.lv.P;
  for (let q = 0; q < 2; q++) {
    const tens = P <= 1 ? 1 : 2 + rnd(4), ones = P <= 1 ? 1 + rnd(9) : rnd(10), n = tens * 10 + ones;
    const pile = () => `${Array.from({ length: tens }, () => `<span class="grp"><span class="books">${Array.from({ length: 10 }, (_, i) => `<i class="b${i % 5}"></i>`).join('')}</span><span class="lab">10</span></span>`).join('')}${ones ? `<span class="grp"><span class="books loose">${Array.from({ length: ones }, (_, i) => `<i class="b${i % 5}"></i>`).join('')}</span><span class="lab">&nbsp;</span></span>` : ''}`;
    await ask({
      k: 'P', who, q: `${q ? 'And on this shelf: ' : ''}${tens} ${plural(tens, 'stack', 'stacks')} of ten books${ones ? ` and ${ones} more` : ''}. How many books is that?`, answer: n,
      show: pile,
      help: () => `<div class="small">${Array.from({ length: tens }, (_, i) => (i + 1) * 10).join(', ')}${ones ? ', then ' + Array.from({ length: ones }, (_, i) => tens * 10 + i + 1).join(', ') : ''}</div>`,
      helpSay: 'Count the stacks by tens, then the books by ones.',
    });
  }
}
async function lanternJob(who) {
  const S_ = S.lv.S;
  for (let q = 0; q < 2; q++) {
    const T = S_ <= 1 ? 5 : S_ === 2 ? 10 : S_ === 3 ? pick([10, 20]) : 20;
    const L = T === 5 ? 1 + rnd(4) : T === 10 ? 2 + rnd(8) : S_ === 3 ? 11 + rnd(9) : 3 + rnd(15);
    const sub = Mental.subHelp(T, L, S_);
    const lan = (help) => `<span class="lan">${Array.from({ length: T }, (_, i) => i < L ? '<i class="on"></i>' : `<i>${help ? i - L + 1 : ''}</i>`).join('')}</span>`;
    await ask({
      k: 'S', who, q: q ? `Now the little ring by the stream. It has ${T} lanterns, and ${L} ${L === 1 ? "is" : "are"} glowing. How many more do I need to light?` : `There are ${T} lanterns around the ring. ${L} ${L === 1 ? "is" : "are"} glowing. How many more do I need to light?`, answer: T - L,
      show: () => lan(false), help: () => `${lan(false)}${sub.html}`,
      helpWho: 'keeper', helpSay: sub.say, strat: sub.kind,
    });
  }
  TSV.ringLit = true;
}
async function chestJob(who) {
  const F = S.lv.F;
  for (let q = 0; q < 2; q++) {
    const n = F <= 1 ? 3 + rnd(7) : F === 2 ? 6 + rnd(10) : F === 3 ? 12 + rnd(24) : 15 + rnd(31), coins = coinsFor(n);
    await ask({
      k: 'F', who, q: q ? 'Arr, there was more in the boat! How many pennies is this pile?' : 'Here is my treasure. How many pennies is it worth?', answer: n,
      show: () => `<div class="tray chest">${coins.map(v => coinHTML(v)).join('')}</div>`,
      help: () => { let run = 0; return `<div class="row">${coins.map(v => { run += v; return `<span class="grp">${coinHTML(v)}<span class="lab">${run}</span></span>`; }).join('')}</div>`; },
      helpSay: coins[0] === 10 ? 'Count the dimes by tens, then the rest.' : 'Touch each coin and count.',
    });
  }
}

/* ----- the stalls ----- */
async function stallVisit(id) {
  const P = PLACES[id], who = P.who, kind = P.shop, list = ITEMS[kind];
  await talk(who, P.hi, 'Hello!');
  for (;;) {
    const it = await stallPick(who, kind, list);
    if (!it) { await talk(who, pick(['Come back soon!', 'Bye for now!']), 'Bye-bye!'); return; }
    await buy(who, kind, it);
  }
}
function stallPick(who, kind, list) {
  return new Promise(res => {
    const left = list.filter(it => !S[kind].includes(it.id));
    if (!left.length) say(who, kind === 'garden' ? 'You have everything from my stall! Your garden must be beautiful.' : kind === 'home' ? 'You have everything from my stall! Your house must be so cozy.' : 'You have every treasure I brought! What a collection!');
    else say('keeper', `I keep 10 pennies for Bramble's cart. I have ${spare()} ${plural(spare(), 'penny', 'pennies')} to spend.`);
    DBG.cur = { type: 'stall', kind };
    const draw = () => setPanel(`
      <div class="decor">${list.map(it => `<button data-i="${it.id}" class="${S[kind].includes(it.id) ? 'own' : spare() < it.cost ? 'cant' : ''}">${itemImg(kind, it)}<span>${it.name}</span><span class="tag">${S[kind].includes(it.id) ? '✓ yours' : it.cost + '¢'}</span></button>`).join('')}</div>
      <button class="btn alt" id="bye">Bye for now</button>`, p => {
      $$('[data-i]', p).forEach(b => b.addEventListener('click', () => {
        const it = list.find(x => x.id === b.dataset.i);
        if (S[kind].includes(it.id)) { say('keeper', `My ${it.name.toLowerCase()} is already ${kind === 'garden' ? 'in my garden' : kind === 'home' ? 'in my house' : 'in my shop'}!`); return; }
        if (spare() < it.cost) { SFX.soft(); say('keeper', `The ${it.name.toLowerCase()} costs ${it.cost}. I have ${spare()} to spend. I need ${it.cost - spare()} more.`); return; }
        SFX.tap(); rerender = null; res(it);
      }));
      $('#bye', p).addEventListener('click', () => { SFX.tap(); rerender = null; res(null); });
    });
    rerender = draw; draw();
  });
}
async function buy(who, kind, it) {
  if (kind === 'treasures') await talk(who, `The ${it.name.toLowerCase()}! ${it.from}`, 'I\'d like it!', `<div class="decor one"><button>${itemImg(kind, it)}<span>${it.name}</span><span class="tag">${it.cost}¢</span></button></div>`);
  const given = await coinsTask({ who, amount: it.cost, source: coinsFor(spare()), title: 'My money to spend', prompt: `That's ${it.cost} ${plural(it.cost, 'penny', 'pennies')}, please.`, mode: S.day >= SUMS_DAY ? 'pay' : 'exact', back: 'Not today' });
  if (given === null) return;
  if (given > it.cost) await talk(who, `You gave me ${given}. Here ${given - it.cost === 1 ? 'is 1 penny' : 'are ' + (given - it.cost)} back!`);
  const had = S.till, left = had - it.cost;
  S.till = left; S[kind].push(it.id); save(); syncView(); hud(); SFX.cheer(); mood('keeper', 'happy', 2000); mood('cust', 'happy', 1800);
  if (window.GFKCards && kind === 'treasures') GFKCards.collect({ game: GAME, id: 'treasure-' + it.id, name: it.name, emoji: it.emoji, rarity: it.cost >= 13 ? 'sparkly' : it.cost >= 7 ? 'rare' : 'common' });
  if (window.GFKCards && S[kind].length === ITEMS[kind].length) GFKCards.collect({ game: GAME, id: 'all-' + kind, name: kind === 'garden' ? 'Greenest Garden in the Wood' : kind === 'home' ? 'Coziest House in the Wood' : 'Treasure Hunter', emoji: kind === 'garden' ? '🌻' : kind === 'home' ? '🏡' : '🗝️', rarity: 'rare' });
  await talk('keeper', `${kind === 'garden' ? `My ${it.name.toLowerCase()} will go in the garden by my shop!` : kind === 'home' ? `My ${it.name.toLowerCase()} will go in my house!` : `I'll put the ${it.name.toLowerCase()} on the ledge in my shop!`} ${had} take away ${it.cost} leaves ${left}.`, 'Lovely!',
    `<div class="decor one"><button class="own">${itemImg(kind, it)}<span>${it.name}</span><span class="tag">✓ yours</span></button></div>`);
}
/* ================= the wardrobe: clothes and accessories (wardrobe.js holds the list) ================= */
// What she would look like in one more thing (to try it on before buying, or to see it in the closet).
function tryOnSpec(id) {
  const W = ShopWardrobe, c = W.byId(id); if (!S.keeper || !c) return keeperSpec();
  const k = Object.assign({}, S.keeper, { wear: Object.assign({}, W.wear(S), { [c.slot]: id }) });
  return W.keeperSpec({ keeper: k, closet: (S.closet || []).concat(id) }, FURS, DRESSES);
}
function lookImg(spec) { return has3d() && spec ? `<img src="${Shop3D.portrait(spec)}" alt="">` : '🐭'; }
function clothesBtn(c, state) {
  const tag = state === 'on' ? '✓ wearing' : state === 'own' ? 'mine' : c.gift ? '🎁 a present' : c.cost + '¢';
  return `<button data-c="${c.id}" class="${state}"><span class="em" style="${c.css || ''}">${c.emoji}</span><span>${c.name}</span><span class="tag">${tag}</span></button>`;
}
// The 👗 button: change clothes any time. Only what she owns can go on; the rest shows where it comes from.
// It sits over the game and never touches the panel or the speech bubble, so it is safe in the middle of anything.
function openWardrobe() {
  const W = ShopWardrobe, box = $('#wardrobe'); if (!S.keeper) return;
  let note = 'Tap something to put it on!', look = keeperSpec();
  const draw = () => {
    const w = W.wear(S);
    const keep = $('.wlist', box) ? $('.wlist', box).scrollTop : 0;
    $('.card', box).innerHTML = `<div class="wside"><div class="wlook big">${lookImg(look)}</div>
      <div class="wnote">${note}</div><button class="btn" id="wdone">All dressed! ✨</button></div>
      <div class="wlist"><div class="wsec"><div class="wlab">Dress colour</div><div class="swatches">${Object.entries(DRESSES).map(([n, col]) => `<button class="swatch ${S.keeper.dress === n ? 'sel' : ''}" data-d="${n}" style="background:${col}" aria-label="${n} dress"></button>`).join('')}</div></div>
      ${W.SLOTS.map(([slot, label]) => `<div class="wsec"><div class="wlab">${label}</div><div class="decor wgrid">${W.CLOTHES.filter(c => c.slot === slot).map(c => clothesBtn(c, w[slot] === c.id ? 'on' : W.owns(S, c.id) ? 'own' : 'cant')).join('')}</div></div>`).join('')}
      </div>`;
    $('.wlist', box).scrollTop = keep;
    $$('[data-d]', box).forEach(b => b.addEventListener('click', () => {
      S.keeper.dress = b.dataset.d; save(); syncView(); look = keeperSpec(); SFX.tap(); note = `A ${b.dataset.d} dress!`; speak(note); draw();
    }));
    $$('[data-c]', box).forEach(b => b.addEventListener('click', () => {
      const c = W.byId(b.dataset.c);
      if (!W.owns(S, c.id)) {
        SFX.soft(); look = tryOnSpec(c.id);
        note = c.gift ? `The ${c.name.toLowerCase()} is a present. Maybe a friend will bring it one day!` : `I can buy the ${c.name.toLowerCase()} in the evening. It costs ${c.cost} ${plural(c.cost, 'penny', 'pennies')}.`;
        speak(note); draw(); return;
      }
      const r = W.put(S, c.id); save(); syncView(); look = keeperSpec(); SFX.tap(); mood('keeper', 'happy', 1200);
      note = r === 'off' ? `I took off my ${c.name.toLowerCase()}.` : `My ${c.name.toLowerCase()}!`; speak(note); draw();
    }));
    $('#wdone', box).addEventListener('click', closeWardrobe);
  };
  box.hidden = false; draw(); SFX.tap();
}
function closeWardrobe() {
  $('#wardrobe').hidden = true; SFX.ok(); syncView(); if (rerender) rerender();
  if (lastSay && lastSay.who === 'keeper') $('#bubble .pt').innerHTML = portrait('keeper');
}
// Every piece of clothing (bought and presents) earns a card, whichever comes last.
function bestDressed() { if (window.GFKCards && ShopWardrobe.allOwned(S)) GFKCards.collect({ game: GAME, id: 'all-clothes', name: 'Best Dressed in Bramble Wood', emoji: '👗', rarity: 'rare' }); }
// A visiting friend's present: it goes in the wardrobe and on at once.
async function giftFrom(who) {
  const W = ShopWardrobe, c = W.giftFrom(who); if (!c || !S.keeper || !W.give(S, c.id)) return;
  W.put(S, c.id); save(); syncView(); SFX.cheer(); mood('keeper', 'happy', 2200); bestDressed();
  await talk('keeper', `${CAST[who].name} gave me ${c.they ? 'some' : 'a'} ${c.name.toLowerCase()}! I'm wearing ${c.they ? 'them' : 'it'} now. I can change my clothes any time with the dress button.`, 'Thank you! 👗', `<div class="wlook small">${lookImg(keeperSpec())}</div>`);
}
// Older saves: friends who already visited have left their presents in the wardrobe.
if (S.keeper) { S.closet = S.closet || []; for (const who of Object.keys(S.friends || {})) { const c = ShopWardrobe.giftFrom(who); if (c) ShopWardrobe.give(S, c.id); } save(); bestDressed(); }
$('#wardBtn').addEventListener('click', openWardrobe);

/* ================= title ================= */

  TSV.keeper = keeperSpec();

  await next(S.keeper ? `Play (Day ${S.day})` : 'Play', `<div class="title">The Toadstool Shop</div><div class="small">A little shop in Bramble Wood</div>`);

      <table><tr><th>Skill</th><th>Level now</th><th>Last 10</th></tr>${rows}</table>
      <p>Earned so far ${S.total}¢ · Best day ${S.best}¢ · Prices: ${Object.keys(S.prices).map(g => `${GOODS[g].many} ${S.prices[g]}¢ (usual ${GOODS[g].price}¢)`).join(', ') || 'usual'}</p>
      <p>Money ${S.till}¢ · Decorations ${S.decor.length}/${DECOR.length} · Garden ${S.garden.length}/${GARDEN.length} · Treasures ${S.treasures.length}/${TREASURES.length} · Home things ${S.home.length}/${HOME.length} · Clothes ${ShopWardrobe.CLOTHES.filter(c => ShopWardrobe.owns(S, c.id)).length}/${ShopWardrobe.CLOTHES.length} · Friends ${Object.keys(S.friends).length}</p>
      <p>From day ${VILLAGE_DAY}, after the shop closes, she can walk to Bramble Wood village: four neighbours each have one little job a day (2 pennies, plus 1 when every answer is right the first time; two of them happen inside their houses), and three stalls sell garden things, treasures and things for her own house with the money above the 10 she keeps for Bramble. She has a house of her own at the end of the lane, where her wardrobe is too.</p>
      <p>Hoot's challenge board (in the village, next to his oak) has cards of 5 plain problems typed on a number pad: a penny for each right first time, a lightning penny more when it is quicker than her usual time, and 2 for finishing. A good card (4 of 5) moves up a level, 2 or fewer moves down. ${Challenges.summary()}</p>
      <p style="font-size:14px;opacity:.7">To start over, use "Grown-ups: start a game over" on The Wonder Shelf.</p>
      <button class="btn" id="gclose">Close</button>`;
    $('#gclose').addEventListener('click', () => { box.hidden = true; });
  }
})();
