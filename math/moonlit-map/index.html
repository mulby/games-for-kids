<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<script id="kid-voice" data-voice-base="../../voice/">
/* KidVoice: one friendly voice for every game.
   Source of truth is shared/voice.js; tools/sync-voice.py copies it into each game
   so every index.html stays self-contained.

   1. Recorded clips first: if voice/manifest.json (made by tools/make-voice-clips.mjs)
      has a clip for a sentence, it plays that. Lines with numbers in them, like
      "7 plus 5" or "This lantern needs 7 fireflies", are stitched from shorter clips.
   2. Otherwise the device's own speech, using the most natural voice it has
      (Premium / Enhanced iPad voices first, never the novelty or robot voices).
   A grown-up can pin a voice from The Wonder Shelf; it is saved in localStorage["gfk-voice"]. */
(function () {
  if (window.KidVoice) return;
  const synth = window.speechSynthesis || null;
  const NOVELTY = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Kathy)\b/i;
  const ROBOTIC = /\b(Eddy|Flo|Reed|Rocko|Sandy|Shelley|Grandma|Grandpa)\b/i; // iOS "Eloquence" voices
  const FAVORITES = ['Ava', 'Zoe', 'Samantha', 'Allison', 'Susan', 'Nicky', 'Serena', 'Karen', 'Moira', 'Kate', 'Tessa', 'Evan', 'Nathan', 'Tom', 'Daniel'];

  function score(v) {
    const id = (v.name || '') + ' ' + (v.voiceURI || '');
    let s = 0;
    if (NOVELTY.test(v.name)) s -= 100;
    if (ROBOTIC.test(v.name)) s -= 60;
    if (/premium/i.test(id)) s += 60;
    else if (/enhanced/i.test(id)) s += 40;
    if (/siri/i.test(id)) s += 35;
    if (/Online \(Natural\)/i.test(id)) s += 45; // Edge
    if (/^Google/i.test(v.name)) s += 20;      // Chrome
    const fav = FAVORITES.findIndex(n => new RegExp('\\b' + n + '\\b', 'i').test(v.name));
    if (fav >= 0) s += 15 - fav * 0.5;
    if (/en[-_]US/i.test(v.lang)) s += 5; else if (/en[-_]GB/i.test(v.lang)) s += 4; else if (/en[-_](AU|IE|NZ|CA)/i.test(v.lang)) s += 3;
    if (v.default) s += 1;
    return s;
  }
  function voices() {
    try { return (synth && synth.getVoices() || []).filter(v => /^en/i.test(v.lang)); } catch (e) { return []; }
  }
  function ranked() { return voices().map(v => ({ v, s: score(v) })).sort((a, b) => b.s - a.s).map(x => x.v); }
  let chosen = null;
  function pick() {
    let pinned = null;
    try { pinned = localStorage.getItem('gfk-voice'); } catch (e) {}
    const list = ranked();
    chosen = (pinned && list.find(v => v.voiceURI === pinned || v.name === pinned)) || list[0] || null;
    return chosen;
  }
  if (synth) { pick(); try { synth.addEventListener('voiceschanged', pick); } catch (e) {} }

  /* ---- recorded clips ---- */
  let clips = null; // { base, lines: {key: file} }
  const base = (document.currentScript && document.currentScript.dataset.voiceBase) || '../../voice/';
  try {
    if (location.protocol !== 'file:') fetch(base + 'manifest.json').then(r => r.ok ? r.json() : null)
      .then(m => { if (m && m.lines) clips = { base, lines: m.lines }; }).catch(() => {});
  } catch (e) {}
  const key = t => String(t).toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  function clipPlan(text) {
    if (!clips) return null;
    const plan = [];
    for (const sentence of String(text).match(/[^.!?]+[.!?]*/g) || []) {
      const k = key(sentence); if (!k) continue;
      if (clips.lines[k]) { plan.push(clips.lines[k]); continue; }
      // Stitch lines built from a template, like "this lantern needs" + "7" + "fireflies".
      const parts = k.split(/\b(\d+)\b/).map(x => x.trim()).filter(Boolean);
      if (parts.length > 1 && parts.every(x => clips.lines[x])) { parts.forEach(x => plan.push(clips.lines[x])); continue; }
      return null; // one sentence without a recording: use speech for the whole line so it sounds even
    }
    return plan.length ? plan : null;
  }
  const audio = typeof Audio !== 'undefined' ? new Audio() : null;
  let queue = [];
  function playNext() {
    if (!audio || !queue.length) return;
    audio.src = clips.base + queue.shift();
    audio.play().catch(() => { queue = []; });
  }
  if (audio) audio.addEventListener('ended', playNext);
  function stopClips() { queue = []; if (audio) try { audio.pause(); } catch (e) {} }
  // Games call speechSynthesis.cancel() when they change screens; make that stop clips too.
  if (synth) try { const cancel = synth.cancel.bind(synth); synth.cancel = function () { stopClips(); cancel(); }; } catch (e) {}
  // iPad Safari only plays audio after a tap: unlock the player on the first touch.
  if (audio) document.addEventListener('pointerdown', function unlock() {
    document.removeEventListener('pointerdown', unlock, true);
    if (!audio.src) { audio.src = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA=='; audio.play().catch(() => {}); }
  }, true);

  function speak(text, opts) {
    opts = opts || {};
    if (!text) return;
    const plan = clipPlan(text);
    if (plan) {
      if (!opts.queue) { try { synth && synth.cancel(); } catch (e) { stopClips(); } }
      const idle = !queue.length && (!audio || audio.paused || audio.ended);
      queue.push(...plan);
      if (idle) playNext();
      return;
    }
    if (!synth) return;
    try {
      if (!opts.queue) synth.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      const v = chosen || pick();
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      // A natural pitch: raised pitch is what made the old voice sound strained and creepy.
      u.rate = Math.min(1.05, Math.max(0.75, opts.rate || 0.92));
      u.pitch = Math.min(1.05, Math.max(0.95, opts.pitch || 1));
      synth.speak(u);
    } catch (e) {}
  }

  window.KidVoice = { speak, stop: () => { try { synth ? synth.cancel() : stopClips(); } catch (e) {} }, pick, ranked, score, current: () => chosen, key };
})();
</script>
</head>
<body>
<title>The Moonlit Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@500;700;800&display=swap">
<style>
/* Layout: one storybook screen at a time over a twilight sky; parchment cards hold the story, big buttons for small fingers. Single deliberate night-time look. */
:root{
  --sky-deep:#191e47; --sky:#2b3576; --parch:#fbf3df; --parch-2:#f1e4c3;
  --ink:#2b2540; --ink-soft:#6a6080; --gold:#f3c34a; --gold-deep:#c8901a;
  --berry:#d9577a; --leaf:#3f9a73; --mist:#c9cdea; --sea:#4b7bd1;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--sky-deep);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,transparent 51%),
    radial-gradient(1px 1px at 33% 8%,#fff8 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 58% 14%,#fffa 50%,transparent 51%),
    radial-gradient(1px 1px at 81% 26%,#fff7 50%,transparent 51%),
    radial-gradient(2px 2px at 91% 9%,#ffe9a8 50%,transparent 51%),
    radial-gradient(1px 1px at 6% 52%,#fff6 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 95% 61%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 47% 44%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 83%,#fff6 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 72% 90%,#fff7 50%,transparent 51%),
    linear-gradient(180deg,var(--sky-deep),var(--sky) 70%,#3a3f86);
  min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.card{background:var(--parch);border-radius:22px;padding:22px;box-shadow:0 10px 0 #0003,0 0 0 3px var(--parch-2) inset}
.sky-title{color:var(--parch);text-align:center}
.sky-title h1{font-size:clamp(34px,8vw,54px);color:var(--gold);text-shadow:0 3px 0 #0004}
.sky-title p{margin:4px 0 0;color:var(--mist)}
.moon{width:88px;height:88px;border-radius:50%;margin:0 auto 6px;background:radial-gradient(circle at 35% 35%,#fff8dc,#f3d77a 60%,#d8b24c);box-shadow:0 0 40px #f3c34a66}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
.btn{font-family:var(--display);font-weight:700;font-size:22px;border:0;border-radius:18px;padding:14px 26px;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;border:2px dashed var(--ink-soft);font-size:17px;padding:10px 18px}
.btn.sky{background:transparent;color:var(--mist);border:2px solid #ffffff33;box-shadow:none;font-size:16px;padding:8px 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{justify-content:center;text-align:center}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
input[type=text]{font:inherit;font-size:22px;padding:12px 14px;border-radius:14px;border:2px solid var(--parch-2);background:#fff;color:var(--ink);min-width:0}
.pals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pal{background:#fff;border:3px solid var(--parch-2);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:15px;color:var(--ink)}
.pal .e{font-size:42px;line-height:1.1}
.pal[aria-pressed=true]{border-color:var(--gold-deep);background:#fff6d6;box-shadow:0 0 0 3px var(--gold)}
.toggle{display:flex;gap:10px;align-items:center;font-weight:700}
.toggle input{width:26px;height:26px;accent-color:var(--leaf)}

/* Map */
.map{position:relative;width:100%;max-width:560px;margin:8px auto 0;aspect-ratio:3/4;max-height:72vh}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.land{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--parch);font-family:var(--display);font-weight:700;font-size:15px;width:130px;text-align:center}
.land .isle{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle at 40% 35%,#5d6bc0,#2d3780);border:3px solid #ffffff44;box-shadow:0 6px 0 #0005}
.land.done .isle{background:radial-gradient(circle at 40% 35%,#ffe9a8,var(--gold) 60%,var(--gold-deep));border-color:#fff}
.land.open .isle{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 #0005,0 0 26px 8px #f3c34a88}}
.land .nm{text-shadow:0 2px 0 #0007;line-height:1.1}
.land .gem{font-size:13px;color:var(--gold)}
.pal-say{display:flex;gap:12px;align-items:center}
.pal-say .av{font-size:54px;line-height:1;flex:none}
.bubble{background:var(--parch);color:var(--ink);border-radius:18px;padding:12px 16px;position:relative;font-size:19px;min-width:0}
.bubble:before{content:"";position:absolute;left:-9px;top:20px;border:10px solid transparent;border-right-color:var(--parch);border-left:0}

/* Question */
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--parch);gap:10px;flex-wrap:wrap}
.qhead h2{font-size:22px;color:var(--gold)}
.pebbles{display:flex;gap:6px}
.pebbles i{width:16px;height:16px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff44}
.pebbles i.lit{background:var(--gold);border-color:#fff;box-shadow:0 0 10px var(--gold)}
.prompt{font-size:clamp(21px,4.4vw,27px);font-weight:700;margin:0}
.visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin:14px 0 4px;min-height:10px}
.visual:empty{display:none}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choice{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);padding:18px 8px;border-radius:18px;border:3px solid var(--parch-2);background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--parch-2);font-variant-numeric:tabular-nums}
.choice.small{font-size:clamp(19px,4.4vw,24px)}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--parch-2)}
.choice.picked{background:#fff3c4;border-color:var(--gold-deep)}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.speak{background:var(--mist);border:0;border-radius:14px;padding:10px 14px;font-weight:700;color:var(--ink)}
.cheer{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--leaf);color:#fff;font-family:var(--display);font-weight:700;font-size:20px;padding:12px 22px;border-radius:999px;box-shadow:0 6px 0 #0004;z-index:5;max-width:calc(100% - 32px);text-align:center}

/* math pictures */
.objs{display:grid;grid-template-columns:repeat(5,auto);gap:4px 8px;font-size:30px;line-height:1}
.objs .gone{opacity:.25;filter:grayscale(1)}
.plus{font-family:var(--display);font-size:34px;font-weight:800;color:var(--ink-soft)}
.blocks{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;justify-content:center}
.flat{width:60px;height:60px;background:#7fb6ea;background-image:linear-gradient(#2d5f9a55 1px,transparent 1px),linear-gradient(90deg,#2d5f9a55 1px,transparent 1px);background-size:6px 6px;border:2px solid #2d5f9a;border-radius:3px}
.rod{width:10px;height:60px;background:#9ad3a8;background-image:linear-gradient(#2e7a4c66 1px,transparent 1px);background-size:10px 6px;border:2px solid #2e7a4c;border-radius:2px}
.cube{width:10px;height:10px;background:#f5b3c4;border:2px solid #b0465f;border-radius:2px}
.ones{display:grid;grid-template-columns:repeat(3,auto);gap:3px;align-content:end}
.gap{width:14px}
.coin{border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#3b3b3b;box-shadow:inset 0 -3px 0 #0002,0 2px 0 #0003}
.coin.q{width:66px;height:66px;background:radial-gradient(circle at 35% 30%,#fafafa,#bfc4cc);font-size:17px}
.coin.d{width:48px;height:48px;background:radial-gradient(circle at 35% 30%,#fafafa,#bfc4cc);font-size:14px}
.coin.n{width:56px;height:56px;background:radial-gradient(circle at 35% 30%,#f3f3f3,#a9aeb6);font-size:15px}
.coin.p{width:50px;height:50px;background:radial-gradient(circle at 35% 30%,#f6c39a,#b8693b);font-size:14px;color:#3a1e0c}
.basket{border:3px solid #a8743c;border-top-width:6px;background:#f6deb0;border-radius:6px 6px 22px 22px;padding:8px 8px 10px;display:flex;flex-wrap:wrap;gap:2px;max-width:96px;justify-content:center;font-size:24px;line-height:1}
.seq{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,34px);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-variant-numeric:tabular-nums}
.seq span{background:#fff;border:2px solid var(--parch-2);border-radius:12px;padding:4px 12px}
.seq .blank{border-style:dashed;border-color:var(--gold-deep);color:var(--gold-deep)}
.bigsum{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,42px);font-variant-numeric:tabular-nums}

/* story screens */
[hidden]{display:none!important}
.story{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.story .hero{font-size:84px;line-height:1}
.story p{margin:0;max-width:34em;font-size:20px}
.gemflash{font-size:90px;animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.cert{border:4px double var(--gold-deep)}

/* grown-ups */
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff22}
.report{font-size:16px}
.report h2{font-size:26px}
.report h3{font-size:19px;margin-top:4px}
.report .muted{color:var(--ink-soft)}
.strand{display:grid;gap:6px;padding:14px 0;border-top:2px solid var(--parch-2)}
.strand .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.meter{display:flex;gap:4px}
.meter i{width:30px;height:12px;border-radius:6px;background:var(--parch-2)}
.meter i.on{background:var(--leaf)}
.meter i.next{background:repeating-linear-gradient(45deg,var(--gold),var(--gold) 4px,#f8e3a3 4px,#f8e3a3 8px)}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--parch-2)}
.pill.ok{background:#cfe9db;color:#1d5a3f}.pill.mid{background:#fbe6b0;color:#7a5410}.pill.low{background:#f6d0da;color:#7d2440}
.report ul{margin:4px 0 0;padding-left:20px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--parch-2);vertical-align:top}
td.n{font-variant-numeric:tabular-nums}
.ok-t{color:var(--leaf);font-weight:700}.no-t{color:var(--berry);font-weight:700}
details summary{cursor:pointer;font-weight:700;margin-top:8px}
.note{font-size:14px;color:var(--ink-soft)}
@media (max-width:480px){
  .pals{grid-template-columns:repeat(2,1fr)}
  .land{width:104px;font-size:13px}
  .land .isle{width:60px;height:60px;font-size:30px}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app">

  <!-- START -->
  <section id="s-start">
    <div class="sky-title"><div class="moon"></div><h1>The Moonlit Map</h1><p>A map that only lights up when an explorer walks it.</p></div>
    <div class="card" style="margin-top:14px">
      <div id="resume" hidden class="story" style="margin-bottom:18px">
        <p id="resume-msg"></p>
        <div class="row center"><button class="btn" id="b-resume">Back to the map</button></div>
        <button class="btn ghost" id="b-fresh">Start a brand new adventure</button>
      </div>
      <div id="newgame" style="display:flex;flex-direction:column;gap:18px">
        <label class="field">What is your explorer name?
          <input type="text" id="in-name" maxlength="20" placeholder="Your name" autocomplete="off"></label>
        <div style="display:flex;flex-direction:column;gap:8px">
          <b>Pick a friend to travel with</b>
          <div class="pals" id="pals"></div>
        </div>
        <label class="field">What is your friend's name?
          <input type="text" id="in-pal" maxlength="20" autocomplete="off"></label>
        <label class="toggle"><input type="checkbox" id="in-read"> Read the questions out loud to me</label>
        <div class="row center"><button class="btn" id="b-begin">Begin the adventure</button></div>
      </div>
    </div>
  </section>

  <!-- MAP -->
  <section id="s-map" hidden>
    <div class="pal-say"><div class="av" id="map-av"></div><div class="bubble" id="map-say"></div></div>
    <div class="map" id="map"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn sky" id="b-home">Rest for now</button>
      <button class="btn sky hold" id="b-grown"><span class="fill"></span>Grown-ups (press and hold)</button>
    </div>
  </section>

  <!-- LAND INTRO -->
  <section id="s-intro" hidden>
    <div class="card story">
      <div class="hero" id="in-hero"></div>
      <h2 id="in-title" style="font-size:32px"></h2>
      <p id="in-text"></p>
      <p class="note" id="in-tip"></p>
      <div class="row center"><button class="btn" id="b-go">Let's go!</button></div>
      <button class="btn ghost" id="b-back">Back to the map</button>
    </div>
  </section>

  <!-- QUESTION -->
  <section id="s-q" hidden>
    <div class="qhead"><h2 id="q-land"></h2><div class="pebbles" id="q-peb"></div></div>
    <div class="card">
      <p class="prompt" id="q-prompt"></p>
      <div class="visual" id="q-vis"></div>

function clock(h,m){

function pie(n,k){

function mk(prompt, answer, d, o={}){

  for(const [v,tag] of d){ const k=String(v); if(seen.has(k) || (typeof v==="number" && v<0)) continue; seen.add(k); choices.push({v,tag:tag||null}); if(choices.length===4) break; }

  return {prompt, answer, choices:shuffle(choices), vis:o.vis||"", unit:o.unit||"", say:o.say||prompt, kind:o.kind||""};

// ---------- scoring ----------
function estimate(items){
  const by={}; for(let l=1;l<=TOP;l++) by[l]={c:0,n:0};
  items.forEach(it=>{ by[it.level].n++; if(it.correct) by[it.level].c++; });
  let secure=0;
  for(let L=1;L<=TOP;L++){
    if(!by[L].c) continue;
    let ok=true; for(let l=1;l<=L;l++){ if(by[l].n && by[l].c/by[l].n<0.5) ok=false; }
    if(ok) secure=L;
  }
  const times=items.filter(i=>i.correct).map(i=>i.secs).sort((a,b)=>a-b);
  const med=times.length?times[Math.floor(times.length/2)]:null;
  return {secure, by, medianSecs:med};
}

function nextQ(){
  const L=run.L; let it, tries=0;
  do{ it=G[L.key][run.level-1](); tries++; }while(tries<6 && run.items.some(x=>x.prompt===it.prompt));
  current={...it, level:run.level};
  $("q-land").textContent=L.name;
  $("q-peb").innerHTML=Array.from({length:ITEMS_PER_LAND},(_,i)=>`<i class="${i<run.items.length?"lit":""}"></i>`).join("");
  $("q-prompt").textContent=it.prompt;
  $("q-vis").innerHTML=it.vis;
  const small = it.choices.some(c=>String(c.v).length>5);
  $("q-choices").innerHTML=it.choices.map((c,i)=>`<button class="choice ${small?"small":""}" data-i="${i}">${esc(fmt(c.v,it.unit))}</button>`).join("");
  $("q-av").textContent=palE();
  $("q-say").textContent=pick(["Take your time. There's no rush in this land.","Hmm, let's think about this one together.","You can tap the speaker if you want me to read it.","I wonder what the answer is…","Ooh, I like this one."]);
  shownAt=performance.now(); busy=false;
}
function answer(idx){
  if(busy) return; busy=true;
  const it=current, secs=Math.round((performance.now()-shownAt)/1000);
  const unsure = idx===null; const c = unsure?null:it.choices[idx];
  if(!unsure) $("q-choices").children[idx].classList.add("picked");
  const rec={level:it.level, kind:it.kind, prompt:it.prompt, answer:fmt(it.answer,it.unit), chosen:unsure?null:fmt(c.v,it.unit), correct:!!(c&&c.correct), unsure, tag:c?c.tag:null, secs};
  run.items.push(rec);
  run.level = rec.correct ? Math.min(TOP,run.level+1) : Math.max(1,run.level-1);
  const l1Miss = run.items.filter(x=>x.level===1 && !x.correct).length>=2;
  cheer(unsure ? pick(["That's okay! Explorers skip some paths.","No problem, we'll find another path!","Good to know! On we go."])
               : pick(["Got it! The path glows brighter.","Thank you, explorer!",`${S.palName} writes it in the map book.`,"Onward!","A firefly lights up!","Nice thinking!"]));
  setTimeout(()=>{
    if(run.items.length>=ITEMS_PER_LAND || l1Miss) finishLand(); else { nextQ(); if(S.read) say(current.say); }
  }, 900);
}

function reportText(sess){
  const lines=[`Moonlit Map results for ${sess.name||"Explorer"} (${new Date(sess.startedAt).toLocaleDateString()})`];
  for(const L of LANDS){ const ld=sess.lands[L.key]; if(!ld){ lines.push(`${L.skill}: not explored yet`); continue; }
    const e=estimate(ld.items);
    lines.push(`${L.skill}: comfortable up to level ${e.secure}/${TOP}${e.secure?` (${L.levels[e.secure-1]})`:""}${e.secure<TOP?`; next step: ${L.levels[e.secure]}`:""}`);
    const tags=[...new Set(ld.items.filter(i=>i.tag).map(i=>i.tag))]; if(tags.length) lines.push(`  patterns: ${tags.join("; ")}`);
  }
  return lines.join("\n");
}
function strandHTML(L, ld){
  if(!ld) return `<div class="strand"><div class="top"><h3>${L.skill}</h3><span class="pill">Not explored yet</span></div><p class="muted" style="margin:0">${L.name} is still dark on the map.</p></div>`;
  const e=estimate(ld.items), s=e.secure;
  const pill = s>=5?`<span class="pill ok">Strong</span>`: s>=3?`<span class="pill mid">Building</span>`:`<span class="pill low">Needs a foundation</span>`;
  const meter=`<div class="meter" aria-label="level ${s} of ${TOP}">${[1,2,3,4,5,6].map(l=>`<i class="${l<=s?"on":l===s+1?"next":""}"></i>`).join("")}</div>`;
  const tags={}; ld.items.forEach(i=>{ if(i.tag) tags[i.tag]=(tags[i.tag]||0)+1; });
  const unsure=ld.items.filter(i=>i.unsure).length;
  const slow = e.medianSecs!=null && e.medianSecs>35;
  const notes=[];
  Object.entries(tags).forEach(([t,n])=>notes.push(`${t}${n>1?` (${n} times)`:""}`));
  if(unsure) notes.push(`Said "I haven't learned this yet" ${unsure} time${unsure>1?"s":""}`);
  if(slow) notes.push(`Correct answers took a while (about ${e.medianSecs}s each), so she may still be counting rather than recalling`);
  return `<div class="strand">
    <div class="top"><h3>${L.skill}</h3>${pill}</div>
    <div class="row">${meter}<span class="muted">${s?`Level ${s} of ${TOP}, roughly ${GRADE[s-1]}`:"Not yet secure at level 1"}</span></div>
    ${s?`<div><b>Comfortable with:</b> ${L.levels[s-1]}${s>1?" and everything before it":""}.</div>`:`<div><b>Comfortable with:</b> not yet shown at the first level.</div>`}
    ${s<TOP?`<div><b>Next to practice:</b> ${L.levels[s]}.</div>`:`<div><b>Next:</b> ready for harder 3rd-grade work here.</div>`}
    ${notes.length?`<div><b>What her answers suggest:</b><ul>${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:""}
  </div>`;
}
function itemTable(sess){

    ld.items.forEach(i=>{ rows+=`<tr><td>${L.skill}</td><td class="n">${i.level}</td><td>${esc(i.prompt)}</td><td class="n">${esc(i.answer)}</td><td class="n ${i.correct?"ok-t":"no-t"}">${i.unsure?"not sure":esc(i.chosen)}</td><td class="n">${i.secs}s</td></tr>`; }); }
  return rows?`<div class="tablewrap"><table><thead><tr><th>Area</th><th>Lvl</th><th>Question</th><th>Answer</th><th>She chose</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table></div>`:"";
}
async function openReport(){
  show("s-grown");
  const sess=S; const nDone=Object.keys(sess.lands).length;
  const strong=[], next=[];
  LANDS.forEach(L=>{ const ld=sess.lands[L.key]; if(!ld) return; const s=estimate(ld.items).secure; (s>=5?strong:next).push({L,s}); });
  next.sort((a,b)=>a.s-b.s);
  $("report").innerHTML=`

    ${nDone?`<h3>At a glance</h3><ul>
      ${strong.length?`<li><b>Strongest:</b> ${strong.map(x=>x.L.skill).join(", ")}</li>`:""}
      ${next.length?`<li><b>Best places to practice first:</b> ${next.slice(0,3).map(x=>x.L.skill).join(", ")}</li>`:""}
    </ul>`:""}
    ${LANDS.map(L=>strandHTML(L,sess.lands[L.key])).join("")}
    <p class="note">Levels are a quick screen from about 5 questions per area, not a formal test. One lucky guess or one slip can move a level, so treat it as a starting point and trust what you see when you work with her.</p>
    <div class="row"><button class="btn" id="b-copy" style="font-size:17px;padding:10px 18px">Copy summary</button><span class="note" id="save-note"></span></div>
    <textarea id="copybox" hidden readonly style="width:100%;min-height:140px;font:inherit;font-size:14px"></textarea>
    <details><summary>Every question and answer</summary>${itemTable(sess)||'<p class="muted">No answers yet.</p>'}</details>
    <details id="past"><summary>Earlier adventures</summary><div id="pastlist" class="muted">Loading…</div></details>`;
  $("b-rback").onclick=()=>{ renderMap(); show("s-map"); };
  $("b-copy").onclick=()=>{ const t=reportText(sess); const done=()=>{$("b-copy").textContent="Copied";};
    try{ navigator.clipboard.writeText(t).then(done,()=>{ const b=$("copybox"); b.hidden=false; b.value=t; b.select(); }); }catch(e){ const b=$("copybox"); b.hidden=false; b.value=t; b.select(); } };
  const db=await getDb();
  $("save-note").textContent = db ? (lastSaved?`Results saved ${lastSaved.toLocaleTimeString()}.`:"Results save after each land.") : "Results are kept on this device only.";
  if(!db){ $("pastlist").textContent="Earlier adventures show up here when you're signed in."; return; }
  try{
    const snap=await db.collection("sessions").orderBy("startedAt","desc").limit(10).get();
    const rows=snap.docs.map(d=>d.data()).filter(x=>x && x.id!==sess.id);
    $("pastlist").innerHTML = rows.length ? `<ul>${rows.map(x=>`<li>${new Date(x.startedAt).toLocaleDateString()}: ${esc(x.name||"Explorer")}, ${Object.keys(x.lands||{}).length} lands. ${LANDS.filter(L=>x.summary&&x.summary[L.key]).map(L=>`${L.skill} ${x.summary[L.key].secureLevel}/${TOP}`).join(", ")}</li>`).join("")}</ul>` : "This is the first adventure.";
  }catch(e){ $("pastlist").textContent="Couldn't load earlier adventures right now."; }
}

// boot
renderStart(); show("s-start");
window.__G=G; window.__estimate=estimate; window.__LANDS=LANDS;
})();
</script>

</body>
</html>
