<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2147">
<title>Fairy Lantern Festival</title>
<script src="../../shared/veil3d.js" data-bg="#141836" data-glow="#ffd86b" data-ink="#fff4d6" data-text="Lighting the lanterns…"></script>
<style>
:root{
  --night:#1d2147; --night2:#2a2f66; --night3:#13163a; --moss:#5f8f5a; --moss2:#3d6744; --moss3:#2b4a35;
  --gold:#ffd86b; --gold2:#ffb54a; --rose:#f2a7b5; --rose2:#e48aa0; --lav:#b9a6e8; --lav2:#8f7cc9;
  --cream:#fff7e6; --paper:#fff1d6; --ink:#3a2f5c; --brass:#d1a65a; --brass2:#94692f; --sky:#a9c8ff;
  --font: ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Andika', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --c: 64px;
  --cap: clamp(19px, 2.5vw + 6px, 29px);
  --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
  --bright: 0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--cream);font-family:var(--font);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;border:0;cursor:pointer;color:inherit;background:none;padding:0}
svg{display:block}
.hidden{display:none !important}
.scr{position:fixed;inset:0;display:none;overflow:hidden;padding:var(--sat) var(--sar) var(--sab) var(--sal);
  background:radial-gradient(120% 80% at 50% 0%, #2d3477 0%, var(--night) 55%, var(--night3) 100%)}
.scr.on{display:block}
.play-surface{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* starry bg */
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff7d0;opacity:.7;animation:twk 3s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.25}50%{opacity:.95}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:72px;padding:12px 30px;border-radius:40px;
  font-size:clamp(22px,2.4vw + 8px,30px);font-weight:800;color:var(--ink);background:linear-gradient(#ffe9a3,var(--gold) 55%,#f4b94f);
  box-shadow:0 6px 0 #b9802d,0 10px 30px rgba(255,216,107,.35);letter-spacing:.3px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b9802d}
.btn.rose{background:linear-gradient(#ffd3dc,var(--rose));box-shadow:0 6px 0 #c06f84,0 10px 30px rgba(242,167,181,.3)}
.btn.lav{background:linear-gradient(#e2d7ff,var(--lav));box-shadow:0 6px 0 #7a68b4,0 10px 26px rgba(185,166,232,.3)}
.btn.small{min-height:60px;font-size:22px;padding:8px 22px}
.cbtn{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:rgba(255,247,230,.12);
  border:2px solid rgba(255,247,230,.25);box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative}
.cbtn:active{transform:scale(.94)}
.cbtn svg{width:42px;height:42px}
.cbtn .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap;opacity:.85;font-weight:700}

/* ===== TITLE ===== */
#title{display:none;place-items:center;text-align:center}
#title.on{display:grid}
#title .moonbtn{width:min(62vw,62vh,440px);aspect-ratio:1;border-radius:50%;position:relative;animation:moonfloat 6s ease-in-out infinite}
#title .moonbtn svg{width:100%;height:100%}
@keyframes moonfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#title h1{margin:0 0 6px;font-size:clamp(34px,5vw + 10px,64px);color:var(--gold);text-shadow:0 0 24px rgba(255,216,107,.55);letter-spacing:1px}
#title p{font-size:var(--cap);margin:18px 0 0;opacity:.95}
.ttl-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px}

/* ===== MEET ===== */
#meet{display:none}
#meet.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px)}
.meet-q{font-size:var(--cap);font-weight:800;text-align:center;max-width:900px;line-height:1.25}
.meet-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}
.meet-fairy{width:clamp(150px,22vh,230px);height:clamp(175px,26vh,270px)}
.swatch{width:84px;height:84px;border-radius:50%;border:5px solid rgba(255,255,255,.25);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.swatch.sel{border-color:var(--cream);box-shadow:0 0 0 5px var(--gold),0 0 24px var(--gold)}
.hairbtn{width:96px;height:96px;border-radius:24px;background:rgba(255,255,255,.1);border:4px solid rgba(255,255,255,.2);display:grid;place-items:center}
.hairbtn.sel{border-color:var(--gold);box-shadow:0 0 18px rgba(255,216,107,.6)}
.hairbtn svg{width:80px;height:80px}
.namestars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:760px;width:100%}
.namestar{min-height:88px;border-radius:28px;font-size:clamp(20px,2vw + 10px,28px);font-weight:800;color:var(--ink);background:radial-gradient(circle at 50% 30%,#fff7d0,var(--gold) 70%);box-shadow:0 5px 0 #b9802d;position:relative}
.namestar.sel{background:radial-gradient(circle at 50% 30%,#fff,#ffe9a8 60%,var(--gold2));box-shadow:0 0 0 5px var(--cream),0 0 26px var(--gold)}
.namestar::before{content:'✦';position:absolute;top:4px;left:12px;font-size:16px;opacity:.6}
.panel{max-width:820px;width:100%;background:rgba(255,247,230,.08);border:2px solid rgba(255,247,230,.18);border-radius:32px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.panel .art{width:min(70vw,420px);height:min(34vh,260px)}
.panel .txt{font-size:var(--cap);font-weight:700;line-height:1.3}
.tapnext{font-size:18px;opacity:.75}
@media (max-width:560px){.namestars{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== MAP ===== */
#map .mapsvg{position:absolute;inset:0;width:100%;height:100%}
#map .corner{position:absolute;display:flex;gap:18px;z-index:5}
#map .tl{top:calc(var(--sat) + 14px);left:calc(var(--sal) + 14px)}
#map .tr{top:calc(var(--sat) + 14px);right:calc(var(--sar) + 14px)}
#map .bl{bottom:calc(var(--sab) + 30px);left:calc(var(--sal) + 14px)}
#map .br{bottom:calc(var(--sab) + 30px);right:calc(var(--sar) + 14px)}
#map .go{position:absolute;left:50%;bottom:calc(var(--sab) + 24px);transform:translateX(-50%);z-index:6;white-space:nowrap}
#map .go:active{transform:translateX(-50%) translateY(4px)}
.glade{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:120px;z-index:4}
.glade .gicon{width:clamp(92px,13vmin,130px);height:clamp(92px,13vmin,130px);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,#3c6a4b 0%,#2a4c38 70%);border:4px solid rgba(255,247,230,.25);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.glade.sel .gicon{border-color:var(--gold);box-shadow:0 0 0 5px rgba(255,216,107,.35),0 0 34px rgba(255,216,107,.55)}
.glade .gicon svg{width:78%;height:78%}
.glade .gname{font-weight:800;font-size:clamp(15px,1.4vw + 6px,20px);text-shadow:0 2px 6px rgba(0,0,0,.6);text-align:center;background:rgba(19,22,58,.55);padding:2px 10px;border-radius:12px}
.glade .spots{display:flex;gap:5px}
.glade .spots i{width:14px;height:20px;border-radius:6px 6px 8px 8px;background:#3a3f6e;border:2px solid #8a7bb8}
.glade .spots i.on{background:var(--gold);border-color:#fff2b5;box-shadow:0 0 10px var(--gold)}
.petalmini{display:grid;grid-template-columns:repeat(5,7px);gap:2px}
.petalmini i{width:7px;height:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4)}
.petalmini i.on{background:var(--rose);border-color:var(--rose)}
.cbtn.glowy{animation:glowy 1.4s ease-in-out infinite}
@keyframes glowy{0%,100%{box-shadow:0 0 0 0 rgba(255,216,107,.0)}50%{box-shadow:0 0 0 8px rgba(255,216,107,.45),0 0 30px var(--gold)}}
.holdring{position:absolute;inset:-6px;pointer-events:none}
.holdring circle{transition:none}

/* ===== NIGHT ===== */
#night{display:none}
#night.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,40%);grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"hooks hooks" "cap cap" "play tray" "bar tray"}
#night .bgglade{position:absolute;inset:0;pointer-events:none;z-index:0}
#night .bgglade svg{width:100%;height:100%}
#night .brightwash{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(90% 70% at 40% 60%,rgba(255,216,107,.55),rgba(255,184,74,0) 70%);opacity:calc(var(--bright) * .055);transition:opacity 1.2s}
#night>.hooks,#night>.capbar,#night>.play,#night>.tray,#night>.bar{position:relative;z-index:1}
.hooks{grid-area:hooks;display:flex;align-items:flex-start;justify-content:center;gap:clamp(4px,1.6vw,18px);padding:6px 76px 0;height:72px;position:relative}
.hooks::before{content:'';position:absolute;left:70px;right:70px;top:10px;height:18px;border-bottom:3px solid rgba(255,247,230,.35);border-radius:0 0 50% 50%}
.hook{width:38px;height:62px;position:relative;display:flex;justify-content:center}
.hook::before{content:'';position:absolute;top:12px;width:10px;height:12px;border:3px solid #c9b48a;border-top:0;border-radius:0 0 8px 8px}
.hook .mini{position:absolute;top:22px;transform:scale(.62);transform-origin:top center}
.hook.cur::after{content:'';position:absolute;top:22px;left:50%;margin-left:-12px;width:24px;height:30px;border-radius:10px;border:3px dashed rgba(255,216,107,.6);animation:pulse 1.6s ease-in-out infinite}
.homebtn{position:absolute;left:10px;top:6px}
.belowhooks{position:absolute;right:10px;top:6px}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
.capbar{grid-area:cap;display:flex;align-items:center;gap:12px;margin:2px 14px 4px;padding:8px 10px 8px 16px;border-radius:26px;
  background:rgba(19,22,58,.72);border:2px solid rgba(255,247,230,.16);min-height:68px}
.capbar .ctext{flex:1;font-size:var(--cap);font-weight:700;line-height:1.22}
.capbar.nocap .ctext{visibility:hidden}
.spk{width:64px;height:64px;flex:none;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 4px 0 #b9802d}
.spk svg{width:36px;height:36px}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #b9802d}
.play{grid-area:play;position:relative;min-height:0;min-width:0;overflow:hidden}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px;padding:10px 12px 12px}
.stage.col{flex-direction:column;gap:10px}
.stage.withpath{padding-bottom:84px}
.stage.withdoor{padding-right:110px}
.tray{grid-area:tray;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:12px;min-width:0;
  background:linear-gradient(180deg,rgba(95,143,90,.18),rgba(61,103,68,.38));border-left:2px solid rgba(255,247,230,.1);border-radius:30px 0 0 30px}
.bar{grid-area:bar;display:flex;align-items:flex-end;gap:10px;padding:0 12px 8px;min-height:118px}
.bar .fairy{width:96px;height:112px;flex:none;position:relative}
.bar .fairy svg{width:100%;height:100%}
.bubble{flex:1;min-height:60px;align-self:center;background:var(--cream);color:var(--ink);border-radius:26px;padding:10px 18px;font-size:clamp(18px,1.4vw + 8px,25px);font-weight:700;line-height:1.2;position:relative;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.bubble.on{opacity:1;transform:none}
.bubble::before{content:'';position:absolute;left:-12px;bottom:18px;border:12px solid transparent;border-right-color:var(--cream);border-left:0}
.toolbtn{width:76px;height:76px;flex:none;border-radius:24px;background:linear-gradient(#a98654,#7c5a2c);border:3px solid #e2c48e;display:grid;place-items:center;box-shadow:0 5px 0 #4d3517;position:relative}
.toolbtn svg{width:50px;height:50px}
.toolbtn.on{box-shadow:0 0 0 4px var(--gold),0 5px 0 #4d3517}
.toolpanel{position:absolute;right:12px;bottom:110px;z-index:30;background:#fff3dc;color:var(--ink);border-radius:28px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.45);border:3px solid #e2c48e}
.toolpanel button{display:flex;align-items:center;gap:12px;min-height:68px;padding:6px 18px 6px 8px;border-radius:20px;font-size:22px;font-weight:800;background:#f6e3bf;color:var(--ink)}
.toolpanel button svg{width:52px;height:52px}
.toolpanel button.on{background:var(--gold);box-shadow:0 0 0 3px #b9802d inset}

@media (orientation:portrait){
  #night.on{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"hooks" "cap" "play" "tray" "bar"}
  .tray{flex-direction:row;flex-wrap:wrap;border-left:0;border-top:2px solid rgba(255,247,230,.1);border-radius:30px 30px 0 0;padding:12px 10px;gap:14px}
  .toolpanel{bottom:112px}
}
@media (max-width:600px){
  .hooks{padding:6px 66px 0;gap:1px;height:62px}
  .hooks::before{left:66px;right:56px}
  .homebtn{width:56px;height:56px;left:6px}
  .homebtn svg{width:36px;height:36px}
  .hook{width:28px}
  .hook .mini{transform:scale(.5)}
  .bar{min-height:96px}
  .bar .fairy{width:76px;height:90px}
  .toolbtn{width:68px;height:68px}
  .capbar{margin:2px 8px 4px;min-height:60px}
  .spk{width:56px;height:56px}
}

/* ===== LANTERN ===== */
.lan{position:relative;display:inline-flex;flex-direction:column;align-items:center;flex:none;--g:max(3px,calc(var(--c)*.07))}
.lan .lhandle{width:calc(var(--c)*1.4);height:calc(var(--c)*.42);margin-bottom:-4px}
.lan .lcap{width:calc(var(--c)*3.6);height:calc(var(--c)*.5);position:relative;z-index:2;transform-origin:50% 100%}
.lan.little .lcap{width:calc(var(--c)*2.8)}
.lan .lbody{position:relative;padding:calc(var(--c)*.16);border-radius:calc(var(--c)*.34);margin-top:-3px;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(185,166,232,.10) 45%,rgba(255,255,255,.05));
  border:4px solid var(--brass);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),inset 0 -10px 24px rgba(19,22,58,.35),0 8px 24px rgba(0,0,0,.3);transition:background .6s,box-shadow .6s}
.lan .lbase{width:calc(100% - var(--c)*.5);height:calc(var(--c)*.22);background:linear-gradient(var(--brass),var(--brass2));border-radius:0 0 14px 14px;margin-top:-2px}
.lan .lgrid{display:grid;grid-template-columns:repeat(5,var(--c));gap:var(--g)}
.lan .cell{width:var(--c);height:var(--c);border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(19,22,58,.55) 0 52%,rgba(255,247,230,.08) 53% 100%);border:2px dashed rgba(255,247,230,.22)}
.lan .cell .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:calc(var(--c)*.42);color:rgba(255,247,230,.0);pointer-events:none;z-index:3;transition:color .3s}
.play.t-glasses .cell .num,.play .glassesauto .cell .num{color:rgba(255,247,230,.55)}
.play.t-glasses .cell.on .num,.play .glassesauto .cell.on .num{color:rgba(58,47,92,.75)}
.lan .cell .ff{width:88%;height:88%}
.lan.lit .lbody{background:radial-gradient(circle at 50% 50%,rgba(255,236,160,.55),rgba(255,184,74,.25) 70%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 0 40px rgba(255,216,107,.75),0 0 90px rgba(255,216,107,.35)}
.lan.soft .lbody{box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 0 18px rgba(185,166,232,.4)}
.lan.moonbig.lit .lbody{box-shadow:inset 0 0 0 2px #fff,0 0 60px #ffe9a0,0 0 140px rgba(255,216,107,.6)}
.lan .frost{position:relative;z-index:4;margin:-2px;border-radius:14px;background:linear-gradient(135deg,rgba(225,232,255,.92),rgba(200,210,245,.85));display:grid;place-items:center;
  font-weight:900;color:var(--ink);font-size:calc(var(--c)*.8);box-shadow:inset 0 0 12px #fff;transition:opacity .3s}
.lan .frost::after{content:'❄';position:absolute;top:2px;right:8px;font-size:18px;opacity:.55}
.play.t-peek .lan .frost{opacity:.18}
.lan .tag{margin-top:6px;min-width:calc(var(--c)*1.25);min-height:calc(var(--c)*.95);padding:4px 12px;border-radius:12px 12px 16px 16px;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #d9c39a;position:relative;font-weight:900}
.lan .tag::before{content:'';position:absolute;top:-10px;left:50%;width:2px;height:10px;background:#d9c39a}
.lan .tag .tn{font-size:calc(var(--c)*.62);line-height:1}
.lan .tag .td{display:flex;flex-wrap:wrap;gap:3px;max-width:62px;justify-content:center;margin-top:2px}
.lan .tag .td i{width:9px;height:9px;border-radius:50%;background:var(--gold2)}
.lan .tag .td.hollow i{background:transparent;border:2px solid var(--gold2)}
.lan .tag.glow{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}
.lan .stamp{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg) scale(0);font-weight:900;font-size:calc(var(--c)*.9);color:#fff8d6;
  text-shadow:0 0 10px var(--gold),0 0 24px var(--gold2),0 3px 0 #b9802d;pointer-events:none;letter-spacing:4px}
.lan .ribbon{position:absolute;z-index:5;top:calc(var(--c)*-.78);left:50%;transform:translateX(-50%) scale(0);width:calc(var(--c)*1.4);height:calc(var(--c)*.8)}
.lan.clicked .ribbon{animation:ribbonin .6s .25s cubic-bezier(.3,1.6,.5,1) forwards}
.lan.clicked .stamp{animation:stampin 1.4s .1s ease-out forwards}
.lan.clicked .lcap{animation:capsnap .35s ease-out}
.lan.tied .ribbon{transform:translateX(-50%) scale(1)}
@keyframes ribbonin{to{transform:translateX(-50%) scale(1)}}
@keyframes stampin{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(0);opacity:1}35%{transform:translate(-50%,-50%) rotate(-12deg) scale(1.25);opacity:1}70%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:0}}
@keyframes capsnap{0%{transform:translateY(-18px)}70%{transform:translateY(3px)}100%{transform:none}}
.cell.twinkle{animation:twinkle .5s ease-in-out 4}
@keyframes twinkle{0%,100%{box-shadow:none;border-color:rgba(255,247,230,.22)}50%{box-shadow:0 0 18px var(--gold);border-color:var(--gold)}}
.cell.ghost::after{content:'';position:absolute;inset:12%;border-radius:50%;border:3px dashed var(--gold);animation:pulse 1.2s ease-in-out infinite}
.cell.extra::after{content:'';position:absolute;inset:-4%;border-radius:50%;border:4px solid var(--lav);animation:pulse 1.2s ease-in-out infinite}
.cell.counting{box-shadow:0 0 0 4px var(--cream),0 0 20px var(--gold);border-color:var(--cream)}
.lan.shimmer .cell.on{animation:shim 1.2s ease-in-out 2}
@keyframes shim{50%{filter:brightness(1.6) drop-shadow(0 0 8px #fff)}}
.lan.wiggle,.wiggle{animation:wig .5s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.lan.pulsegrp .cell.on.grp{animation:grppulse .7s ease-in-out 2}
@keyframes grppulse{50%{transform:scale(1.15);filter:brightness(1.5)}}

/* ===== FIREFLY ===== */
.ff{position:relative;width:44px;height:44px;color:#ffe27a;pointer-events:none}
.ff .glow{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,currentColor 0%,rgba(255,216,107,.35) 35%,rgba(255,216,107,0) 68%);opacity:.75}
.ff svg{position:relative;width:100%;height:100%}
.ff.c-rose{color:#ffb3c4}
.ff.c-rose .glow{background:radial-gradient(circle,#ffc4d1 0%,rgba(242,167,181,.4) 35%,rgba(242,167,181,0) 68%)}
.ff.c-lav{color:#d9ccff}
.ff.c-lav .glow{background:radial-gradient(circle,#e4dbff 0%,rgba(185,166,232,.4) 35%,rgba(185,166,232,0) 68%)}
.ff.c-mint{color:#b8f0c4}
.ff.c-mint .glow{background:radial-gradient(circle,#d0ffd8 0%,rgba(140,220,160,.4) 35%,rgba(140,220,160,0) 68%)}
.cell.on .ff{animation:popin .35s cubic-bezier(.3,1.7,.5,1)}
@keyframes popin{0%{transform:scale(.2)}100%{transform:scale(1)}}
.cell.on .ff.bob, .meadow .ffw .ff{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ff.giggle{animation:giggle .5s ease-in-out 2 !important}
@keyframes giggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(-3px)}75%{transform:rotate(14deg) translateY(-3px)}}
.ff.dim{opacity:.35}
.flyer{position:fixed;left:0;top:0;z-index:200;pointer-events:none;will-change:transform}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--gold) 45%,rgba(255,216,107,0) 70%);pointer-events:none}
.dragclone{position:fixed;z-index:300;pointer-events:none;left:0;top:0;transform-origin:center;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}

/* ===== MEADOW ===== */
.meadow{display:flex;justify-content:center;align-items:center;gap:2px;padding:6px 10px;border-radius:40px;position:relative;
  background:radial-gradient(120% 140% at 50% 120%,#6fa16a 0,#4b7c50 50%,rgba(61,103,68,.0) 75%);min-height:96px}
.meadow .ffw{width:72px;height:72px;display:grid;place-items:center;border-radius:50%;touch-action:none;cursor:pointer}
.meadow .ffw .ff{width:46px;height:46px}
.meadow .ffw:nth-child(2) .ff{animation-delay:.4s}.meadow .ffw:nth-child(3) .ff{animation-delay:.9s}.meadow .ffw:nth-child(4) .ff{animation-delay:1.3s}.meadow .ffw:nth-child(5) .ff{animation-delay:.2s}
.meadow .ffw.respawn{animation:respawn .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes respawn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.meadow .grass{position:absolute;bottom:2px;left:10px;right:10px;height:24px;pointer-events:none}
.trayl{font-size:18px;font-weight:800;opacity:.85;text-align:center;width:100%}

/* ===== JARS ===== */
.jars{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.jar{width:100px;min-height:130px;position:relative;display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:pointer}
.jar svg.jg{width:100px;height:112px}
.jar .jl{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:76px;min-height:52px;border-radius:12px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;box-shadow:0 2px 0 #d9c39a}
.jar .jl .n{font-size:34px;font-weight:900;line-height:1}
.jar .jl .d{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:64px}
.jar .jl .d i{width:10px;height:10px;border-radius:50%;background:var(--gold2)}
.jar.rose .jl .d i{background:var(--rose2)}
.jar.used{opacity:.35;pointer-events:none}
.jar.dim{opacity:.35}
.bounce{animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* ===== TILES ===== */
.tiles{display:flex;gap:16px;justify-content:center;flex-wrap:nowrap}
.tile{width:104px;height:112px;position:relative;display:grid;place-items:center;font-size:48px;font-weight:900;color:var(--ink)}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile span{position:relative;margin-top:6px}
.tile:active{transform:scale(.95)}
.tile.wob{animation:wob .6s ease-in-out}
@keyframes wob{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-3deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.tile.dim{opacity:.3;pointer-events:none}
.tile.win{animation:tilewin .8s ease-out forwards}
@keyframes tilewin{40%{transform:scale(1.25)}100%{transform:scale(1.1);filter:drop-shadow(0 0 18px var(--gold))}}
.tile.pop{animation:popin .4s cubic-bezier(.3,1.7,.5,1)}

/* ===== CORD ===== */
.cord{width:96px;position:relative;touch-action:none;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.cord svg{width:96px;height:150px}
.cord .cl{margin-top:2px;font-size:16px;font-weight:800;background:rgba(19,22,58,.7);padding:2px 10px;border-radius:10px;white-space:nowrap;line-height:1.2;text-align:center}
.cord.pulled svg{animation:pull .5s ease-out}
@keyframes pull{30%{transform:translateY(22px)}100%{transform:none}}
.cord.bounce svg{animation:cbounce 1s ease-in-out infinite}
@keyframes cbounce{0%,100%{transform:none}50%{transform:translateY(12px)}}

/* ===== GARLAND ===== */
.garland{position:relative;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:10px 6px;padding:22px 14px 12px;max-width:100%;border-radius:24px;transition:background .4s}
.garland::before{content:'';position:absolute;left:8px;right:8px;top:8px;height:22px;border-top:3px solid rgba(255,247,230,.4);border-radius:50% 50% 0 0/100% 100% 0 0;pointer-events:none}
.garland .grp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-start;padding:4px;border-radius:18px;position:relative;transition:background .3s}
.garland .grp.lab{background:rgba(255,247,230,.1);outline:3px dashed rgba(255,216,107,.5);margin-bottom:30px}
.garland .grp .glab{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--paper);color:var(--ink);font-weight:900;font-size:18px;padding:2px 10px;border-radius:10px;z-index:3}
.mini{width:48px;height:76px;position:relative;flex:none;display:block}
.garland{--mw:clamp(44px,6.6vmin,70px);--lw:clamp(28px,4.4vmin,46px)}
.garland .mini{width:var(--mw);height:calc(var(--mw)*1.58)}
.garland .gmoon{width:calc(var(--mw)*2);height:calc(var(--mw)*2)}
.mini svg{width:100%;height:100%}
.mini.dark{filter:saturate(.4) brightness(.55)}
.mini.lit{filter:drop-shadow(0 0 10px var(--gold))}
.mini .ml{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-weight:900;font-size:17px;background:var(--gold);color:var(--ink);border-radius:9px;padding:0 6px}
.mini.tap{cursor:pointer}
.mini.hl,.gmoon.hl{filter:drop-shadow(0 0 12px #fff) brightness(1.2)}
.gmoon{width:96px;height:96px;flex:none;position:relative}
.gmoon svg{width:100%;height:100%}
.gmoon .gml{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:26px;color:var(--ink)}
.ljar{position:relative;padding:8px 10px;border-radius:22px;border:4px solid rgba(220,235,255,.6);background:rgba(220,235,255,.1);display:flex;flex-direction:column;gap:4px;align-self:center;touch-action:none}
.ljar .lr{display:flex;gap:3px}
.ljar .lc{width:var(--lw,34px);height:var(--lw,34px);border-radius:50%;border:2px dashed rgba(255,247,230,.25);display:grid;place-items:center;position:relative}
.ljar .lc .ff{width:88%;height:88%}
.ljar .lc.on{border-color:transparent}
.ljar .lc .num{position:absolute;font-size:14px;font-weight:900;color:transparent}
.play.t-glasses .ljar .lc .num,.play .glassesauto .ljar .lc .num{color:rgba(255,247,230,.5)}
.play.t-glasses .ljar .lc.on .num,.play .glassesauto .ljar .lc.on .num{color:rgba(58,47,92,.8);z-index:2}
.ljar.wiggle{animation:wig .5s ease-in-out infinite}
.ljar .lname{position:absolute;top:-22px;left:12px;font-size:14px;font-weight:800;opacity:.75}
.ljar.full{box-shadow:0 0 20px var(--gold)}
.gtag{background:var(--paper);color:var(--ink);border-radius:18px;padding:6px 18px;font-weight:900;font-size:clamp(28px,3vw + 10px,46px);box-shadow:0 5px 0 #d9c39a;display:flex;align-items:center;gap:10px;position:relative}
.gtag .dg{display:inline-block;border-radius:10px;padding:0 1px;transition:background .3s}
.gtag .dg.hl{padding:0 4px}
.gtag .dg.t.hl{background:var(--gold)}
.gtag .dg.o.hl{background:var(--rose)}
.gcount{font-size:clamp(18px,1.4vw + 8px,24px);font-weight:800;background:rgba(19,22,58,.65);padding:6px 14px;border-radius:14px;text-align:center}
.ribbonbtn{min-height:72px;padding:8px 22px;border-radius:30px;background:linear-gradient(#ffd3dc,var(--rose));color:var(--ink);font-weight:900;font-size:22px;box-shadow:0 5px 0 #c06f84;display:flex;align-items:center;gap:10px}
.ribbonbtn svg{width:48px;height:36px}
.basket{width:132px;height:118px;position:relative;touch-action:none;cursor:pointer}
.basket svg{width:100%;height:100%}
.basket .bl{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:800;white-space:nowrap;background:rgba(19,22,58,.7);padding:1px 8px;border-radius:9px}
.river{position:absolute;left:0;right:0;bottom:0;height:46px;pointer-events:none;opacity:.8}
.joinbtn{min-width:150px}

/* ===== NUMBER PATH ===== */
.npath{position:absolute;left:12px;right:12px;bottom:8px;height:70px;border-radius:20px;background:rgba(255,247,230,.92);color:var(--ink);transform:translateY(120%);transition:transform .45s cubic-bezier(.3,1.4,.5,1);z-index:8;padding:0 18px}
.npath.on{transform:none}
.npath .ticks{position:absolute;left:18px;right:18px;top:0;bottom:0}
.npath .tk{position:absolute;bottom:8px;transform:translateX(-50%);font-size:15px;font-weight:800;text-align:center}
.npath .tk::before{content:'';display:block;width:2px;height:12px;background:#b7a37e;margin:0 auto 2px}
.npath .tk.b{font-size:17px}
.npath .tk.b::before{height:18px;width:3px;background:var(--brass2)}
.npath .dot{position:absolute;top:6px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle,#fff6c8,var(--gold) 60%,var(--gold2));box-shadow:0 0 14px var(--gold);transition:left .35s}
.npath svg.hops{position:absolute;left:18px;right:18px;top:-28px;height:60px;width:calc(100% - 36px);overflow:visible;pointer-events:none}

/* ===== MOON DOOR ===== */
.moondoor{position:absolute;top:8px;right:10px;width:98px;z-index:6;display:flex;flex-direction:column;align-items:center}
.moondoor svg{width:92px;height:92px}
.moondoor .mstars{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:110px;min-height:24px}
.moondoor .mstars b{font-size:13px;width:22px;height:22px;display:grid;place-items:center;background:var(--gold);color:var(--ink);border-radius:50%;animation:popin .35s}

/* ===== FAIRY anim ===== */
.fairy svg{overflow:visible}
.fairy .fb{animation:fbob 3s ease-in-out infinite;transform-origin:50% 80%}
@keyframes fbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fairy .wings{animation:flap .5s ease-in-out infinite alternate;transform-origin:60px 70px}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.88)}}
.fairy.loop .fb{animation:floop 1s ease-in-out}
@keyframes floop{0%{transform:none}50%{transform:translateY(-36px) rotate(180deg)}100%{transform:rotate(360deg)}}
.fairy.think .fb{animation:fthink 1s ease-in-out}
@keyframes fthink{50%{transform:rotate(-8deg)}}

/* ===== END ===== */
#end{display:none}
#end.on{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:calc(var(--sat) + 10px) 14px calc(var(--sab) + 14px);overflow-y:auto}
.skygar{position:relative;width:100%;max-width:900px;height:96px;flex:none}
.skygar .mini{position:absolute;transition:transform 1.8s cubic-bezier(.3,1,.4,1),opacity .6s}
.endrow{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:center;width:100%;max-width:1000px}
.queen{width:110px;height:144px;flex:none}
.queen svg{width:100%;height:100%}
.endsay{font-size:var(--cap);font-weight:800;text-align:center;max-width:720px;line-height:1.25}
.pjar{display:flex;flex-direction:column;align-items:center;gap:6px}
.pjar .pf{display:grid;grid-template-columns:repeat(5,40px);gap:6px;padding:12px;border-radius:24px;background:rgba(255,247,230,.1);border:3px solid rgba(255,247,230,.4)}
.pjar .pf i{width:40px;height:40px;border-radius:50%;border:2px dashed rgba(255,247,230,.3);display:grid;place-items:center}
.pjar .pf i.on{border:0}
.pjar .pf i.on::before{content:'';width:22px;height:30px;background:radial-gradient(circle at 50% 35%,#fff2f5,#f2a7b5 70%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 12px rgba(242,167,181,.9);animation:popin .35s}
.pjar .pt{font-size:20px;font-weight:800}
.choices{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.choice{width:170px;min-height:190px;border-radius:26px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;box-shadow:0 6px 0 #d9c39a;font-weight:800;font-size:19px;text-align:center}
.choice svg{width:110px;height:110px}
.choice:active{transform:translateY(4px)}
.endbtns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ===== CARD ===== */
.card{width:200px;height:280px;border-radius:20px;position:relative;flex:none;perspective:900px}
.card .ci{position:absolute;inset:0;border-radius:20px;transform-style:preserve-3d;transition:transform .8s}
.card.flip .ci{transform:rotateY(180deg)}
.card .cf,.card .cb{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card .cb{background:repeating-linear-gradient(45deg,#3a3f86 0 12px,#2f3474 12px 24px);border:6px solid var(--lav);display:grid;place-items:center}
.card .cf{transform:rotateY(180deg)}
.card.noflip .ci{transform:none}.card.noflip .cf{transform:none}
.cardface{position:absolute;inset:0;border-radius:20px;background:var(--paper);color:var(--ink);border:7px solid #e9b8c4;display:flex;flex-direction:column;align-items:center;padding:8px;
  background-image:linear-gradient(90deg,rgba(242,167,181,.18) 50%,transparent 50%),linear-gradient(rgba(242,167,181,.18) 50%,transparent 50%);background-size:18px 18px}
.cardface.rare{border-color:#e7b53c;background:linear-gradient(135deg,#fff6cf,#ffe08a 40%,#fff3c4 60%,#f7cf5f);box-shadow:0 0 26px rgba(255,216,107,.7)}
.cardface .cn{font-weight:900;font-size:19px;text-align:center;line-height:1.1;background:rgba(255,255,255,.75);border-radius:10px;padding:2px 8px;width:100%}
.cardface .cart{width:100%;flex:1;min-height:0;display:grid;place-items:center}
.cardface .cart svg{width:120px;height:120px}
.cardface .cg{display:flex;align-items:center;gap:6px;background:var(--night);color:var(--cream);border-radius:12px;padding:3px 8px;width:100%;justify-content:space-between}
.cardface .cg .gn{font-size:24px;font-weight:900;color:var(--gold)}
.cardface .cg .gl{display:flex;gap:2px;flex-wrap:wrap;align-items:center;max-width:120px}
.cardface .cg .gl b{width:8px;height:16px;background:var(--gold);border-radius:3px}
.cardface .cg .gl b.big{width:16px;height:16px;border-radius:50%}
.cardface .cg .gl i{width:7px;height:7px;background:#fff1b0;border-radius:50%}
.cardface .ch{font-size:13px;font-weight:800;opacity:.75;margin-top:2px}
.cardface .rr{position:absolute;top:6px;right:8px;font-size:20px}
.card.sil .cardface{background:#2f3474;border-color:#4a4f96}
.card.sil .cardface.rare{background:#3a3560;border-color:#c9a04e;box-shadow:none}
.card.sil .cart svg{filter:brightness(0) opacity(.55)}
.card.sil .cn{background:rgba(255,255,255,.15);color:#cfc8f0}
.card.sil .ch{color:#cfc8f0;opacity:.9;text-align:center;font-size:14px}
.card.sil .q{display:none}

/* ===== COTTAGE ===== */
#cottage{display:none}
#cottage.on{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:6px;padding:calc(var(--sat) + 10px) calc(var(--sar) + 10px) calc(var(--sab) + 8px) calc(var(--sal) + 10px)}
.ctop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctop .rooms{display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:center}
.roomtab{min-height:60px;padding:6px 16px;border-radius:20px;background:rgba(255,247,230,.12);font-weight:800;font-size:19px;border:3px solid transparent}
.roomtab.sel{background:var(--paper);color:var(--ink);border-color:var(--gold)}
.roomtab.lock{opacity:.45}
.teapotwrap{position:relative;min-height:0;display:grid;place-items:center}
.teapot{position:relative;width:100%;aspect-ratio:1.45;max-width:100%}
.teapot>svg{position:absolute;inset:0;width:100%;height:100%}
.room{position:absolute;left:17%;right:17%;top:23%;bottom:13%;border-radius:30px 30px 46px 46px;overflow:hidden;touch-action:none}
.room .wall{position:absolute;left:0;right:0;top:0;bottom:24%}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:24%}
.room .decor{position:absolute;transform:translate(-50%,-100%);touch-action:none;cursor:grab}
.room .decor svg{width:100%;height:100%;pointer-events:none}
.room .decor.sel{filter:drop-shadow(0 0 8px var(--gold)) drop-shadow(0 0 3px #fff)}
.room .cfairy{position:absolute;width:13%;aspect-ratio:.86;transform:translate(-50%,-100%);transition:left 2.2s ease-in-out,top 2.2s ease-in-out;pointer-events:none;z-index:50}
.room .cfairy svg{width:100%;height:100%}
.room .zz{position:absolute;top:-10px;right:-6px;font-weight:900;font-size:22px;color:var(--lav);animation:pulse 2s infinite}
.cbasket{display:flex;gap:10px;overflow-x:auto;padding:10px;border-radius:24px;background:linear-gradient(#a98654,#7c5a2c);border:3px solid #e2c48e;min-height:100px;align-items:center;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.cbasket .bi{width:84px;height:84px;flex:none;border-radius:18px;background:#f6e3bf;display:grid;place-items:center;touch-action:none}
.cbasket .bi svg{width:72px;height:72px;pointer-events:none}
.cbasket .empty{color:#fff3dc;font-weight:800;font-size:19px;padding:0 10px}
.selbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:10px;z-index:60}

/* ===== GUIDE ===== */
#guide{display:none}
#guide.on{display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) 10px calc(var(--sab) + 10px);overflow-y:auto}
.gtop{display:flex;align-items:center;gap:12px;width:100%;max-width:1000px}
.gtop h2{flex:1;text-align:center;margin:0;font-size:clamp(24px,2vw + 12px,36px);color:var(--gold)}
.gpage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;justify-items:center}
.gpage .card{width:min(190px,28vw,calc((100vh - 350px) / 2.8));height:auto;aspect-ratio:200/280}
.gpage .card .cardface{transform:scale(var(--k,1));transform-origin:top left;width:200px;height:280px;inset:auto;top:0;left:0}
.gnav{display:flex;align-items:center;gap:24px}
.arrow{width:88px;height:88px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:44px;font-weight:900;box-shadow:0 5px 0 #b9802d;display:grid;place-items:center}
.arrow:disabled{opacity:.3}
.stickers{display:flex;gap:6px;flex-wrap:wrap;font-size:30px}
.lineup{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:1000px}
.lu-slots{display:flex;gap:10px;justify-content:center;position:relative;padding-bottom:40px}
.lu-slot{width:130px;height:182px;border-radius:16px;border:4px dashed rgba(255,247,230,.4);position:relative;display:grid;place-items:center}
.lu-slot .sn{position:absolute;bottom:-34px;font-weight:900;font-size:20px}
.lu-tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:190px}
.lu-card{width:130px;height:182px;position:relative;touch-action:none}
.lu-card .cardface{transform:scale(.65);transform-origin:top left;width:200px;height:280px}
.lu-card.sel{filter:drop-shadow(0 0 12px var(--gold))}
@media (max-width:600px){.lu-slot,.lu-card{width:80px;height:112px}.lu-card .cardface{transform:scale(.4)}}

/* ===== MODAL ===== */
#modal{position:fixed;inset:0;z-index:400;display:none;place-items:center;background:rgba(10,12,35,.7);padding:16px}
#modal.on{display:grid}
#modal .mbox{background:var(--night2);border:3px solid rgba(255,247,230,.3);border-radius:32px;padding:20px;max-width:min(94vw,640px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

<script id="kid-voice" data-voice-base="../../voice/">
/* KidVoice: one friendly voice for every game.
   Source of truth is shared/voice.js; tools/sync-voice.py copies it into each game
   so every index.html stays self-contained.

   1. Recorded clips first: if voice/manifest.json (made by tools/make-voice-clips.mjs)
      has a clip for a sentence, it plays that. Lines with numbers or names in them, like
      "7 plus 5" or "This lantern needs 7 fireflies", are stitched from shorter clips.
      A character can have their own recorded voice: KidVoice.speak(text, { voice: 'bramble' }).
   2. Otherwise the device's own speech, using the most natural voice it has
      (Premium / Enhanced iPad voices first, never the novelty or robot voices).
   A grown-up can pin a voice from The Wonder Shelf; it is saved in localStorage["gfk-voice"]. */
(function () {
  if (window.KidVoice) return;
  const synth = window.speechSynthesis || null;
  const NOVELTY = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Kathy)\b/i;
  const ROBOTIC = /\b(Eddy|Flo|Reed|Rocko|Sandy|Shelley|Grandma|Grandpa)\b/i; // iOS "Eloquence" voices
  const FAVORITES = ['Ava', 'Zoe', 'Samantha', 'Allison', 'Susan', 'Nicky', 'Serena', 'Karen', 'Moira', 'Kate', 'Tessa', 'Evan', 'Nathan', 'Tom', 'Daniel'];

  function score(v) {
    const id = (v.name || '') + ' ' + (v.voiceURI || '');
    let s = 0;
    if (NOVELTY.test(v.name)) s -= 100;
    if (ROBOTIC.test(v.name)) s -= 60;
    if (/premium/i.test(id)) s += 60;
    else if (/enhanced/i.test(id)) s += 40;
    if (/siri/i.test(id)) s += 35;
    if (/Online \(Natural\)/i.test(id)) s += 45; // Edge
    if (/^Google/i.test(v.name)) s += 20;      // Chrome
    const fav = FAVORITES.findIndex(n => new RegExp('\\b' + n + '\\b', 'i').test(v.name));
    if (fav >= 0) s += 15 - fav * 0.5;
    if (/en[-_]US/i.test(v.lang)) s += 5; else if (/en[-_]GB/i.test(v.lang)) s += 4; else if (/en[-_](AU|IE|NZ|CA)/i.test(v.lang)) s += 3;
    if (v.default) s += 1;
    return s;
  }
  function voices() {
    try { return (synth && synth.getVoices() || []).filter(v => /^en/i.test(v.lang)); } catch (e) { return []; }
  }
  function ranked() { return voices().map(v => ({ v, s: score(v) })).sort((a, b) => b.s - a.s).map(x => x.v); }
  let chosen = null;
  function pick() {
    let pinned = null;
    try { pinned = localStorage.getItem('gfk-voice'); } catch (e) {}
    const list = ranked();
    chosen = (pinned && list.find(v => v.voiceURI === pinned || v.name === pinned)) || list[0] || null;
    return chosen;
  }
  if (synth) { pick(); try { synth.addEventListener('voiceschanged', pick); } catch (e) {} }

  /* ---- recorded clips ---- */
  // manifest: { lines: {key: file}, voices: {character: {lines}}, packs: {file: [pack, start, length]} }
  // Clips can be bundled into a few "pack" files (tools/pack-voice.mjs) so the shelf stays under its file limit.
  let clips = null;
  const base = (document.currentScript && document.currentScript.dataset.voiceBase) || '../../voice/';
  try {
    if (location.protocol !== 'file:') fetch(base + 'manifest.json').then(r => r.ok ? r.json() : null)
      .then(m => { if (m && m.lines) clips = { base, lines: m.lines, voices: m.voices || {}, packs: m.packs || {} }; }).catch(() => {});
  } catch (e) {}
  const key = t => String(t).toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  // Cover a sentence with as few recorded pieces as possible, like "here is a bag of" + "5" + "acorn buns" + "for your shop".
  // Too many tiny pieces would sound choppy, so then it gives up and the device voice reads the line.
  function stitch(k, lines) {
    if (lines[k]) return [lines[k]];
    // Numbers past 100 are said in two pieces: 150 is "100" + "50".
    const w = k.split(' ').flatMap(t => /^[1-9]\d\d$/.test(t) && !lines[t] ? [String(t[0] * 100)].concat(+t.slice(1) ? [String(+t.slice(1))] : []) : [t]);
    const n = w.length, best = [[]];
    for (let i = 1; i <= n; i++) {
      for (let j = Math.max(0, i - 40); j < i; j++) {
        const f = best[j] && lines[w.slice(j, i).join(' ')];
        if (f && (!best[i] || best[j].length + 1 < best[i].length)) best[i] = best[j].concat(f);
      }
    }
    const p = best[n];
    return p && p.length <= Math.max(3, Math.ceil(n * 0.75)) ? p : null;
  }
  function planWith(text, lines) {
    const plan = [];
    for (const sentence of String(text).match(/[^.!?]+[.!?]*/g) || []) {
      const k = key(sentence); if (!k) continue;
      const p = stitch(k, lines);
      if (!p) return null; // one sentence without a recording: use one voice for the whole line so it sounds even
      plan.push(...p);
    }
    return plan.length ? plan : null;
  }
  // A character's own voice first (opts.voice, like "bramble"), then the main voice.
  function clipPlan(text, who) {
    if (!clips) return null;
    const own = who && clips.voices[who];
    return (own && planWith(text, own.lines)) || planWith(text, clips.lines);
  }
  const packs = {}, urls = {};
  function clipUrl(f) {
    const p = clips.packs[f];
    if (!p) return Promise.resolve(clips.base + f);
    if (!urls[f]) {
      packs[p[0]] = packs[p[0]] || fetch(clips.base + p[0]).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
      urls[f] = packs[p[0]].then(b => URL.createObjectURL(new Blob([b.slice(p[1], p[1] + p[2])], { type: 'audio/mpeg' })));
      urls[f].catch(() => { delete urls[f]; delete packs[p[0]]; });
    }
    return urls[f];
  }
  const audio = typeof Audio !== 'undefined' ? new Audio() : null;
  let queue = [], turn = 0, playing = false;
  function playNext() {
    if (!audio || !queue.length) { playing = false; return; }
    playing = true;
    const t = turn;
    clipUrl(queue.shift()).then(u => {
      if (t !== turn) return;
      audio.src = u;
      return audio.play();
    }).catch(() => { if (t === turn) { queue = []; playing = false; } });
  }
  if (audio) audio.addEventListener('ended', playNext);
  function stopClips() { queue = []; turn++; playing = false; if (audio) try { audio.pause(); } catch (e) {} }
  // Games call speechSynthesis.cancel() when they change screens; make that stop clips too.
  if (synth) try { const cancel = synth.cancel.bind(synth); synth.cancel = function () { stopClips(); cancel(); }; } catch (e) {}
  // iPad Safari only plays audio after a tap: unlock the player on the first touch.
  if (audio) document.addEventListener('pointerdown', function unlock() {
    document.removeEventListener('pointerdown', unlock, true);
    if (!audio.src) { audio.src = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA=='; audio.play().catch(() => {}); }
  }, true);

  function speak(text, opts) {
    opts = opts || {};
    if (!text) return;
    const plan = clipPlan(text, opts.voice);
    if (plan) {
      if (!opts.queue) { try { synth && synth.cancel(); } catch (e) { stopClips(); } }
      plan.forEach(f => clipUrl(f).catch(() => {})); // start unpacking every piece now, so they play without gaps
      queue.push(...plan);
      if (!playing) playNext();
      return;
    }
    if (!synth) return;
    try {
      if (!opts.queue) synth.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      const v = chosen || pick();
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      // A natural pitch: raised pitch is what made the old voice sound strained and creepy.
      u.rate = Math.min(1.05, Math.max(0.75, opts.rate || 0.92));
      u.pitch = Math.min(1.05, Math.max(0.95, opts.pitch || 1));
      synth.speak(u);
    } catch (e) {}
  }

  window.KidVoice = { speak, stop: () => { try { synth ? synth.cancel() : stopClips(); } catch (e) {} }, pick, ranked, score, current: () => chosen, key, plan: clipPlan };
})();
</script>

<script id="gfk-cards">
/* GFKCards: one card look, one pack-opening moment and one lucky-draw system for every game.
   Source of truth is this file; tools/sync-cards.py copies it into each game and the shelf
   as the "gfk-cards" script block so every index.html stays self-contained.

   Games call GFKCards.collect({game, id, name, emoji, rarity}) when she earns a card.
   It writes the card to the shared "gfk-collection" list (same shape as before), then:
   - Luck: a common or rare card can come out Shiny (holo). Never fewer than one Shiny in 7 packs.
   - Bonus: some packs also hold a Wonder Charm from a shared set, never a duplicate.
     Never more than 3 packs in a row without one.
   - Saved for last: each game's finale card is Legendary, and Crown Cards unlock at
     8, 20, 35, 55 and 80 cards collected across every game.
   Nothing is ever bought or lost. New cards wait in a glowing pack button; tapping it opens them.
   GFKCards.face(card) draws a card; GFKCards.view(cards, i) opens the big swipeable viewer. */
(function () {
  if (window.GFKCards) return;
  const KEY = "gfk-collection", LUCK = "gfk-cards-luck";
  const TIERS = { common: 0, rare: 1, sparkly: 2, legendary: 3 };
  const TIER_NAME = { common: "Common", rare: "Rare", sparkly: "Shiny", legendary: "Legendary" };
  const TIER_GEMS = { common: "●", rare: "◆◆", sparkly: "✦✦✦", legendary: "👑" };
  const SETS = {
    "moonlit-map": { name: "The Moonlit Map", icon: "🗺️", a: "#9fb4f0", b: "#3d5bb0" },
    "fairy-lantern-festival": { name: "Lantern Festival", icon: "🏮", a: "#f6c6ec", b: "#a24e93" },
    "gemling-grids": { name: "Crystal Caves", icon: "💎", a: "#a9eadf", b: "#2b7f75" },
    "egypt-puzzles": { name: "Miu's Pyramids", icon: "🔺", a: "#ffe3a1", b: "#c08523" },
    "mouse-shop": { name: "Acorn Bakery", icon: "🥐", a: "#f5d2b0", b: "#9a6038" },
    "pirate-voyage": { name: "The Shining Sea", icon: "⚓", a: "#a9dcf5", b: "#235f8c" },
    "wonder-charms": { name: "Wonder Charms", icon: "🍀", a: "#d9ccff", b: "#6a4fc4" },
    "wonder-crowns": { name: "Crown Cards", icon: "👑", a: "#fff0b3", b: "#c9931a" }
  };
  // Each game's very last reward is its Legendary card.
  const FINALES = { "egypt-puzzles": ["hidden-3"], "gemling-grids": ["card-r-moonFinale"], "fairy-lantern-festival": ["starwing"], "pirate-voyage": ["sea:5"], "mouse-shop": ["mouse-shop-moonbeam-the-unicorn-sparkly"] };
  const CROWNS = [
    { at: 8, id: "scarab", name: "The Golden Scarab", emoji: "🪲" },
    { at: 20, id: "fairy-queen", name: "The Fairy Queen", emoji: "🧚" },
    { at: 35, id: "crystal-dragon", name: "The Crystal Dragon", emoji: "🐉" },
    { at: 55, id: "moon-pegasus", name: "The Moon Pegasus", emoji: "🦄" },
    { at: 80, id: "wonder-crown", name: "The Crown of Wonders", emoji: "👑" }
  ];
  const CHARMS = [
    ["clover", "🍀", "Four-Leaf Clover", "common"], ["shell", "🐚", "Mermaid Shell", "common"], ["toadstool", "🍄", "Fairy Toadstool", "common"],
    ["moon", "🌙", "Moon Pebble", "common"], ["feather", "🪶", "Owl Feather", "common"], ["daisy", "🌼", "Daisy Chain", "common"],
    ["cupcake", "🧁", "Mouse-Size Cupcake", "common"], ["ribbon", "🎀", "Silk Ribbon", "common"], ["bell", "🔔", "Fairy Bell", "common"],
    ["teapot", "🫖", "Tiny Teapot", "common"], ["coin", "🪙", "Pirate Coin", "common"], ["compass", "🧭", "Lucky Compass", "common"],
    ["ladybird", "🐞", "Ladybird", "common"], ["acorn", "🌰", "Golden Acorn", "common"],
    ["butterfly", "🦋", "Rainbow Butterfly", "rare"], ["crystal", "🔮", "Crystal Ball", "rare"], ["amphora", "🏺", "Greek Amphora", "rare"],
    ["key", "🗝️", "Skeleton Key", "rare"], ["owl", "🦉", "Athena's Owl", "rare"], ["bastet", "🐈", "Bastet the Cat", "rare"],
    ["rainbow", "🌈", "Bottled Rainbow", "sparkly"], ["diamond", "💎", "Pirate Diamond", "sparkly"], ["star", "⭐", "Wishing Star", "sparkly"],
    ["wand", "🪄", "Fairy Wand", "sparkly"]
  ];
  const CHARM_WEIGHT = { common: 70, rare: 24, sparkly: 6 };
  const SHINY_CHANCE = { common: 0.12, rare: 0.2 }, SHINY_PITY = 7, BONUS_CHANCE = 0.3, BONUS_PITY = 3;

  const ls = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const tierOf = c => (c && TIERS[c.rarity] != null ? c.rarity : "common");
  const keyOf = c => (c.game || "") + "/" + (c.id || c.name);
  const reduced = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };

  function list() {
    const v = ls.get(KEY, []);
    if (!Array.isArray(v)) return [];
    return v.filter(x => x && typeof x === "object").map(x => (FINALES[x.game] || []).includes(x.id) ? Object.assign({}, x, { rarity: "legendary" }) : x);
  }

  /* ---------- card face ---------- */
  function face(c, opts) {
    opts = opts || {};
    const set = SETS[c.game] || { name: "Treasures", icon: "⭐", a: "#eadcc4", b: "#8a6a45" };
    const t = tierOf(c);
    const cls = ["gfc", "t-" + t, c.shiny ? "shiny" : "", opts.big ? "big" : "", opts.isNew ? "is-new" : ""].join(" ");
    return `<div class="${cls}" style="--a:${set.a};--b:${set.b}" role="img" aria-label="${esc(c.name)}, ${TIER_NAME[t]} card from ${esc(set.name)}">
      <div class="gfc-in">
        <div class="gfc-top"><span class="gfc-name">${esc(c.name || "Card")}</span></div>
        <div class="gfc-art"><span class="gfc-rays"></span><span class="gfc-emo">${esc(c.emoji || "⭐")}</span></div>
        <div class="gfc-bot"><span class="gfc-set">${set.icon} ${esc(set.name)}</span><span class="gfc-gem">${TIER_GEMS[t]}</span></div>
      </div>
      <div class="gfc-foil"></div><div class="gfc-glare"></div>
      ${opts.isNew ? '<span class="gfc-new">NEW</span>' : ""}
    </div>`;
  }
  function locked(crown) {
    return `<div class="gfc t-locked" role="img" aria-label="Locked Crown Card"><div class="gfc-in">
      <div class="gfc-top"><span class="gfc-name">Crown Card</span></div>
      <div class="gfc-art"><span class="gfc-emo">🔒</span></div>
      <div class="gfc-bot"><span class="gfc-set">Unlocks at ${crown.at} cards</span></div></div></div>`;
  }

  /* ---------- sounds ---------- */
  let AC = null;
  function tone(freq, at, dur, type, vol) {

function momentum() {

/* returns {skill, band, role} */
function chooseSlot(index) {
  const N = S.night;
  if (index === 0) {
    if (S.nights === 0 && S.history.length === 0) return { skill: 'c5', band: 'fixed', role: 'frontier', fixed: { kind: 'light', n: 3, cap: 5, fact: 'c3' } };
    const solved = masteredList().filter(id => S.skills[id].firstTry > 0);
    const id = solved.length ? pick(solved) : weightedReview();
    if (id) return { skill: id, band: 'easy', role: 'review' };
    const f = frontierOf('core') || 'c5';
    return { skill: f, band: 'easy', role: 'frontier' };
  }
  if (index === 7) {
    const mo = S.masteredOrder.filter(id => S.skills[id].status === 'mastered');
    const id = mo.length ? mo[mo.length - 1] : null;
    if (id && !wouldTriple(id)) return { skill: id, band: 'easy', role: 'review', moon: true };
    const alt = weightedReview(x => wouldTriple(x));
    if (alt) return { skill: alt, band: 'easy', role: 'review', moon: true };
    const f = frontierOf('core') || 'c5';
    return { skill: f, band: 'easy', role: 'frontier', moon: true };
  }
  const fronts = [];
  const fc = frontierOf('core'), fg = frontierOf('garland');
  if (fc) fronts.push(fc); if (fg) fronts.push(fg);
  const haveMastered = masteredList().length > 0;
  let useFront = fronts.length && (Math.random() < pStretch() || !haveMastered);
  let choice = null;
  if (useFront) {
    // alternate tracks
    let order = fronts.slice();
    if (fronts.length === 2) order = momentum() ? [fc, fg] : N.lastTrack === 'core' ? [fg, fc] : [fc, fg];
    for (const f of order) {
      const r = S.skills[f];
      if (r.stepBack > 0) {
        const p = prevSkill(f);
        r.stepBack--;
        if (p && S.skills[p].status === 'mastered' && !wouldTriple(p)) { choice = { skill: p, band: 'easy', role: 'stepback' }; }
        else if (!wouldTriple(f)) choice = { skill: f, band: 'easy', role: 'frontier' };
      } else if (!wouldTriple(f)) {
        const band = haveMastered ? (r.streak <= 1 ? (Math.random() < 0.7 ? 'easy' : 'full') : 'full') : 'easy';
        choice = { skill: f, band, role: 'frontier' };

    }

  if (!choice) {
    const id = weightedReview(x => wouldTriple(x));
    if (id) choice = { skill: id, band: 'full', role: 'review' };
  }
  if (!choice && fronts.length) {
    const f = fronts.find(x => !wouldTriple(x)) || fronts[0];
    choice = { skill: f, band: 'easy', role: 'frontier' };
  }
  if (!choice) choice = { skill: 'c10', band: 'full', role: 'review' };
  return choice;
}

function winItem(info) {
  const me = I; I.done = true; const cur = I.cur;
  const firstTry = !cur.missed && cur.hintStep === 0;
  SFX.chime(); fairyMood('loop');
  try { I.def.win && I.def.win(I, info); } catch (e) { console.warn(e); }
  NP.on && NP.dot(I.def.total(I));
  const line = I.def.winLine ? I.def.winLine(I) : '';
  const praise = pickPraise(I, firstTry);
  checkMilestones(cur, firstTry);
  recordResult(cur, firstTry);
  const N = S.night;
  N.items.push({ skill: cur.skill, fact: cur.params.fact, firstTry, hintStep: cur.hintStep, tools: cur.tools.slice() });
  S.petals.total++;
  const idx = N.index;
  N.index++; N.current = null;
  let nameLine = '';
  if (!N.nameUsed && idx >= 3) { N.nameUsed = true; nameLine = `Thank you, ${childName()}!`; }
  save();

  pendingMs = [];
  later(() => { if (alive(me)) fairySay(say, { queue: true }); }, 700);
  const dly = clamp(1800 + say.length * 40, 2600, 7000);

}
function floatToHook(me, idx) {

}
function nextItem() {

function startNight() {

    openModal(`<div class="queen" style="width:150px;height:196px">${queenSVG()}</div><div class="big">${line}</div><div style="opacity:.8;font-size:18px">Queen Elderflower</div><button class="btn" id="qgo">Let's begin!</button>`);

function endNight() {
  const N = S.night;
  if (N.inProgress) {
    N.inProgress = false; N.current = null; S.nights++;
    const g = N.glade; S.glades[g] = Math.min(5, (S.glades[g] || 0) + 1);
    const next = COMMONS.find(c => !S.cards.owned.includes(c.id));
    N.newCards = N.newCards || [];
    if (next) { S.cards.owned.push(next.id); addShared(next); N.newCards.unshift(next.id); }
    if (S.glades[g] >= 5) awardMilestone('glade');
    if (S.nights >= 25) awardMilestone('n25');
    S.nightLog.push({ date: dayKey(), ms: Date.now() - (N.startedAt || Date.now()), lanterns: N.items.length });
    if (S.nightLog.length > 120) S.nightLog = S.nightLog.slice(-120);
    save();

}
